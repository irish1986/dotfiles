---
# Every machine. The named profile (personal.yml or work.yml) and then the local file are layered on top: scalars and dictionaries are overridden key by key, lists are appended to (docs/adr/0002).
#
# Adding a tool is adding an entry below; roles/tools/defaults/main.yml documents each kind (docs/adr/0004).

tools_apt:
  - btop
  - libfreetype6 # tokenuse links it
  # The distro interpreter and its build headers. Interpreters for projects come from uv.
  - libssl-dev
  - python3
  - python3-pip
  - python3-venv

tools_apt_repos:
  # The archive's gh lags upstream by years.
  - name: github-cli
    uri: https://cli.github.com/packages
    key_url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    suite: stable
    packages:
      - gh
    verify: gh --version
  # The entry named docker also brings the daemon configuration.
  - name: docker
    uri: https://download.docker.com/linux/ubuntu
    key_url: https://download.docker.com/linux/ubuntu/gpg
    components:
      - stable
    packages:
      - containerd.io
      - docker-buildx-plugin
      - docker-ce
      - docker-ce-cli
      - docker-compose-plugin
    verify: docker --version

tools_debs:
  - name: fastfetch
    # renovate: datasource=github-releases depName=fastfetch-cli/fastfetch
    version: "2.68.1"
    url: https://github.com/fastfetch-cli/fastfetch/releases/download/{version}/fastfetch-linux-{arch}.deb

tools_binaries:
  # Token Use: token and cost usage across Claude Code, Copilot and other agents, read from their local session files. ~/.config/tokenuse is rewritten by the app, so it is yours to manage.
  - name: tokenuse
    # renovate: datasource=github-releases depName=russmckendrick/tokenuse
    version: "1.2.6"
    url: https://github.com/russmckendrick/tokenuse/releases/download/v{version}/tokenuse-linux-{arch}
    checksum_url: "{url}.sha256"

tools_scripts:
  # The upstream installer: GitHub Copilot CLI updates itself in place, so it is not pinned (docs/adr/0005). What the repo manages in ~/.copilot is in docs/adr/0008.
  - name: copilot
    url: https://gh.io/copilot-install
    interpreter: bash
    creates: .local/bin/copilot

# renovate: datasource=github-releases depName=nvm-sh/nvm
tools_nvm_version: "0.40.8"
# A major, so nvm takes its newest release at install time. Majors are Renovate PRs that wait for a human (docs/adr/0005).
# renovate: datasource=node-version depName=node
tools_node_version: "24"

# The same skills in every agent CLI (docs/adr/0008); personal.yml adds Claude Code to the agents.
tools_agent_skills:
  - source: herdrdev/herdr
    skills: [herdr]
  - source: mattpocock/skills
  # Drives the gh stack extension below.
  - source: github/gh-stack
    skills: [gh-stack]
tools_agent_skill_agents:
  - github-copilot
# renovate: datasource=npm depName=skills
tools_agent_skills_cli_version: "1.7.0"

tools_gh_extensions:
  - name: gh-aw
    repo: github/gh-aw
    verify: gh aw --version
  - name: gh-stack
    repo: github/gh-stack
    verify: gh stack --version

tools_uv_python: "3.14"

tools_uv_tools:
  - name: prek
    # renovate: datasource=pypi depName=prek
    version: "0.5.3"

tools_files:
  - src: btop/btop.conf
    dest: .config/btop/btop.conf
  - src: fastfetch/config.jsonc
    dest: .config/fastfetch/config.jsonc
  # One set of global instructions for every agent CLI (docs/adr/0008); personal.yml adds Claude Code's copy. 0700 is what each CLI creates its directory with: it holds credentials and session history.
  - src: agents/instructions.md
    dest: .copilot/copilot-instructions.md
    dir_mode: "0700"
