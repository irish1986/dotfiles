---
# Every machine. The named profile (home.yml or work.yml) and then the local file are layered on top: scalars and dictionaries are overridden key by key, lists are appended to. See docs/adr/0002-profiles-and-local-file.md.
#
# Adding a tool is adding an entry below; roles/tools/defaults/main.yml documents each kind (ADR 0003).

# Which roles run. The order here does not matter: main.yml runs roles in a fixed order (dotfiles_role_order), so a profile that appends a role still gets it at the right point.
dotfiles_roles:
  - update
  - system
  - fonts
  - wsl
  - zsh
  - user
  - tools
  - git
  - ssh
  - docker
  - herdr

tools_apt:
  - btop
  # The distro interpreter and its build headers. Interpreters for projects come from uv.
  - libssl-dev
  - python3
  - python3-pip
  - python3-venv

tools_apt_repos:
  # The archive's gh lags upstream by years. Named github-cli so machines that had the old github role reuse its .sources file.
  - name: github-cli
    uri: https://cli.github.com/packages
    key_url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    suite: stable
    probe: false
    packages:
      - gh
    verify: gh --version

tools_debs:
  # Not in the 24.04 archive.
  - name: fastfetch
    # renovate: datasource=github-releases depName=fastfetch-cli/fastfetch
    version: "2.68.1"
    url: https://github.com/fastfetch-cli/fastfetch/releases/download/{version}/fastfetch-linux-{arch}.deb

tools_archives:
  # sessionizer (herdr_plugins below) builds with bun. amd64 only: upstream names the asset x64.
  - name: bun
    # renovate: datasource=github-releases depName=oven-sh/bun extractVersion=^bun-v(?<version>.+)$
    version: "1.4.2"
    url: https://github.com/oven-sh/bun/releases/download/bun-v{version}/bun-linux-x64.zip
    checksums_url: https://github.com/oven-sh/bun/releases/download/bun-v{version}/SHASUMS256.txt
    member: bun-linux-x64/bun
  # The git tab of a sessionizer project space. Not in the 24.04 archive. amd64 only, like bun: upstream names the arm asset arm64, which neither {arch} nor {machine} produces.
  - name: lazygit
    # renovate: datasource=github-releases depName=jesseduffield/lazygit
    version: "0.65.1"
    url: https://github.com/jesseduffield/lazygit/releases/download/v{version}/lazygit_{version}_linux_x86_64.tar.gz
    checksums_url: https://github.com/jesseduffield/lazygit/releases/download/v{version}/checksums.txt
    member: lazygit

tools_scripts:
  # Also installed by scripts/setup before the first run; this entry covers a bare `ansible-playbook main.yml`.
  - name: uv
    url: https://astral.sh/uv/install.sh
    creates: .local/bin/uv
    env:
      UV_NO_MODIFY_PATH: "1"
  - name: nvm
    # renovate: datasource=github-releases depName=nvm-sh/nvm
    version: "0.40.8"
    url: https://raw.githubusercontent.com/nvm-sh/nvm/v{version}/install.sh
    interpreter: bash
    creates: .nvm/nvm.sh
    env:
      NVM_DIR: "{home}/.nvm"
      # /dev/null stops the installer appending to ~/.zshrc, which the zsh role owns; .zshrc loads nvm itself.
      PROFILE: /dev/null
    verify: . {home}/.nvm/nvm.sh && nvm --version
  # The native installer, not an apt repository: Claude Code updates itself in place, so it is not pinned (ADR 0004). ~/.claude is yours to manage (ADR 0006).
  - name: claude
    url: https://claude.ai/install.sh
    interpreter: bash
    creates: .local/bin/claude

tools_uv_python: "3.14"

tools_uv_tools:
  - name: prek
    # renovate: datasource=pypi depName=prek
    version: "0.5.3"

tools_files:
  - src: btop/btop.conf
    dest: .config/btop/btop.conf
  - src: fastfetch/config.jsonc
    dest: .config/fastfetch/config.jsonc

# Superseded tools, cleaned off machines provisioned before the refactor.
tools_remove_apt:
  - htop # btop
  - neofetch # fastfetch; archived upstream
  - tmux # herdr (ADR 0005)
tools_remove_paths:
  - .config/neofetch
  - .config/tmux
  - .tmux
  - .tmux.conf

# herdr plugins, pinned (roles/herdr/defaults/main.yml documents an entry).
herdr_plugins:
  # prefix+f: fuzzy-pick a project under ~/code and focus its space, or create it with the layout in roles/herdr/files/plugins/sessionizer.toml. Builds with bun (tools_archives above) and picks with fzf (zsh role).
  - id: sessionizer
    repo: andrewchng/herdr-sessionizer
    # renovate: datasource=github-tags depName=andrewchng/herdr-sessionizer
    ref: v0.8.4
    commit: b7b3bbae6cf3428f75b53c723c2008b6383e81f4
    config: sessionizer.toml
  # Per-agent usage in the sidebar: rate-limit use ($limit) and context fill ($context), placed by [ui.sidebar.agents] in roles/herdr/files/config.toml. Installs usagebar's prebuilt release binary; no toolchain needed. Its data also feeds the tab-bar segment (roles/herdr/files/herdr-usage-segment).
  - id: usagebar
    repo: senna-lang/herdr-agent-usage
    # renovate: datasource=github-tags depName=senna-lang/herdr-agent-usage
    ref: v0.5.16
    commit: 956aa4f3efa5e86f4d5f1665533210bb7eadaa09
