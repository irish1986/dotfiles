---
# Personal machines: base.yml plus what is listed here (specs/adr/0002).

# Your own public repositories, over SSH so you can push. Private ones are cloned by hand: this repo is public, and so would their names be.
git_repos:
  - url: git@github.com:irish1986/irish1986.git
    dest: ~/git/irish1986/irish1986
  - url: git@github.com:irishlab-io/.github.git
    dest: ~/git/irishlab-io/.github
  - url: git@github.com:irishlab-io/blog.git
    dest: ~/git/irishlab-io/blog
  - url: git@github.com:mighty-muffin/.github.git
    dest: ~/git/mighty-muffin/.github

tools_apt_repos:
  - name: tailscale
    uri: https://pkgs.tailscale.com/stable/ubuntu
    key_url: https://pkgs.tailscale.com/stable/ubuntu/{codename}.asc
    packages:
      - tailscale
    verify: tailscale version

tools_debs:
  - name: hugo
    # renovate: datasource=github-releases depName=gohugoio/hugo
    version: "0.169.0"
    url: https://github.com/gohugoio/hugo/releases/download/v{version}/hugo_extended_{version}_linux-{arch}.deb
    verify: hugo version

tools_scripts:
  - name: claude
    url: https://claude.ai/install.sh
    interpreter: bash
    creates: .local/bin/claude

tools_agent_skill_agents:
  - claude-code

tools_agent_mcp_servers:
  claude-code:
    github:
      type: http
      url: https://api.githubcopilot.com/mcp/
    Snyk:
      type: stdio
      command: npx
      args: [-y, snyk@latest, mcp, -t, stdio]
    terraform:
      type: stdio
      command: docker
      args: [run, -i, --rm, "hashicorp/terraform-mcp-server:{{ tools_terraform_mcp_version }}"]

tools_files:
  - src: agents/instructions.md
    dest: .claude/CLAUDE.md
    dir_mode: "0700"
