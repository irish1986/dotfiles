---
# Personal machines: base.yml plus what is listed here (docs/adr/0002).

tools_apt:
  - build-essential # cc, which cargo links with

tools_apt_repos:
  - name: tailscale
    uri: https://pkgs.tailscale.com/stable/ubuntu
    key_url: https://pkgs.tailscale.com/stable/ubuntu/{codename}.asc
    packages:
      - tailscale
    verify: tailscale version

tools_debs:
  # The archive lags badly and has no extended edition.
  - name: hugo
    # renovate: datasource=github-releases depName=gohugoio/hugo
    version: "0.166.0"
    url: https://github.com/gohugoio/hugo/releases/download/v{version}/hugo_extended_{version}_linux-{arch}.deb
    verify: hugo version

tools_scripts:
  # rustup rather than the archive's cargo, which is too old for many crates. rustup updates the toolchain itself.
  - name: rustup
    url: https://sh.rustup.rs
    creates: .cargo/bin/rustup
    args:
      - -y
      - --no-modify-path
      - --profile
      - default
      - --default-toolchain
      - stable
    env:
      CARGO_HOME: "{home}/.cargo"
      RUSTUP_HOME: "{home}/.rustup"
    verify: cargo --version && rustc --version
  # Claude Code updates itself in place, so it is not pinned (docs/adr/0005). What the repo manages in ~/.claude is in docs/adr/0008.
  - name: claude
    url: https://claude.ai/install.sh
    interpreter: bash
    creates: .local/bin/claude

# Claude Code's share of the agent skills in base.yml.
tools_agent_skill_agents:
  - claude-code

tools_files:
  - src: agents/instructions.md
    dest: .claude/CLAUDE.md
    dir_mode: "0700"
