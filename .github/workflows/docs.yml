---
name: Docs
run-name: Documentation build triggered by ${{ github.actor }}

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    paths:
      - .github/workflows/docs.yml
      - CHANGELOG.md
      - README.md
      - collections/requirements.yml
      - docs/**
      - mkdocs.yml
      - pyproject.toml
      - roles/**
      - scripts/gen_docs.py
      - uv.lock
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/docs.yml
      - CHANGELOG.md
      - README.md
      - collections/requirements.yml
      - docs/**
      - mkdocs.yml
      - pyproject.toml
      - roles/**
      - scripts/gen_docs.py
      - uv.lock
  workflow_dispatch:

# roles/** and collections/requirements.yml are in the path filters because role
# pages, the variables table and the collections table are generated from them at
# build time -- a role change with no docs/ change still changes the site.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git-revision-date-localized reads the log to date each page.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # --strict turns MkDocs warnings into failures, so a broken internal link
      # or a nav entry pointing at a missing file fails here rather than
      # shipping. MKDOCS_STRICT_ROLES additionally fails the build when a role
      # has no README, so a new role cannot land undocumented.
      - name: Build the site
        env:
          MKDOCS_STRICT_ROLES: "1"
        run: uv run mkdocs build --strict

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # Deploys through the OIDC artifact flow rather than committing a built site to
  # a gh-pages branch: no contents: write, and nothing generated is ever pushed
  # into the repository.
  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
