---
name: CI - Main
run-name: Continuous integration on main by ${{ github.actor }}

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    name: Lint (${{ matrix.group }})
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - group: ansible
            hooks: |
              ansible-lint
          - group: hygiene
            hooks: |
              check-added-large-files
              check-executables-have-shebangs
              check-json
              check-shebang-scripts-are-executable
              check-toml
              check-xml
              end-of-file-fixer
              forbid-submodules
              mixed-line-ending
              pretty-format-json
              trailing-whitespace
          - group: markdown
            hooks: |
              markdownlint
          - group: renovate
            hooks: |
              renovate-config-validator
          - group: shell
            hooks: |
              shellcheck shfmt
          - group: yaml
            hooks: |
              check-yaml yamllint

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run prek
        uses: j178/prek-action@af4d4fcb6922b8e6f65c0426947125fcc38794ce # v3.0.2
        with:
          extra-args: --all-files ${{ matrix.hooks }}

  bootstrap-smoke:
    name: Bootstrap Smoke
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read

    container:
      image: ubuntu:26.04
      options: --user root

    defaults:
      run:
        shell: bash

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Prepare the container
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            sudo ca-certificates git curl openssl python3
          useradd -m -s /bin/bash tester
          printf 'tester ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/90-tester
          chmod 0440 /etc/sudoers.d/90-tester
          git config --system --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: dotfiles

      - name: Refuse to run as root
        run: |
          set -euo pipefail
          chown -R tester:tester "${GITHUB_WORKSPACE}/dotfiles"
          if bash "${GITHUB_WORKSPACE}/dotfiles/scripts/setup" --no-pull --profile personal; then
            echo "::error::scripts/setup ran as root."
            exit 1
          fi

      - name: Refuse to run without a profile
        run: |
          set -euo pipefail
          if sudo -u tester -H env DOTFILES_DIR="${GITHUB_WORKSPACE}/dotfiles" \
            bash "${GITHUB_WORKSPACE}/dotfiles/scripts/setup" --no-pull; then
            echo "::error::scripts/setup ran with no profile."
            exit 1
          fi

      - name: First run
        run: |
          set -euo pipefail
          sudo -u tester -H env DOTFILES_DIR="${GITHUB_WORKSPACE}/dotfiles" NO_COLOR=1 \
            bash "${GITHUB_WORKSPACE}/dotfiles/scripts/setup" --no-pull --profile personal
          grep -qx 'dotfiles_profile: personal' /home/tester/.config/dotfiles/local.yml \
            || { echo "::error::The local file does not name the personal profile."; exit 1; }
          [[ "$(stat -c '%a %U' "${GITHUB_WORKSPACE}/dotfiles/.env")" == "600 tester" ]] \
            || { echo "::error::.env is not 0600 and owned by tester."; exit 1; }


  install:
    name: Install (${{ matrix.profile }})
    needs:
      - lint
      - bootstrap-smoke
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read

    strategy:
      fail-fast: true
      matrix:
        profile:
          - personal
          - work

    container:
      image: ubuntu:26.04
      options: --user root

    defaults:
      run:
        shell: bash

    env:
      DEBIAN_FRONTEND: noninteractive
      PROFILE: ${{ matrix.profile }}
      RAW_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}

    steps:
      - name: Prepare the container
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends sudo ca-certificates curl
          useradd -m -s /bin/bash tester
          printf 'tester ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/90-tester
          chmod 0440 /etc/sudoers.d/90-tester

      - name: Place the corporate CA
        run: |
          set -euo pipefail
          install -d /mnt/c/Users/tester
          curl -fsSL "${RAW_URL}/tests/fixtures/zscaler.cer" -o /mnt/c/Users/tester/zscaler.cer

      - name: Install with the one-liner
        run: |
          set -euo pipefail
          sudo -u tester -H env NO_COLOR=1 PROFILE="$PROFILE" RAW_URL="$RAW_URL" \
            bash -c 'bash -c "$(curl -fsSL "${RAW_URL}/scripts/setup")" -- --profile "$PROFILE"'
          [[ -f /home/tester/.config/dotfiles/local.yml ]] || { echo "::error::The first run created no local file."; exit 1; }

      - name: Fill in the local file
        run: |
          set -euo pipefail
          fixtures=/home/tester/.dotfiles/tests/fixtures
          install -o tester -g tester -m 0600 "${fixtures}/local-${PROFILE}.yml" /home/tester/.config/dotfiles/local.yml
          # The work run's env file names the public registries as its mirrors, so uv and npm go through the env-file path for real.
          if [[ $PROFILE == work ]]; then
            install -o tester -g tester -m 0600 "${fixtures}/env-work" /home/tester/.dotfiles/.env
          fi

      - name: Converge
        run: |
          set -euo pipefail
          sudo -u tester -H env NO_COLOR=1 /home/tester/.dotfiles/scripts/setup --no-pull --skip-tags update

      - name: Idempotence
        run: |
          set -euo pipefail
          sudo -u tester -H env NO_COLOR=1 /home/tester/.dotfiles/scripts/setup --no-pull --skip-tags update \
            | tee /tmp/idempotence.log
          if ! grep -qE 'changed=0[[:space:]]+unreachable=0[[:space:]]+failed=0' /tmp/idempotence.log; then
            echo "::error::The second run was not idempotent."
            grep -E '^changed:' -B2 /tmp/idempotence.log || true
            exit 1
          fi

  gating:
    name: Gating
    if: always()
    needs:
      - lint
      - bootstrap-smoke
      - install
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Aggregate results
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          set -euo pipefail
          echo "Upstream results: ${RESULTS}"
          # skipped is tolerated so conditional jobs can be added later without deadlocking the gate.
          if [[ "${RESULTS}" == *failure* || "${RESULTS}" == *cancelled* ]]; then
            echo "::error::One or more CI jobs did not succeed."
            exit 1
          fi
          echo "All required CI jobs succeeded or were skipped."
