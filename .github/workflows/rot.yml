---
name: Upstream Rot
run-name: Upstream rot check triggered by ${{ github.event_name }}

# main's install, daily (specs/adr/0009, 0012): catches a moved apt suite or a renamed release asset before the next real machine does. A copy of the install job in main.yml; keep the two in step.
on: # yamllint disable-line rule:truthy
  # Daily, after Renovate's 06:00 run, so it installs what Renovate merged that morning.
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  install:
    name: Install (${{ matrix.profile }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read

    # fail-fast: the first broken profile stops the run.
    strategy:
      fail-fast: true
      matrix:
        profile:
          - personal
          - work

    container:
      image: ubuntu:26.04
      options: --user root

    # Explicit: inside a container the runner picks the image's default shell, which is sh on some Ubuntu base images. `set -o pipefail` is a bashism and fails on line 1 there.
    defaults:
      run:
        shell: bash

    env:
      DEBIAN_FRONTEND: noninteractive
      PROFILE: ${{ matrix.profile }}
      # At the commit under test rather than the branch: raw.githubusercontent.com caches a branch URL for minutes, and would serve the previous script.
      RAW_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}

    steps:
      # Only what a fresh distro has: no git, openssl or python3, so scripts/setup installs them itself as it would on a real machine. No checkout either: the one-liner clones the repo.
      - name: Prepare the container
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends sudo ca-certificates curl
          useradd -m -s /bin/bash tester
          printf 'tester ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/90-tester
          chmod 0440 /etc/sudoers.d/90-tester

      # Before the first run: on work, scripts/setup trusts the corporate CA before it clones anything. Where work.yml looks for it: the Windows home of a user named tester.
      - name: Place the corporate CA
        run: |
          set -euo pipefail
          install -d /mnt/c/Users/tester
          curl -fsSL "${RAW_URL}/tests/fixtures/zscaler.cer" -o /mnt/c/Users/tester/zscaler.cer

      # The README's quick start, word for word: it clones to ~/.dotfiles, creates the local file and the env file, and stops.
      - name: Install with the one-liner
        run: |
          set -euo pipefail
          sudo -u tester -H env NO_COLOR=1 PROFILE="$PROFILE" RAW_URL="$RAW_URL" \
            bash -c 'bash -c "$(curl -fsSL "${RAW_URL}/scripts/setup")" -- --profile "$PROFILE"'
          [[ -f /home/tester/.config/dotfiles/local.yml ]] || { echo "::error::The first run created no local file."; exit 1; }

      # The edit the first run asks for, from the fixtures in the fresh clone.
      - name: Fill in the local file
        run: |
          set -euo pipefail
          fixtures=/home/tester/.dotfiles/tests/fixtures
          install -o tester -g tester -m 0600 "${fixtures}/local-${PROFILE}.yml" /home/tester/.config/dotfiles/local.yml
          # The work run's env file names the public registries as its mirrors, so uv and npm go through the env-file path for real.
          if [[ $PROFILE == work ]]; then
            install -o tester -g tester -m 0600 "${fixtures}/env-work" /home/tester/.dotfiles/.env
          fi

      # --skip-tags update omits a full apt upgrade: it is slow, and it is not what this job is testing. --no-pull: the clone is seconds old, and its origin is now the SSH URL, which CI has no key for.
      - name: Converge
        run: |
          set -euo pipefail
          sudo -u tester -H env NO_COLOR=1 /home/tester/.dotfiles/scripts/setup --no-pull --skip-tags update

      - name: Idempotence
        run: |
          set -euo pipefail
          sudo -u tester -H env NO_COLOR=1 /home/tester/.dotfiles/scripts/setup --no-pull --skip-tags update \
            | tee /tmp/idempotence.log
          if ! grep -qE 'changed=0[[:space:]]+unreachable=0[[:space:]]+failed=0' /tmp/idempotence.log; then
            echo "::error::The second run was not idempotent."
            grep -E '^changed:' -B2 /tmp/idempotence.log || true
            exit 1
          fi

  # Scheduled runs only: a dispatched run has you watching it already. One open issue at a time; the next green scheduled run closes it.
  report:
    name: Report
    needs:
      - install
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Open, update or close the Upstream rot issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.install.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Upstream rot
        run: |
          set -euo pipefail
          issue="$(gh issue list --state open --search "in:title \"${TITLE}\"" --json number,title \
            --jq "map(select(.title == \"${TITLE}\")) | first | .number // empty")"
          case "$RESULT" in
            success)
              if [[ -n $issue ]]; then
                gh issue close "$issue" --comment "Green again: ${RUN_URL}"
              fi
              ;;
            failure)
              if [[ -n $issue ]]; then
                gh issue comment "$issue" --body "Still failing: ${RUN_URL}"
              else
                # bug + needs-triage here: triage.yml skips issues a bot opens.
                gh issue create --title "$TITLE" --label bug --label needs-triage \
                  --body "The daily install of main failed: ${RUN_URL}"$'\n\n'"Something upstream moved (an apt suite, a release asset, a registry). This issue closes on the next green scheduled run."
              fi
              ;;
            # cancelled: a person stopped the run, and it says nothing about upstream.
            *) echo "Install result: ${RESULT}; leaving the issue as it is." ;;
          esac
