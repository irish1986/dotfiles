---
name: CI
run-name: Continuous integration triggered by ${{ github.actor }}

# Self-contained on purpose (ADR 0008): every job is defined here, so nothing outside this repository can change or weaken what is checked.
on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  # Any base branch, not only main: stacked pull requests target the branch below them and would otherwise get no checks at all.
  pull_request:
  # Weekly. The value of a scheduled run is catching upstream rot -- a moved apt suite, a renamed release asset, a new linter release -- not re-checking unchanged code.
  schedule:
    - cron: "32 6 * * 1"
  workflow_dispatch:

# No paths-ignore anywhere. With ci-ok as a required check, a filtered-out PR produces no check run at all and blocks forever.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # Every hook in .pre-commit-config.yaml -- yamllint, markdownlint, shellcheck, shfmt, ansible-lint and the rest -- and a failure fails the build. ggshield is skipped here only because the secrets job below runs it with the API key.
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run prek
        uses: j178/prek-action@cbc2f23eb5539cf20d82d1aabd0d0ecbcc56f4e3 # v2.0.2
        env:
          SKIP: ggshield

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # What ansible-lint cannot see: role layout, task-name prefixes, and every profile's roles existing and having a slot in dotfiles_role_order.
      - name: Check the role structure
        run: uv run --with pyyaml python scripts/check-structure

      - name: Test dotfiles-secrets
        run: bash tests/dotfiles-secrets.sh

      - name: Test the local-file setup
        run: bash tests/setup-local-file.sh

  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: GitGuardian/ggshield/actions/secret@3ff83341cab96f0ac0dddc1faffcd7ba9d1886ed # v1.49.0
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  pinned-actions:
    name: Pinned Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure every action is pinned by SHA
        uses: zgosalvez/github-actions-ensure-sha-pinned-actions@ca46236c6ce584ae24bc6283ba8dcf4b3ec8a066 # v5.0.4

  # A real converge of each profile in a clean container of each supported release, through the bootstrap, run twice. The second run asserting changed=0 is what catches a non-idempotent task; each role's verify phase and each tool entry's verify command are what catch "installed something that does not work".
  converge:
    name: Converge (${{ matrix.release }}, ${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        release:
          - "24.04"
          - "26.04"
        profile:
          - home
          - work

    container:
      image: ubuntu:${{ matrix.release }}
      options: --user root

    # Explicit: inside a container the runner picks the image's default shell, which is sh on some Ubuntu base images. `set -o pipefail` is a bashism and fails on line 1 there.
    defaults:
      run:
        shell: bash

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Prepare the container
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            sudo ca-certificates git curl python3
          useradd -m -s /bin/bash tester
          printf 'tester ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/90-tester
          chmod 0440 /etc/sudoers.d/90-tester
          git config --system --add safe.directory '*'

      # The work profile's network role needs a proxy that actually proxies: every download in both runs goes through it, so a proxy setting that fails to apply fails the job.
      - name: Start a proxy for the work profile
        if: matrix.profile == 'work'
        run: |
          set -euo pipefail
          apt-get install -y -qq --no-install-recommends tinyproxy
          tinyproxy -c /etc/tinyproxy/tinyproxy.conf
          for _ in $(seq 20); do
            curl -fsS -o /dev/null -x http://127.0.0.1:8888 https://github.com && exit 0
            sleep 1
          done
          echo "::error::tinyproxy did not start."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dotfiles

      - name: Install the local file
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          chown -R tester:tester "${GITHUB_WORKSPACE}/dotfiles"
          install -d -m 0755 /opt/dotfiles-ci
          install -m 0644 "${GITHUB_WORKSPACE}/dotfiles/tests/fixtures/test-ca.crt" /opt/dotfiles-ci/test-ca.crt
          install -d -o tester -g tester /home/tester/.config /home/tester/.config/dotfiles
          install -o tester -g tester -m 0600 \
            "${GITHUB_WORKSPACE}/dotfiles/tests/fixtures/local-${PROFILE}.yml" \
            /home/tester/.config/dotfiles/local.yml
          # The work fixture syncs a shell target from the local source (roles/secrets).
          install -d -o tester -g tester -m 0700 /home/tester/.config/dotfiles/secrets
          install -o tester -g tester -m 0600 \
            "${GITHUB_WORKSPACE}/dotfiles/tests/fixtures/secrets-shell.env" \
            /home/tester/.config/dotfiles/secrets/shell.env

      # --skip-tags update omits a full apt upgrade: it is slow, and it is not what this job is testing.
      - name: Converge
        run: |
          set -euo pipefail
          sudo -u tester -H env DOTFILES_DIR="${GITHUB_WORKSPACE}/dotfiles" NO_COLOR=1 \
            bash "${GITHUB_WORKSPACE}/dotfiles/scripts/setup" --yes --no-pull --skip-tags update

      - name: Idempotence
        run: |
          set -euo pipefail
          sudo -u tester -H env DOTFILES_DIR="${GITHUB_WORKSPACE}/dotfiles" NO_COLOR=1 \
            bash "${GITHUB_WORKSPACE}/dotfiles/scripts/setup" --yes --no-pull --skip-tags update \
            | tee /tmp/idempotence.log
          if ! grep -qE 'changed=0[[:space:]]+unreachable=0[[:space:]]+failed=0' /tmp/idempotence.log; then
            echo "::error::The second run was not idempotent."
            grep -E '^changed:' -B2 /tmp/idempotence.log || true
            exit 1
          fi

  # The single required status check. Matrix jobs report as "Converge (24.04, home)" and so on; one stable context is easier to require than four that change with the matrix.
  ci-ok:
    name: CI OK
    if: always()
    needs:
      - lint
      - secrets
      - pinned-actions
      - converge
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Aggregate results
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          set -euo pipefail
          echo "Upstream results: ${RESULTS}"
          # skipped is tolerated so conditional jobs can be added later without deadlocking the gate.
          if [[ "${RESULTS}" == *failure* || "${RESULTS}" == *cancelled* ]]; then
            echo "::error::One or more CI jobs did not succeed."
            exit 1
          fi
          echo "All required CI jobs succeeded or were skipped."
