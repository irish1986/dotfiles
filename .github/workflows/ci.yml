---
name: CI
run-name: Continuous integration triggered by ${{ github.actor }}

# Self-contained on purpose (specs/adr/0009): every job is defined here, so nothing outside this repository can change or weaken what is checked.
on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  # Any base branch, not only main: stacked pull requests target the branch below them and would otherwise get no checks at all.
  pull_request:
  # Weekly. The value of a scheduled run is catching upstream rot -- a moved apt suite, a renamed release asset, a new linter release -- not re-checking unchanged code.
  schedule:
    - cron: "32 6 * * 1"
  workflow_dispatch:

# No paths-ignore anywhere. With ci-ok as a required check, a filtered-out PR produces no check run at all and blocks forever.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run prek
        uses: j178/prek-action@cbc2f23eb5539cf20d82d1aabd0d0ecbcc56f4e3 # v2.0.2
        env:
          SKIP: ggshield


  pinned-actions:
    name: Pinned Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure every action is pinned by SHA
        uses: zgosalvez/github-actions-ensure-sha-pinned-actions@ca46236c6ce584ae24bc6283ba8dcf4b3ec8a066 # v5.0.4

  converge:
    name: Converge (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        profile:
          - personal
          - work

    container:
      image: ubuntu:26.04
      options: --user root

    # Explicit: inside a container the runner picks the image's default shell, which is sh on some Ubuntu base images. `set -o pipefail` is a bashism and fails on line 1 there.
    defaults:
      run:
        shell: bash

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Prepare the container
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            sudo ca-certificates git curl openssl python3
          useradd -m -s /bin/bash tester
          printf 'tester ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/90-tester
          chmod 0440 /etc/sudoers.d/90-tester
          git config --system --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dotfiles

      - name: Install the local file
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          chown -R tester:tester "${GITHUB_WORKSPACE}/dotfiles"
          install -d -o tester -g tester /home/tester/.config /home/tester/.config/dotfiles
          install -o tester -g tester -m 0600 \
            "${GITHUB_WORKSPACE}/dotfiles/tests/fixtures/local-${PROFILE}.yml" \
            /home/tester/.config/dotfiles/local.yml
          # Where work.yml looks for the corporate CA: the Windows home of a user named tester.
          install -D -m 0644 "${GITHUB_WORKSPACE}/dotfiles/tests/fixtures/zscaler.cer" /mnt/c/Users/tester/zscaler.cer
          # The work run's env file names the public registries as its mirrors, so uv and npm go through the env-file path for real.
          if [[ $PROFILE == work ]]; then
            install -o tester -g tester -m 0600 "${GITHUB_WORKSPACE}/dotfiles/tests/fixtures/env-work" "${GITHUB_WORKSPACE}/dotfiles/.env"
          fi

      # --skip-tags update omits a full apt upgrade: it is slow, and it is not what this job is testing.
      - name: Converge
        run: |
          set -euo pipefail
          sudo -u tester -H env DOTFILES_DIR="${GITHUB_WORKSPACE}/dotfiles" NO_COLOR=1 \
            bash "${GITHUB_WORKSPACE}/dotfiles/scripts/setup" --no-pull --skip-tags update

      - name: Idempotence
        run: |
          set -euo pipefail
          sudo -u tester -H env DOTFILES_DIR="${GITHUB_WORKSPACE}/dotfiles" NO_COLOR=1 \
            bash "${GITHUB_WORKSPACE}/dotfiles/scripts/setup" --no-pull --skip-tags update \
            | tee /tmp/idempotence.log
          if ! grep -qE 'changed=0[[:space:]]+unreachable=0[[:space:]]+failed=0' /tmp/idempotence.log; then
            echo "::error::The second run was not idempotent."
            grep -E '^changed:' -B2 /tmp/idempotence.log || true
            exit 1
          fi

  # The single required status check. Matrix jobs report as "Converge (personal)" and so on; one stable context is easier to require than ones that change with the matrix.
  ci-ok:
    name: CI OK
    if: always()
    needs:
      - lint
      - pinned-actions
      - converge
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Aggregate results
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          set -euo pipefail
          echo "Upstream results: ${RESULTS}"
          # skipped is tolerated so conditional jobs can be added later without deadlocking the gate.
          if [[ "${RESULTS}" == *failure* || "${RESULTS}" == *cancelled* ]]; then
            echo "::error::One or more CI jobs did not succeed."
            exit 1
          fi
          echo "All required CI jobs succeeded or were skipped."
