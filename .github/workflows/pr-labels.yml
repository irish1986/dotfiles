---
name: PR Labels
run-name: Area labels for PR-${{ github.event.pull_request.number }}

on: # yamllint disable-line rule:truthy
  # _target: runs the base branch's workflow with a write token, so labels land on fork pull requests too. Nothing here checks out the pull request's code.
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- the job never checks out or runs the pull request's code.
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  pr-labels:
    name: Area Labels
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      # Reads .github/labeler.yml from the base branch through the API; no checkout, so the pull request's code never runs with this token.
      - name: Label by changed paths
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
