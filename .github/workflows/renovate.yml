---
name: Repo - Renovate
run-name: Renovate triggered by ${{ github.event_name }}

on: # yamllint disable-line rule:truthy
  issues:
    types:
      - edited
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    name: Renovate
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.title == 'Renovate Dashboard' && github.event.sender.type != 'Bot')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions: {}

    steps:
      - name: Create an app token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Run Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
