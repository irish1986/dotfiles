---
name: Repo - Renovate
run-name: Renovate triggered by ${{ github.event_name }}

on: # yamllint disable-line rule:truthy
  issues:
    types:
      - edited
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    name: Renovate
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.title == 'Renovate Dashboard' && github.event.sender.type != 'Bot')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions: {}

    steps:
      - name: Create an app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Run Renovate
        uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
