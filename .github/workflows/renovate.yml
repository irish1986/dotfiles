---
name: Renovate
run-name: Renovate triggered by ${{ github.event_name }}

# Self-hosted rather than the Mend app (ADR 0013): the schedule and the Renovate version are ours, and nothing outside this repository decides when it runs.
on: # yamllint disable-line rule:truthy
  # Daily, 04:00-05:00 in Toronto depending on DST. The config carries no schedule of its own: this cron is the schedule.
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
  # A ticked checkbox on the Renovate Dashboard takes effect now rather than on the next daily run.
  issues:
    types:
      - edited
  # main requires branches to be up to date, so every merge leaves the other auto-merge bundles behind. Running on push rebases them straight away instead of one bundle a day.
  push:
    branches:
      - main

# Queued, never cancelled: a run cut short mid-branch leaves half-updated branches behind.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    name: Renovate
    # Only human edits to the dashboard. Renovate rewrites the dashboard itself on every run, and reacting to that would loop.
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.title == 'Renovate Dashboard' && github.event.sender.type != 'Bot')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {}

    steps:
      # A GitHub App token, not GITHUB_TOKEN: pull requests opened with GITHUB_TOKEN do not trigger CI, so CI OK would never report and nothing would auto-merge.
      - name: Create an app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Run Renovate
        uses: renovatebot/github-action@f3a31a786096ba6b40d0f0ffe11a494ef73bfa7c # v46.3.4
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
