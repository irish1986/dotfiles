---
name: Admin
run-name: Repository admin triggered by ${{ github.event_name }}

# Housekeeping, not CI: dependencies, labels, triage and the daily upstream-rot install. Each job picks the events it answers with its own `if:`.
on: # yamllint disable-line rule:truthy
  # One daily run, 01:00-02:00 in Toronto depending on DST. Renovate's config carries no schedule of its own: this cron is the schedule.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        default: all
        options:
          - all
          - renovate
          - labels
          - converge
          - stale
      dry-run:
        description: Labels only - report the changes without applying them
        type: boolean
        default: true
  # opened: triage. edited: a ticked checkbox on the Renovate Dashboard takes effect now rather than on the next daily run.
  issues:
    types:
      - opened
      - edited
  # The area labels. _target runs with the base branch's workflow and a write token; nothing here checks out the pull request's code.
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- only the pr-labels job answers it, and it never checks out the pull request.
    types:
      - opened
      - synchronize
      - reopened
  # main requires branches to be up to date, so every merge leaves the other auto-merge bundles behind. Running Renovate on push rebases them straight away instead of one bundle a day.
  push:
    branches:
      - main

# No workflow-level concurrency: triage and labels must not queue behind a Renovate run. Renovate sets its own below.
permissions: {}

jobs:
  # Self-hosted rather than the Mend app (specs/adr/0005): the schedule and the Renovate version are ours, and nothing outside this repository decides when it runs.
  renovate:
    name: Renovate
    # Only human edits to the dashboard. Renovate rewrites the dashboard itself on every run, and reacting to that would loop.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all", "renovate"]'), inputs.job)) ||
      (github.event_name == 'issues' && github.event.action == 'edited' &&
       github.event.issue.title == 'Renovate Dashboard' && github.event.sender.type != 'Bot')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions: {}

    # Queued, never cancelled: a run cut short mid-branch leaves half-updated branches behind.
    concurrency:
      group: ${{ github.workflow }}-renovate
      cancel-in-progress: false

    steps:
      # A GitHub App token, not GITHUB_TOKEN: pull requests opened with GITHUB_TOKEN do not trigger CI, so CI OK would never report and nothing would auto-merge.
      - name: Create an app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Run Renovate
        uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required

  labels:
    name: Sync Labels
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all", "labels"]'), inputs.job))
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    concurrency:
      group: ${{ github.workflow }}-labels
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sync labels
        uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          yaml-file: .github/labels.yml
          # true, deliberately. With false, any label absent from labels.yml is deleted repository-wide and stripped from every issue and PR that carries it. Flip only after a dry-run dispatch shows an acceptable diff.
          skip-delete: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}

  stale:
    name: Stale
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all", "stale"]'), inputs.job))
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write

    steps:
      # The Renovate Dashboard needs no exemption: Renovate rewrites it on every daily run, so it is never inactive.
      - name: Mark and close inactive issues and pull requests
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          stale-issue-label: stale
          stale-pr-label: stale
          days-before-issue-stale: 90
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 7
          exempt-issue-labels: hold,ready-for-agent,ready-for-human
          exempt-pr-labels: hold,type/major
          exempt-draft-pr: true
          stale-issue-message: No activity for 90 days. This closes in 14 days unless something changes.
          stale-pr-message: No activity for 30 days. This closes in 7 days unless something changes.

  triage:
    name: Triage
    # Every new issue a person opens, the owner's included; the Renovate Dashboard is opened by a bot.
    if: github.event_name == 'issues' && github.event.action == 'opened' && github.event.sender.type != 'Bot'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Label the issue needs-triage
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE" --add-label needs-triage

  pr-labels:
    name: Area Labels
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      # Reads .github/labeler.yml from the base branch through the API; no checkout, so the pull request's code never runs with this token.
      - name: Label by changed paths
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0

  # The upstream-rot check (specs/adr/0009, 0012): main's install, daily, to catch a moved apt suite or a renamed release asset before the next real machine does.
  converge:
    name: Upstream Rot (${{ matrix.profile }})
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all", "converge"]'), inputs.job))
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read

    # fail-fast: the first broken profile stops the run.
    strategy:
      fail-fast: true
      matrix:
        profile:
          - personal
          - work

    container:
      image: ubuntu:26.04
      options: --user root

    # Explicit: inside a container the runner picks the image's default shell, which is sh on some Ubuntu base images. `set -o pipefail` is a bashism and fails on line 1 there.
    defaults:
      run:
        shell: bash

    env:
      DEBIAN_FRONTEND: noninteractive
      PROFILE: ${{ matrix.profile }}
      # At the commit under test rather than the branch: raw.githubusercontent.com caches a branch URL for minutes, and would serve the previous script.
      RAW_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}

    steps:
      # Only what a fresh distro has: no git, openssl or python3, so scripts/setup installs them itself as it would on a real machine. No checkout either: the one-liner clones the repo.
      - name: Prepare the container
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends sudo ca-certificates curl
          useradd -m -s /bin/bash tester
          printf 'tester ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/90-tester
          chmod 0440 /etc/sudoers.d/90-tester

      # Before the first run: on work, scripts/setup trusts the corporate CA before it clones anything. Where work.yml looks for it: the Windows home of a user named tester.
      - name: Place the corporate CA
        run: |
          set -euo pipefail
          install -d /mnt/c/Users/tester
          curl -fsSL "${RAW_URL}/tests/fixtures/zscaler.cer" -o /mnt/c/Users/tester/zscaler.cer

      # The README's quick start, word for word: it clones to ~/.dotfiles, creates the local file and the env file, and stops.
      - name: Install with the one-liner
        run: |
          set -euo pipefail
          sudo -u tester -H env NO_COLOR=1 PROFILE="$PROFILE" RAW_URL="$RAW_URL" \
            bash -c 'bash -c "$(curl -fsSL "${RAW_URL}/scripts/setup")" -- --profile "$PROFILE"'
          [[ -f /home/tester/.config/dotfiles/local.yml ]] || { echo "::error::The first run created no local file."; exit 1; }

      # The edit the first run asks for, from the fixtures in the fresh clone.
      - name: Fill in the local file
        run: |
          set -euo pipefail
          fixtures=/home/tester/.dotfiles/tests/fixtures
          install -o tester -g tester -m 0600 "${fixtures}/local-${PROFILE}.yml" /home/tester/.config/dotfiles/local.yml
          # The work run's env file names the public registries as its mirrors, so uv and npm go through the env-file path for real.
          if [[ $PROFILE == work ]]; then
            install -o tester -g tester -m 0600 "${fixtures}/env-work" /home/tester/.dotfiles/.env
          fi

      # --skip-tags update omits a full apt upgrade: it is slow, and it is not what this job is testing. --no-pull: the clone is seconds old, and its origin is now the SSH URL, which CI has no key for.
      - name: Converge
        run: |
          set -euo pipefail
          sudo -u tester -H env NO_COLOR=1 /home/tester/.dotfiles/scripts/setup --no-pull --skip-tags update

      - name: Idempotence
        run: |
          set -euo pipefail
          sudo -u tester -H env NO_COLOR=1 /home/tester/.dotfiles/scripts/setup --no-pull --skip-tags update \
            | tee /tmp/idempotence.log
          if ! grep -qE 'changed=0[[:space:]]+unreachable=0[[:space:]]+failed=0' /tmp/idempotence.log; then
            echo "::error::The second run was not idempotent."
            grep -E '^changed:' -B2 /tmp/idempotence.log || true
            exit 1
          fi
