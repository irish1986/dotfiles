---
# Orchestrator only: no module calls other than include_vars / include_tasks.

- name: GGShield | Load release specific variables
  ansible.builtin.include_vars: "{{ ggshield_vars_file }}"
  loop: "{{ query('ansible.builtin.first_found', ggshield_vars_lookup) }}"
  loop_control:
    loop_var: ggshield_vars_file
  vars:
    ggshield_vars_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"
      skip: true
  tags:
    - ggshield
    - sec

- name: GGShield | Install
  ansible.builtin.include_tasks: "{{ ggshield_install_tasks }}"
  vars:
    ggshield_install_tasks: "{{ lookup('ansible.builtin.first_found', ggshield_install_lookup) }}"
    ggshield_install_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/tasks/install"
  tags:
    - ggshield
    - sec
    - install

- name: GGShield | Verify
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/verify.yml"
  when: not ansible_check_mode
  tags:
    - ggshield
    - sec
    - verify
