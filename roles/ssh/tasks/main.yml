---
# Orchestrator only: no module calls other than include_vars / include_tasks.

- name: SSH | Load release specific variables
  ansible.builtin.include_vars: "{{ ssh_vars_file }}"
  loop: "{{ query('ansible.builtin.first_found', ssh_vars_lookup) }}"
  loop_control:
    loop_var: ssh_vars_file
  vars:
    ssh_vars_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"
      skip: true
  tags:
    - ssh
    - base

- name: SSH | Install
  ansible.builtin.include_tasks: "{{ ssh_install_tasks }}"
  vars:
    ssh_install_tasks: "{{ lookup('ansible.builtin.first_found', ssh_install_lookup) }}"
    ssh_install_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/tasks/install"
  tags:
    - ssh
    - base
    - install

- name: SSH | Configure
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/configure.yml"
  tags:
    - ssh
    - base
    - configure

- name: SSH | Verify
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/verify.yml"
  when: not ansible_check_mode
  tags:
    - ssh
    - base
    - verify
