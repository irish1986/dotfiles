---
- name: SSH | Ensure the ssh directory exists
  ansible.builtin.file:
    path: "{{ ssh_dir }}"
    state: directory
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: "0700"

- name: SSH | Write the client configuration
  when: ssh_manage_config | bool
  block:
    - name: SSH | Ensure the control socket directory exists
      ansible.builtin.file:
        path: "{{ ssh_control_dir }}"
        state: directory
        owner: "{{ dotfiles_user }}"
        group: "{{ dotfiles_user }}"
        mode: "0700"

    # Appended, not templated: ~/.ssh/config is a file the user adds Host entries to, and this role owns only the trailing defaults. Landing at the end is also what makes the block work at all -- ssh takes the first value it finds for a keyword, so `Host *` above a host-specific block would win over it.
    #
    # validate runs `ssh -G` against the candidate file before it is installed. A typo'd keyword is a parse error that would otherwise break every ssh invocation on the machine, including the ones later in this play.
    - name: SSH | Write the hardened defaults
      ansible.builtin.blockinfile:
        path: "{{ ssh_config_file }}"
        marker: "# {mark} ANSIBLE MANAGED BLOCK defaults"
        create: true
        owner: "{{ dotfiles_user }}"
        group: "{{ dotfiles_user }}"
        mode: "0600"
        validate: "ssh -G -F %s example.com"
        block: |
          Host *
          {% for ssh_option in (ssh_config_options | combine(ssh_computed_config)) | dict2items %}
            {{ ssh_option.key }} {{ ssh_option.value }}
          {% endfor %}

- name: SSH | Write the server configuration
  when: ssh_server_enabled | bool
  become: true
  block:
    # sshd -t refuses to run without its privilege separation directory. systemd creates it when the service starts; without systemd (a container) nothing does.
    - name: SSH | Ensure the privilege separation directory exists
      ansible.builtin.file:
        path: /run/sshd
        state: directory
        owner: root
        group: root
        mode: "0755"

    # validate parses the drop-in on its own before it is installed: a typo'd keyword here would stop sshd from starting at all.
    - name: SSH | Write the hardened server defaults
      ansible.builtin.copy:
        dest: "{{ ssh_server_config_dropin }}"
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
        content: |
          # Managed by dotfiles (roles/ssh). Local changes are overwritten.
          {% for ssh_server_option in ssh_server_config_options | dict2items %}
          {{ ssh_server_option.key }} {{ ssh_server_option.value }}
          {% endfor %}
      notify: SSH | Reload sshd

- name: SSH | Import the GitHub public keys
  ansible.posix.authorized_key:
    user: "{{ dotfiles_user }}"
    key: "https://github.com/{{ ssh_github_user }}.keys"
    exclusive: false
  when:
    - ssh_import_github_keys | bool
    - ssh_github_user | length > 0

# ADR 0011. On WSL the key lives in the Windows profile and is generated there with ssh-keygen.exe, which needs Windows interop.
# The wsl role detects the Windows host, and --tags ssh alone skips it. Without this the Windows side would be skipped as though interop were down.
- name: SSH | Detect the Windows host
  ansible.builtin.include_role:
    name: wsl
    tasks_from: detect.yml
  when:
    - ssh_wsl_copy | bool
    - wsl_interop_available is not defined

- name: SSH | Report that the Windows side is unreachable
  ansible.builtin.debug:
    msg: >-
      Windows interop is not available, so the Windows SSH key, its copy into this distro and the GitHub keys were skipped. The wsl role reports why.
  when:
    - ssh_wsl_copy | bool
    - not (wsl_interop_available | default(false) | bool)

- name: SSH | Manage the key
  when: not (ssh_wsl_copy | bool) or (wsl_interop_available | default(false) | bool)
  block:
    - name: SSH | Create or rotate the key
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/key.yml"

    - name: SSH | Copy the Windows key into this distro
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/copy.yml"
      when:
        - ssh_wsl_copy | bool
        - ssh_key_public_body | length > 0

    - name: SSH | Add the key to GitHub
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/github.yml"
      when:
        - ssh_github_register | bool
        - ssh_key_public_body | length > 0
        - ssh_gh_binary is file
