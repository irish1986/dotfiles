---
- name: SSH | Query the ssh client
  ansible.builtin.command: ssh -V
  changed_when: false

- name: SSH | Check the ssh files
  ansible.builtin.stat:
    path: "{{ ssh_check.path }}"
  register: ssh_files
  loop:
    - { path: "{{ ssh_dir }}", mode: "0700" }
    - { path: "{{ ssh_config_file }}", mode: "0600" }
  loop_control:
    loop_var: ssh_check
    label: "{{ ssh_check.path }}"

# ssh refuses a key in a group-readable directory and ignores a config file others can write.
- name: SSH | Assert the ssh files are private
  ansible.builtin.assert:
    that:
      - ssh_file.stat.mode | default('missing') == ssh_file.ssh_check.mode
    fail_msg: "{{ ssh_file.ssh_check.path }} is {{ ssh_file.stat.mode | default('missing') }}, expected {{ ssh_file.ssh_check.mode }}."
    quiet: true
  loop: "{{ ssh_files.results }}"
  loop_control:
    loop_var: ssh_file
    label: "{{ ssh_file.ssh_check.path }}"

# -G resolves the config as a real connection would, without connecting; -T keeps ssh from asking for a terminal.
- name: SSH | Resolve the effective configuration
  ansible.builtin.command: ssh -T -G example.com
  register: ssh_effective
  changed_when: false

# What actually goes wrong: a `Host *` added above the managed block wins every keyword.
- name: SSH | Assert the managed defaults are in effect
  ansible.builtin.assert:
    that:
      - ssh_effective.stdout is search('(?im)^ciphers ' ~ (ssh_config_options.Ciphers | regex_escape) ~ '$')
    fail_msg: ssh resolves a different cipher list than {{ ssh_config_file }} sets; something above the managed block claims `Host *`.
    quiet: true

- name: SSH | Verify the machine key
  when: dotfiles_is_wsl | bool
  block:
    - name: SSH | Read the distro public key
      ansible.builtin.slurp:
        src: "{{ ssh_dir }}/{{ ssh_public_key }}"
      register: ssh_distro_key

    - name: SSH | Assert the distro key is the Windows key
      ansible.builtin.assert:
        that:
          - ssh_distro_key.content == ssh_public_key_content.content
          - (ssh_dir ~ '/' ~ ssh_private_key) is file
        fail_msg: "{{ ssh_dir }} does not hold the Windows key pair; re-run --tags ssh."
        success_msg: "{{ ssh_dir }}/{{ ssh_private_key }} is the Windows key"
        quiet: true
