---
- name: SSH | Query the ssh client
  ansible.builtin.command: ssh -V
  register: ssh_version_check
  changed_when: false
  failed_when: false

- name: SSH | Assert the client is usable
  ansible.builtin.assert:
    that:
      - ssh_version_check.rc == 0
    fail_msg: "openssh-client did not install correctly: {{ ssh_version_check.stderr | default('no output') }}"
    success_msg: "{{ ssh_version_check.stderr | trim }}"
    quiet: true

- name: SSH | Check the ssh directory permissions
  ansible.builtin.stat:
    path: "{{ ssh_dir }}"
  register: ssh_dir_check

- name: SSH | Assert the ssh directory is private
  ansible.builtin.assert:
    that:
      - ssh_dir_check.stat.exists
      - ssh_dir_check.stat.mode == '0700'
    fail_msg: >-
      {{ ssh_dir }} is {{ ssh_dir_check.stat.mode | default('missing') }}; ssh refuses to use a keypair in a group- or world-readable directory.
    success_msg: "{{ ssh_dir }} is 0700"
    quiet: true

- name: SSH | Verify the client configuration
  when: ssh_manage_config | bool
  block:
    - name: SSH | Check the configuration file permissions
      ansible.builtin.stat:
        path: "{{ ssh_config_file }}"
      register: ssh_config_stat

    - name: SSH | Assert the configuration file is private
      ansible.builtin.assert:
        that:
          - ssh_config_stat.stat.exists
          - ssh_config_stat.stat.mode == '0600'
        fail_msg: >-
          {{ ssh_config_file }} is {{ ssh_config_stat.stat.mode | default('missing') }}; ssh ignores a config file that is writable by anyone but its owner.
        success_msg: "{{ ssh_config_file }} is 0600"
        quiet: true

    # `ssh -G` resolves the config the way a real connection would, without connecting. Reading it back from the installed file catches a bad merge that the blockinfile validate step could not see, because validate only ever saw this role's own block.
    - name: SSH | Resolve the effective configuration
      # -T: with no remote command ssh plans an interactive session, and without it prints "Pseudo-terminal will not be allocated" because ansible's stdin is not a terminal.
      ansible.builtin.command: ssh -T -G example.com
      register: ssh_effective
      changed_when: false
      failed_when: false

    - name: SSH | Assert the configuration resolves
      ansible.builtin.assert:
        that:
          - ssh_effective.rc == 0
        fail_msg: "{{ ssh_config_file }} does not parse: {{ ssh_effective.stderr | default('no output') }}"
        success_msg: "{{ ssh_config_file }} parses"
        quiet: true

    # Not "are the defaults weak" -- OpenSSH has not shipped a CBC cipher in its default list for years, so that assertion would pass against an empty file and prove nothing. This asserts the block is the one being obeyed, which is the failure mode that actually happens: a `Host *` entry added above the marker silently wins every keyword, and the only visible symptom is an option that is present in the file and has no effect.
    - name: SSH | Assert the managed defaults are in effect
      ansible.builtin.assert:
        that:
          - ssh_effective.stdout is search('(?im)^ciphers ' ~ (ssh_config_options.Ciphers | regex_escape) ~ '$')
        fail_msg: >-
          ssh resolves a different cipher list than {{ ssh_config_file }} sets. Something above the managed block claims `Host *` -- ssh takes the first value it finds for a keyword, so that entry wins.
        success_msg: "the managed defaults are in effect"
        quiet: true

- name: SSH | Verify the key
  when:
    - ssh_generate_key | bool
    - not (ssh_wsl_agent | bool) or (wsl_interop_available | default(false) | bool)
  block:
    - name: SSH | Check the public key
      ansible.builtin.stat:
        path: "{{ ssh_dir }}/{{ ssh_public_key }}"
        follow: true
      register: ssh_key_check

    - name: SSH | Assert the key exists
      ansible.builtin.assert:
        that:
          - ssh_key_check.stat.exists
        fail_msg: "{{ ssh_dir }}/{{ ssh_public_key }} does not exist or does not resolve to {{ ssh_key_public_path }}."
        success_msg: "{{ ssh_dir }}/{{ ssh_public_key }} present"
        quiet: true

# End to end: through the socket, the relay and the pipe to the agent, asking for the one key ssh will offer. A warning rather than a failure, because a key with a passphrase is added by scripts/setup after this run.
- name: SSH | Verify the Windows agent
  when:
    - ssh_wsl_agent | bool
    - wsl_interop_available | default(false) | bool
    - dotfiles_has_user_systemd | bool
  block:
    - name: SSH | List the keys the Windows agent holds
      ansible.builtin.command: ssh-add -L
      environment:
        SSH_AUTH_SOCK: "{{ ssh_relay_socket }}"
      register: ssh_agent_keys
      changed_when: false
      failed_when: false

    # ssh-add exits 1 for an empty agent and 2 when it cannot reach one at all.
    - name: SSH | Assert the relay reaches the Windows agent
      ansible.builtin.assert:
        that:
          - ssh_agent_keys.rc in [0, 1]
        fail_msg: >-
          {{ ssh_relay_socket }} does not reach the Windows ssh-agent: {{ ssh_agent_keys.stderr | default('no output', true) | trim }}.
          Check `systemctl --user status {{ ssh_relay_unit }}.socket` and that the Windows ssh-agent service is running.
        success_msg: the relay reaches the Windows agent
        quiet: true

    - name: SSH | Report a key the agent does not hold
      ansible.builtin.debug:
        msg: >-
          The Windows ssh-agent does not hold {{ ssh_key_private_path }} yet, so ssh and git signing will fail.
          scripts/setup loads it after the run, asking for its passphrase once; or run: ssh-add.exe '{{ ssh_key_dir_windows.stdout | default('', true) | trim }}\{{ ssh_private_key }}'
      when: ssh_key_public_body | default('') not in ssh_agent_keys.stdout
