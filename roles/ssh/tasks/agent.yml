---
# WSL only (ADR 0010): the Windows ssh-agent serves the key to this distro through npiperelay, so the private key never leaves the Windows user profile, and a rotation reaches every distro at once.

# ── The Windows agent service ─────────────────────────────────────────────
# Windows ships it disabled. Starting it and making it automatic needs administrator rights, which a WSL process does not have, so this raises one UAC prompt on the Windows desktop -- only when the service is not already set up.
- name: SSH | Query the Windows agent service
  ansible.builtin.command:
    argv:
      - "{{ ssh_windows_powershell }}"
      - -NoProfile
      - -NonInteractive
      - -Command
      - "$s = Get-Service ssh-agent; '{0} {1}' -f $s.StartType, $s.Status"
    chdir: "{{ ssh_windows_c_drive }}"
  register: ssh_agent_service
  changed_when: false
  failed_when: ssh_agent_service.rc != 0
  check_mode: false

- name: SSH | Report the Windows agent service in check mode
  ansible.builtin.debug:
    msg: >-
      The Windows ssh-agent service is "{{ ssh_agent_service.stdout | trim }}". A real run raises a UAC prompt to make it Automatic and start it.
  when:
    - ansible_check_mode
    - (ssh_agent_service.stdout | trim) != 'Automatic Running'

# -PassThru and ExitCode: Start-Process does not otherwise report whether the elevated process succeeded, and declining the UAC prompt throws, which exits non-zero.
- name: SSH | Enable the Windows agent service
  ansible.builtin.command:
    argv:
      - "{{ ssh_windows_powershell }}"
      - -NoProfile
      - -NonInteractive
      - -Command
      - >-
        $p = Start-Process powershell -Verb RunAs -Wait -PassThru -WindowStyle Hidden
        -ArgumentList '-NoProfile','-NonInteractive','-Command','Set-Service ssh-agent -StartupType Automatic; Start-Service ssh-agent';
        exit $p.ExitCode
    chdir: "{{ ssh_windows_c_drive }}"
  register: ssh_agent_enabled
  changed_when: true
  failed_when: false
  when: (ssh_agent_service.stdout | trim) != 'Automatic Running'

- name: SSH | Assert the Windows agent service is running
  ansible.builtin.assert:
    that:
      - ssh_agent_enabled.rc == 0
    fail_msg: >-
      Could not enable the Windows ssh-agent service (the UAC prompt was declined, or it failed: {{ ssh_agent_enabled.stderr | default('', true) | trim }}).
      From an administrator PowerShell: Set-Service ssh-agent -StartupType Automatic; Start-Service ssh-agent -- then re-run.
    quiet: true
  when: ssh_agent_enabled is changed

# ── The relay ─────────────────────────────────────────────────────────────
- name: SSH | Deploy the relay
  when: dotfiles_has_user_systemd | bool
  block:
    - name: SSH | Ensure the user unit directory exists
      ansible.builtin.file:
        path: "{{ ssh_relay_unit_dir }}"
        state: directory
        owner: "{{ dotfiles_user }}"
        group: "{{ dotfiles_user }}"
        mode: "0755"

    - name: SSH | Deploy the relay units
      ansible.builtin.template:
        src: "{{ ssh_relay_template }}.j2"
        dest: "{{ ssh_relay_unit_dir }}/{{ ssh_relay_template }}"
        owner: "{{ dotfiles_user }}"
        group: "{{ dotfiles_user }}"
        mode: "0644"
      loop:
        - "{{ ssh_relay_unit }}.socket"
        - "{{ ssh_relay_unit }}@.service"
      loop_control:
        loop_var: ssh_relay_template
      register: ssh_relay_units
      notify: SSH | Reload the user daemon

    - name: SSH | Apply the unit changes
      ansible.builtin.meta: flush_handlers

    # Masked, not just stopped: the socket is enabled by the package and would come back at the next login, setting SSH_AUTH_SOCK to an empty Linux agent over the relay's.
    - name: SSH | Mask the distro's own ssh-agent
      ansible.builtin.systemd_service:
        name: "{{ ssh_distro_agent_unit }}"
        scope: user
        state: stopped
        masked: true
      loop: "{{ ssh_distro_agent_units }}"
      loop_control:
        loop_var: ssh_distro_agent_unit

    # Restarted when its units change: a daemon-reload alone leaves a running socket listening on its old paths. Connections in progress are separate instances and survive it.
    - name: SSH | Enable the relay
      ansible.builtin.systemd_service:
        name: "{{ ssh_relay_unit }}.socket"
        scope: user
        enabled: true
        state: "{{ 'restarted' if ssh_relay_units is changed else 'started' }}"
      when: not ansible_check_mode

- name: SSH | Warn that the relay needs systemd
  ansible.builtin.debug:
    msg: >-
      This distro has no systemd user manager, so the Windows agent relay is not running and ssh has no key. Enable systemd in /etc/wsl.conf (the wsl role does, by default) and restart the distro.
  when: not (dotfiles_has_user_systemd | bool)

# The user manager's environment reaches the services it starts, such as the herdr server and its shells. A login shell from wsl.exe, or one started before the relay existed, does not inherit it, so .zshenv sets it too -- only while the socket exists, so ssh never points at nothing.
- name: SSH | Point the shell at the relay
  ansible.builtin.blockinfile:
    path: "{{ ssh_zshenv }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK ssh"
    insertbefore: BOF
    create: true
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: "0600"
    block: |
      # The Windows ssh-agent, relayed by the {{ ssh_relay_unit }} user socket (ADR 0010).
      if [[ -S ${XDG_RUNTIME_DIR:-/run/user/$UID}/{{ ssh_relay_unit }}.sock ]]; then
        export SSH_AUTH_SOCK=${XDG_RUNTIME_DIR:-/run/user/$UID}/{{ ssh_relay_unit }}.sock
      fi

# ── The key in the agent ──────────────────────────────────────────────────
# Only a key this run generated: it has no passphrase, so adding it needs no prompt. A key with a passphrase is added by scripts/setup after the run, where there is a terminal to ask on. The agent keeps it across reboots either way.
- name: SSH | Load the new key into the Windows agent
  ansible.builtin.command:
    argv:
      - "{{ ssh_windows_add }}"
      - "{{ ssh_key_dir_windows.stdout | trim }}\\{{ ssh_private_key }}"
    chdir: "{{ ssh_windows_c_drive }}"
  changed_when: true
  when: ssh_key_generated | bool

# ── The public key in this distro ─────────────────────────────────────────
# A symlink, so a rotation on Windows is visible here immediately: IdentityFile and git's user.signingkey name this path, and both only need the public half.
- name: SSH | Inspect the existing key files
  ansible.builtin.stat:
    path: "{{ ssh_dir }}/{{ ssh_local_key }}"
  register: ssh_local_keys
  loop:
    - "{{ ssh_private_key }}"
    - "{{ ssh_public_key }}"
  loop_control:
    loop_var: ssh_local_key

# Left in place on purpose: it may be a key that exists nowhere else. It is no longer used -- IdentityFile names the public key, which the agent serves.
- name: SSH | Warn about a private key in this distro
  ansible.builtin.debug:
    msg: >-
      {{ ssh_dir }}/{{ ssh_private_key }} is a private key stored in this distro. ssh and git now use the Windows key through the agent, so it is unused;
      delete it once you are sure it is a copy of the Windows key or no longer needed.
  when: ssh_local_keys.results[0].stat.exists

- name: SSH | Warn about a replaced public key
  ansible.builtin.debug:
    msg: >-
      {{ ssh_dir }}/{{ ssh_public_key }} was a file of its own; it is replaced by a link to the Windows key, {{ ssh_key_public_path }}.
      If a private key in this distro still needs its public half, recreate it with ssh-keygen -y -f <private key>.
  when:
    - ssh_local_keys.results[1].stat.exists
    - not ssh_local_keys.results[1].stat.islnk

- name: SSH | Link the Windows public key
  ansible.builtin.file:
    src: "{{ ssh_key_public_path }}"
    dest: "{{ ssh_dir }}/{{ ssh_public_key }}"
    state: link
    force: true
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
