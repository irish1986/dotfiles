---
ssh_packages:
  - openssh-client

ssh_private_key: id_ed25519
ssh_public_key: id_ed25519.pub

# The machine key (docs/adr/0006): the Windows user's %USERPROFILE%\.ssh key, created there by hand and copied into ~/.ssh on every run. A distro copy that differs is overwritten and kept as a backup.
ssh_windows_dir: "{{ dotfiles_windows_home }}/.ssh"

# Add the key to the GitHub account gh is logged in to, as an authentication and a signing key. Needs the admin:public_key and admin:ssh_signing_key scopes; without them the run says how to grant them and carries on.
ssh_github_register: true
ssh_key_title: "{{ dotfiles_user }}@{{ dotfiles_hostname }}"

# Appended to ~/.ssh/config under `Host *`, after anything you add: ssh takes the first value it finds for each keyword, so a host-specific block above still wins.
#
# Rendered verbatim. Every value is quoted because unquoted yes/no is a YAML boolean, and ssh rejects `ForwardAgent True`.
#
# The algorithm lists are allowlists rather than the `-weak-thing` removal form: naming what is acceptable fails closed when a future OpenSSH adds something questionable. The cost is that a server offering nothing on these lists becomes unreachable.
ssh_config_options:
  # Crypto.
  KexAlgorithms: curve25519-sha256@libssh.org,curve25519-sha256,diffie-hellman-group-exchange-sha256
  Ciphers: chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr
  MACs: hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
  HostKeyAlgorithms: ssh-ed25519,ssh-ed25519-cert-v01@openssh.com,rsa-sha2-512,rsa-sha2-256
  # Host identity.
  StrictHostKeyChecking: "ask"
  HashKnownHosts: "yes"
  VerifyHostKeyDNS: "ask"
  # Learn a server's new keys once it has already authenticated with a known one, so rotation does not train the user to type "yes" at a changed-key warning.
  UpdateHostKeys: "yes"
  # Authentication. IdentitiesOnly stops ssh from walking every key in the agent and offering it to the server, which both leaks which keys exist and trips MaxAuthTries.
  PubkeyAuthentication: "yes"
  IdentitiesOnly: "yes"
  PasswordAuthentication: "no"
  KbdInteractiveAuthentication: "no"
  AddKeysToAgent: "yes"
  # A compromised or merely careless remote host can use an agent socket or an X11 channel to reach back. Neither is on unless a specific host needs it.
  ForwardAgent: "no"
  ForwardX11: "no"
  ForwardX11Trusted: "no"
  PermitLocalCommand: "no"
  # Connection hygiene.
  ServerAliveInterval: "60"
  ServerAliveCountMax: "3"
  Compression: "no"
  ControlMaster: "auto"
  ControlPersist: "10m"

# ── Paths ─────────────────────────────────────────────────────────────────
ssh_dir: "{{ dotfiles_home }}/.ssh"
ssh_config_file: "{{ ssh_dir }}/config"
# %C is a hash of the connection: a literal %r@%h:%p overflows the socket path limit on long host names.
ssh_control_dir: "{{ ssh_dir }}/sockets"
