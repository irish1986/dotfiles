---
ssh_packages:
  - openssh-client

ssh_private_key: id_ed25519
ssh_public_key: id_ed25519.pub

# Pull the public keys published on a GitHub profile into authorized_keys.
ssh_import_github_keys: true
ssh_github_user: "{{ git_user_login | default('') }}"

# ── The key (ADR 0011) ────────────────────────────────────────────────────
# One key per machine. On WSL it is the Windows user's key in %USERPROFILE%\.ssh, copied into ~/.ssh on every run; a distro copy that differs is overwritten and kept as a backup. Elsewhere it is this host's own ~/.ssh key.
ssh_copy_from_windows: true

# Generated when missing, without a passphrase: the run is unattended. A key you generated yourself, with a passphrase, is never replaced -- except by scripts/setup --rotate-ssh-key, which sets ssh_rotate_key.
ssh_generate_key: true
ssh_key_comment: "{{ dotfiles_user }}@{{ dotfiles_hostname }}"
ssh_rotate_key: false

# Add the key to the GitHub account gh is logged in to, as an authentication key and as a signing key. Needs the admin:public_key and admin:ssh_signing_key scopes; without them the run says how to grant them and carries on.
ssh_github_register: true

# Write the hardened `Host *` defaults into ~/.ssh/config. The block is appended, and it is the last thing in the file on purpose: ssh_config takes the FIRST value it obtains for each keyword, so a `Host *` block placed above a host-specific one would shadow it.
ssh_manage_config: true

# Rendered verbatim under `Host *`. Every value is quoted because unquoted yes/no is a YAML boolean, and ssh rejects `ForwardAgent True`.
#
# The algorithm lists are allowlists rather than the `-weak-thing` removal form: naming what is acceptable fails closed when a future OpenSSH adds something questionable. The cost is that a server offering nothing on these lists becomes unreachable -- see docs/roles/ssh.md for the escape hatch.
ssh_config_options:
  # Crypto. Everything here is available from OpenSSH 9.6, the oldest this repo targets (noble).
  KexAlgorithms: curve25519-sha256@libssh.org,curve25519-sha256,diffie-hellman-group-exchange-sha256
  Ciphers: chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr
  MACs: hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
  HostKeyAlgorithms: ssh-ed25519,ssh-ed25519-cert-v01@openssh.com,rsa-sha2-512,rsa-sha2-256
  # Host identity.
  StrictHostKeyChecking: "ask"
  HashKnownHosts: "yes"
  VerifyHostKeyDNS: "ask"
  # Learn a server's new keys once it has already authenticated with a known one, so rotation does not train the user to type "yes" at a changed-key warning.
  UpdateHostKeys: "yes"
  # Authentication. IdentitiesOnly stops ssh from walking every key in the agent and offering it to the server, which both leaks which keys exist and trips MaxAuthTries.
  PubkeyAuthentication: "yes"
  IdentitiesOnly: "yes"
  PasswordAuthentication: "no"
  KbdInteractiveAuthentication: "no"
  AddKeysToAgent: "yes"
  # A compromised or merely careless remote host can use an agent socket or an X11 channel to reach back. Neither is on unless a specific host needs it.
  ForwardAgent: "no"
  ForwardX11: "no"
  ForwardX11Trusted: "no"
  PermitLocalCommand: "no"
  # Connection hygiene.
  ServerAliveInterval: "60"
  ServerAliveCountMax: "3"
  Compression: "no"
  ControlMaster: "auto"
  ControlPersist: "10m"
