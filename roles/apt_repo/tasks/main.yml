---
- name: Apt Repo | Assert required inputs
  ansible.builtin.assert:
    that:
      - apt_repo_name | length > 0
      - apt_repo_uri | length > 0
      - apt_repo_key_url | length > 0
    fail_msg: apt_repo requires apt_repo_name, apt_repo_uri and apt_repo_key_url.
    quiet: true

# deb822_repository is implemented on top of python3-debian, which is not installed by default on a minimal Ubuntu image. Installed here so the role is self-sufficient rather than depending on caller ordering.
- name: Apt Repo | Install the deb822 dependency
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

# A HEAD against the suite's Release file, rather than a hardcoded codename map. A map is a permanent lie the moment the vendor catches up and someone has to notice and delete it; the probe self-heals on the next run. 403 and 404 both mean "not published here" for the CDNs in use.
- name: "Apt Repo | Probe the requested suite: {{ apt_repo_name ~ ' ' ~ apt_repo_suite }}"
  ansible.builtin.uri:
    url: "{{ apt_repo_uri }}/dists/{{ apt_repo_suite }}/Release"
    method: HEAD
    status_code:
      - 200
      - 403
      - 404
    timeout: 15
  register: apt_repo_probe_result
  changed_when: false
  check_mode: false
  become: false
  when:
    - apt_repo_probe | bool
    - apt_repo_suite_fallback | length > 0

- name: "Apt Repo | Select the effective suite: {{ apt_repo_name }}"
  ansible.builtin.set_fact:
    apt_repo_effective_suite: >-
      {{ apt_repo_suite
         if (apt_repo_probe_result.status | default(200)) == 200
         else apt_repo_suite_fallback }}

- name: "Apt Repo | Report the suite fallback: {{ apt_repo_name }}"
  ansible.builtin.debug:
    msg: >-
      {{ apt_repo_name }} does not publish a suite for {{ apt_repo_suite }} yet; falling back to {{ apt_repo_effective_suite }}.
  when: apt_repo_effective_suite != apt_repo_suite

- name: "Apt Repo | Configure the repository: {{ apt_repo_name }}"
  ansible.builtin.deb822_repository:
    name: "{{ apt_repo_name }}"
    types: "{{ apt_repo_types }}"
    uris: "{{ apt_repo_uri }}"
    suites: "{{ apt_repo_effective_suite }}"
    components: "{{ apt_repo_components }}"
    architectures: "{{ apt_repo_architectures }}"
    signed_by: "{{ apt_repo_key_url }}"
    state: present
    enabled: true
    mode: "0644"
  become: true
  register: apt_repo_configured

- name: "Apt Repo | Refresh the apt cache: {{ apt_repo_name }}"
  ansible.builtin.apt:
    update_cache: true
  become: true
  when: apt_repo_configured is changed
