---
# Orchestrator only: no module calls other than include_vars / include_tasks.
# That is what keeps the generic/OS-specific split legible, and stops generic
# tasks accreting onto the end of a dispatcher.

- name: Docker | Load release specific variables
  ansible.builtin.include_vars: "{{ docker_vars_file }}"
  loop: "{{ query('ansible.builtin.first_found', docker_vars_lookup) }}"
  loop_control:
    loop_var: docker_vars_file
  vars:
    docker_vars_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"
      skip: true
  tags:
    - docker
    - containers

# Note the asymmetry with the vars lookup above: that one is optional
# (skip: true), this one is not. An unsupported distribution -- or a typo like
# the old cloudinit/tasks/Ubunu.yml -- now fails the play instead of silently
# doing nothing.
- name: Docker | Install
  ansible.builtin.include_tasks: "{{ docker_install_tasks }}"
  vars:
    docker_install_tasks: "{{ lookup('ansible.builtin.first_found', docker_install_lookup) }}"
    docker_install_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/tasks/install"
  tags:
    - docker
    - containers
    - install

- name: Docker | Configure
  ansible.builtin.include_tasks: configure.yml
  tags:
    - docker
    - containers
    - configure

- name: Docker | Verify
  ansible.builtin.include_tasks: verify.yml
  when: not ansible_check_mode
  tags:
    - docker
    - containers
    - verify
