---
- name: Docker | Install dependencies
  ansible.builtin.apt:
    name: "{{ docker_dependencies }}"
    state: present
  become: true

- name: Docker | Remove pre-deb822 repository artefacts
  ansible.builtin.file:
    path: "{{ docker_legacy_artifact }}"
    state: absent
  become: true
  loop: "{{ docker_legacy_artifacts }}"
  loop_control:
    loop_var: docker_legacy_artifact

- name: Docker | Configure the upstream apt repository
  ansible.builtin.include_role:
    name: apt_repo
  vars:
    apt_repo_name: docker
    apt_repo_uri: "{{ docker_apt_uri }}"
    apt_repo_key_url: "{{ docker_apt_key_url }}"
    apt_repo_suite: "{{ docker_apt_suite }}"
    apt_repo_suite_fallback: "{{ docker_apt_suite_fallback }}"
    apt_repo_components: "{{ docker_apt_components }}"

- name: Docker | Install packages
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
