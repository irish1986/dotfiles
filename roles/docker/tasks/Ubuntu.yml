---
- name: Docker | Install dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
  become: true

- name: Docker | Add GPG key
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
    keyring: /etc/apt/keyrings/docker.gpg
    state: present
  become: true

- name: Docker | Get System Architecture
  ansible.builtin.command: dpkg --print-architecture
  register: dpkg_architecture
  changed_when: false
  failed_when: false
  check_mode: false

- name: Docker | Add APT repository
  ansible.builtin.apt_repository:
    repo: |
      deb [arch={{ dpkg_architecture.stdout }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable
    filename: docker
    mode: "0644"
  become: true

- name: Docker | Install packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  become: true

# Gated on systemd rather than on "not WSL": WSL2 with systemd=true in wsl.conf
# does have systemd and does want Docker enabled, while a CI container has no
# systemd at all. The old `not is_wsl` check expressed neither.
- name: Docker | Enable service
  ansible.builtin.systemd:
    enabled: true
    name: docker
    state: started
  become: true
  when:
    - dotfiles_has_systemd | bool

- name: Docker | Add to group
  ansible.builtin.user:
    name: "{{ dotfiles_user }}"
    groups: docker
    append: true
  become: true

# data-root is left at Docker's default (/var/lib/docker) unless docker.data_root
# is set explicitly. Relocating it into $HOME buys nothing on WSL -- /home and
# /var live in the same ext4.vhdx -- and Docker requires the directory to be
# root-owned 0710, which is hostile to anything that walks the home directory.
- name: Docker | Ensure the data root exists
  ansible.builtin.file:
    path: "{{ docker.data_root }}"
    state: directory
    owner: root
    group: root
    mode: "0710"
  become: true
  when: docker.data_root | default(none)

- name: Docker | Copy daemon.json
  ansible.builtin.template:
    dest: /etc/docker/daemon.json
    src: daemon.json.j2
    mode: "0644"
    validate: /usr/bin/dockerd --validate --config-file %s
  become: true
  notify: Restart Docker
