---
docker_packages:
  - containerd.io
  - docker-buildx-plugin
  - docker-ce
  - docker-ce-cli
  - docker-compose-plugin

docker_dependencies:
  - ca-certificates
  - curl
  - gnupg

# Image/container/volume store. Left unset so Docker uses its default, /var/lib/docker. Relocating it into $HOME buys nothing on WSL -- /home and /var share one ext4.vhdx -- and Docker requires the directory root-owned 0710, which is hostile to anything that walks the home directory.
docker_data_root: ""

docker_address_pool_base: 172.10.0.0/16
docker_address_pool_size: 24
docker_experimental: true
docker_buildkit: true

# download.docker.com publishes one suite per Ubuntu codename and lags new releases. apt_repo probes the suite and falls back to noble when absent.
docker_apt_uri: "https://download.docker.com/linux/{{ ansible_distribution | lower }}"
docker_apt_key_url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
docker_apt_suite: "{{ ansible_distribution_release }}"
docker_apt_suite_fallback: noble
docker_apt_components:
  - stable
