---
# Orchestrator only: no module calls other than include_vars / include_tasks.

- name: BW | Load release specific variables
  ansible.builtin.include_vars: "{{ bw_vars_file }}"
  loop: "{{ query('ansible.builtin.first_found', bw_vars_lookup) }}"
  loop_control:
    loop_var: bw_vars_file
  vars:
    bw_vars_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"
      skip: true
  tags:
    - bw
    - sec

- name: BW | Install
  ansible.builtin.include_tasks: "{{ bw_install_tasks }}"
  vars:
    bw_install_tasks: "{{ lookup('ansible.builtin.first_found', bw_install_lookup) }}"
    bw_install_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/tasks/install"
  tags:
    - bw
    - sec
    - install

- name: BW | Verify
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/verify.yml"
  when: not ansible_check_mode
  tags:
    - bw
    - sec
    - verify
