---
# Orchestrator only: no module calls other than include_vars / include_tasks.

- name: Prek | Load release specific variables
  ansible.builtin.include_vars: "{{ prek_vars_file }}"
  loop: "{{ query('ansible.builtin.first_found', prek_vars_lookup) }}"
  loop_control:
    loop_var: prek_vars_file
  vars:
    prek_vars_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"
      skip: true
  tags:
    - prek
    - dev

- name: Prek | Install
  ansible.builtin.include_tasks: "{{ prek_install_tasks }}"
  vars:
    prek_install_tasks: "{{ lookup('ansible.builtin.first_found', prek_install_lookup) }}"
    prek_install_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/tasks/install"
  tags:
    - prek
    - dev
    - install

- name: Prek | Verify
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/verify.yml"
  when: not ansible_check_mode
  tags:
    - prek
    - dev
    - verify
