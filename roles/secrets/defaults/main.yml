---
# Secrets for the shell and for project .env files (ADR 0012). The repository wires the delivery; every value, and every name, lives in the local file or at the source -- never in a profile: this repository is public.
#
# With secrets_targets empty the role only installs dotfiles-secrets, so enabling it costs nothing on a machine that has no secrets yet. The Infisical CLI itself is a tools_apt_repos entry in profiles/home.yml.

# Where secrets come from, set explicitly per machine -- never guessed, so a missing credential is an error rather than a quiet switch to stale files.
#   infisical  Infisical Cloud, as a machine identity (universal auth). Its client ID and secret go in ~/.config/infisical/universal-auth, 0600; scripts/setup asks for them once.
#   local      hand-written dotenv files in ~/.config/dotfiles/secrets/<target name>.env, 0600. For machines without Infisical access.
secrets_source: ""

# Infisical project ID (Project Settings in the dashboard). Required with the infisical source.
secrets_infisical_project: ""

# What gets written, and where. One entry per target:
#   name  identifies the target; with the local source it names ~/.config/dotfiles/secrets/<name>.env
#   dest  `shell` for the cache every zsh sources (in RAM, fetched once per boot), or the path of a project .env file, which git must ignore when it is inside a repository
#   env   Infisical environment slug (default dev); ignored by the local source
#   path  Infisical folder (default /); ignored by the local source
# e.g.
#   - { name: shell, dest: shell, env: prod, path: /shell }
#   - { name: myapp, dest: ~/git/me/myapp/.env, env: dev, path: /myapp }
secrets_targets: []
