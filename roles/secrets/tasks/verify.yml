---
- name: Secrets | Query dotfiles-secrets
  ansible.builtin.command:
    argv:
      - "{{ secrets_script_path }}"
      - path
  register: secrets_path_check
  changed_when: false
  failed_when: false

- name: Secrets | Assert dotfiles-secrets runs
  ansible.builtin.assert:
    that:
      - secrets_path_check.rc == 0
    fail_msg: "{{ secrets_script_path }} does not run: {{ secrets_path_check.stderr | default('no output') }}"
    success_msg: "{{ secrets_script_path }} runs"
    quiet: true

- name: Secrets | Query the Infisical CLI
  ansible.builtin.command: infisical --version
  register: secrets_cli_check
  changed_when: false
  failed_when: false
  when: secrets_use_infisical | bool

- name: Secrets | Assert the Infisical CLI is usable
  ansible.builtin.assert:
    that:
      - secrets_cli_check.rc == 0
    fail_msg: >-
      secrets_source is infisical but the infisical CLI does not run ({{ secrets_cli_check.stderr | default('not installed', true) | trim }}).
      It is a tools_apt_repos entry in profiles/home.yml; a machine on another profile needs the entry in its local file.
    success_msg: "{{ secrets_cli_check.stdout | trim }}"
    quiet: true
  when: secrets_use_infisical | bool

- name: Secrets | Verify the targets
  when: secrets_has_targets | bool
  block:
    - name: Secrets | Check the private files
      ansible.builtin.stat:
        path: "{{ secrets_private_file }}"
      register: secrets_private_check
      loop: >-
        {{ [secrets_config_file]
           + ([secrets_credentials_file] if (secrets_use_infisical | bool) else [])
           + (secrets_targets | rejectattr('dest', 'eq', 'shell') | map(attribute='dest') | map('expanduser') | list)
           + ([secrets_path_check.stdout | trim] if (secrets_has_shell_target | bool) else []) }}
      loop_control:
        loop_var: secrets_private_file

    - name: Secrets | Assert every file is written and private
      ansible.builtin.assert:
        that:
          - secrets_private_result.stat.exists
          - secrets_private_result.stat.mode == '0600'
        fail_msg: >-
          {{ secrets_private_result.secrets_private_file }} is {{ secrets_private_result.stat.mode | default('missing') }}; expected 0600.
          dotfiles-secrets sync reports why a target was not written.
        success_msg: "{{ secrets_private_result.secrets_private_file }} is 0600"
        quiet: true
      loop: "{{ secrets_private_check.results }}"
      loop_control:
        loop_var: secrets_private_result
        label: "{{ secrets_private_result.secrets_private_file }}"
