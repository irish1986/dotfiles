---
# Caught here rather than by dotfiles-secrets half-way through a sync.
- name: Secrets | Assert the configuration is complete
  ansible.builtin.assert:
    that:
      - secrets_source in ['infisical', 'local']
      - not (secrets_use_infisical | bool) or secrets_infisical_project | length > 0
      - secrets_targets | rejectattr('name', 'defined') | list | length == 0
      - secrets_targets | rejectattr('dest', 'defined') | list | length == 0
      - secrets_targets | map(attribute='name') | unique | list | length == secrets_targets | length
    fail_msg: >-
      secrets_targets is set, so the local file ({{ dotfiles_local_file }}) must also set secrets_source to infisical or local,
      secrets_infisical_project with the infisical source, and a unique name and a dest for every target.
    quiet: true
  when: secrets_has_targets | bool

- name: Secrets | Ensure the bin directory exists
  ansible.builtin.file:
    path: "{{ secrets_script_path | dirname }}"
    state: directory
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: "0755"

- name: Secrets | Install dotfiles-secrets
  ansible.builtin.copy:
    src: dotfiles-secrets
    dest: "{{ secrets_script_path }}"
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: "0755"

- name: Secrets | Ensure the private directories exist
  ansible.builtin.file:
    path: "{{ secrets_private_dir }}"
    state: directory
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: "0700"
  loop: "{{ [secrets_credentials_file | dirname] if (secrets_use_infisical | bool) else [secrets_local_dir] }}"
  loop_control:
    loop_var: secrets_private_dir
  when: secrets_has_targets | bool

- name: Secrets | Write the dotfiles-secrets config
  ansible.builtin.template:
    src: secrets.conf.j2
    dest: "{{ secrets_config_file }}"
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: "0600"
  when: secrets_has_targets | bool

# Above the herdr block, whose exec ends every login shell's .zshenv, and below the network block, so a first-shell fetch goes through the proxy. insertbefore falls back to the end of the file when herdr has not written its block yet; herdr then appends below this one.
#
# The cache path is the one dotfiles-secrets uses; it is fixed so every shell and the playbook agree on it. Only interactive shells fetch: `zsh -c` in scripts and editors never waits on the network. A failed fetch prints one line and the shell starts without the variables; `dotfiles-secrets sync --shell` says why.
- name: Secrets | Manage the shell environment
  ansible.builtin.blockinfile:
    path: "{{ secrets_zshenv }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK secrets"
    insertbefore: "^# BEGIN ANSIBLE MANAGED BLOCK herdr$"
    state: "{{ 'present' if (secrets_has_targets | bool and secrets_has_shell_target | bool) else 'absent' }}"
    create: true
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: "0600"
    block: |
      # Secrets for every shell (ADR 0012): a cache in RAM, fetched by the first interactive shell after a boot. `dotfiles-secrets sync --shell` refreshes it.
      _dotfiles_secrets=/dev/shm/dotfiles-secrets-$UID/shell.env
      if [[ ! -r $_dotfiles_secrets && -o interactive && -x {{ secrets_script_path }} ]]; then
        timeout 3 {{ secrets_script_path }} sync --shell > /dev/null 2>&1 \
          || print -u2 "dotfiles-secrets: this shell has no secrets; run: dotfiles-secrets sync --shell"
      fi
      if [[ -r $_dotfiles_secrets ]]; then
        set -a && source $_dotfiles_secrets && set +a
      fi
      unset _dotfiles_secrets

# Last, so every target reflects this run's config. Fails the run when any target fails; the ones that could not be fetched keep their last good file.
- name: Secrets | Sync the targets
  ansible.builtin.command:
    argv:
      - "{{ secrets_script_path }}"
      - sync
  register: secrets_sync
  changed_when: secrets_sync.stdout is search('(?m)^updated ')
  when:
    - secrets_has_targets | bool
    - not ansible_check_mode
