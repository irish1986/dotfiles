---
# Orchestrator only: no module calls other than include_vars / include_tasks. Nothing to install here: the Infisical CLI is a tools_apt_repos entry (profiles/home.yml, ADR 0003), and dotfiles-secrets is copied in configure.

- name: Secrets | Configure
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/configure.yml"
  tags:
    - secrets
    - shell
    - configure

- name: Secrets | Verify
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/verify.yml"
  when: not ansible_check_mode
  tags:
    - secrets
    - shell
    - verify
