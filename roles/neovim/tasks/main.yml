---
# Orchestrator only: no module calls other than include_vars / include_tasks.

- name: Neovim | Load release specific variables
  ansible.builtin.include_vars: "{{ neovim_vars_file }}"
  loop: "{{ query('ansible.builtin.first_found', neovim_vars_lookup) }}"
  loop_control:
    loop_var: neovim_vars_file
  vars:
    neovim_vars_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"
      skip: true
  tags:
    - neovim
    - dev

- name: Neovim | Install
  ansible.builtin.include_tasks: "{{ neovim_install_tasks }}"
  vars:
    neovim_install_tasks: "{{ lookup('ansible.builtin.first_found', neovim_install_lookup) }}"
    neovim_install_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/tasks/install"
  tags:
    - neovim
    - dev
    - install

- name: Neovim | Configure
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/configure.yml"
  tags:
    - neovim
    - dev
    - configure

- name: Neovim | Verify
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/verify.yml"
  when: not ansible_check_mode
  tags:
    - neovim
    - dev
    - verify
