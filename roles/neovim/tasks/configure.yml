---
# A single symlink, not a directory that is then replaced by one. The previous
# role created ~/.config/nvim as a real directory and immediately overwrote it
# with a symlink using force: true, which masked the conflict rather than
# avoiding it.
- name: Neovim | Ensure the parent config directory exists
  ansible.builtin.file:
    path: "{{ dotfiles_home }}/.config"
    state: directory
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: "0755"

- name: Neovim | Link the configuration
  ansible.builtin.file:
    src: "{{ role_path }}/files"
    dest: "{{ neovim_config_dir }}"
    state: link
    force: true
