---
- name: Neovim | Install dependencies
  ansible.builtin.apt:
    name: "{{ neovim_dependencies }}"
    state: present
  become: true

- name: Neovim | Resolve the release to install
  when: neovim_version | length == 0
  block:
    - name: Neovim | Query the latest release
      ansible.builtin.uri:
        url: "{{ neovim_release_api }}"
        headers: "{{ dotfiles_github_headers }}"
      register: neovim_latest
      changed_when: false
      check_mode: false

    - name: Neovim | Register the latest release
      ansible.builtin.set_fact:
        neovim_resolved_version: "{{ neovim_latest.json.tag_name }}"

- name: Neovim | Register the pinned release
  ansible.builtin.set_fact:
    neovim_resolved_version: "{{ neovim_version }}"
  when: neovim_version | length > 0

- name: Neovim | Query the installed version
  ansible.builtin.command: "{{ neovim_binary_path }} --version"
  register: neovim_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Neovim | Install the release
  when: neovim_installed.stdout is not search(neovim_resolved_version | regex_escape)
  block:
    - name: Neovim | Create the install prefix
      ansible.builtin.file:
        path: "{{ neovim_install_prefix }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: true

    - name: Neovim | Download and unpack the release
      ansible.builtin.unarchive:
        src: >-
          https://github.com/neovim/neovim/releases/download/{{ neovim_resolved_version }}/nvim-linux-{{ neovim_arch }}.tar.gz
        dest: "{{ neovim_install_prefix }}"
        remote_src: true
        extra_opts:
          - --strip-components=1
        owner: root
        group: root
      become: true

    - name: Neovim | Link the binary onto PATH
      ansible.builtin.file:
        src: "{{ neovim_install_prefix }}/bin/nvim"
        dest: "{{ neovim_binary_path }}"
        state: link
      become: true
