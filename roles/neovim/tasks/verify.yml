---
- name: Neovim | Query the installed version
  ansible.builtin.command: "{{ neovim_binary }} --version"
  register: neovim_version_check
  changed_when: false
  failed_when: false

- name: Neovim | Assert neovim is usable
  ansible.builtin.assert:
    that:
      - neovim_version_check.rc == 0
      - "'NVIM' in neovim_version_check.stdout"
    fail_msg: "neovim did not install correctly: {{ neovim_version_check.stderr | default('no output') }}"
    success_msg: "{{ neovim_version_check.stdout_lines | first | default('') }}"
    quiet: true
