---
# Orchestrator only: no module calls other than include_vars / include_tasks.

- name: System | Load release specific variables
  ansible.builtin.include_vars: "{{ system_vars_file }}"
  loop: "{{ query('ansible.builtin.first_found', system_vars_lookup) }}"
  loop_control:
    loop_var: system_vars_file
  vars:
    system_vars_lookup:
      files:
        - "{{ ansible_facts.distribution }}-{{ ansible_facts.distribution_major_version }}.yml"
        - "{{ ansible_facts.distribution }}.yml"
        - "{{ ansible_facts.os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"
      skip: true
  tags:
    - system
    - base

- name: System | Install
  ansible.builtin.include_tasks: "{{ system_install_tasks }}"
  vars:
    system_install_tasks: "{{ lookup('ansible.builtin.first_found', system_install_lookup) }}"
    system_install_lookup:
      files:
        - "{{ ansible_facts.distribution }}-{{ ansible_facts.distribution_major_version }}.yml"
        - "{{ ansible_facts.distribution }}.yml"
        - "{{ ansible_facts.os_family }}.yml"
      paths:
        - "{{ role_path }}/tasks/install"
  tags:
    - system
    - base
    - install

- name: System | Verify
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/verify.yml"
  when: not ansible_check_mode
  tags:
    - system
    - base
    - verify
