---
- name: System | Install packages
  ansible.builtin.apt:
    name: "{{ system_packages }}"
    state: present
  become: true

# On WSL the hostname is owned by /etc/wsl.conf: the hostname module's change does not survive a wsl --shutdown, which is why a machine configured this way reverts to the Windows computer name on the next start. In a container the runtime owns both the hostname and /etc/hosts, which it bind-mounts, so the atomic rename blockinfile does fails with EBUSY.
- name: System | Hostname
  when:
    - system_manage_hostname | bool
    - not (dotfiles_is_wsl | bool)
    - not (dotfiles_in_container | bool)
  block:
    - name: System | Set the hostname
      ansible.builtin.hostname:
        name: "{{ dotfiles_hostname }}"
      become: true

    - name: System | Add the hostname to /etc/hosts
      ansible.builtin.blockinfile:
        path: /etc/hosts
        block: |
          127.0.0.1  localhost
          {{ system_loopback_address }}  {{ dotfiles_hostname }}
      become: true

- name: System | Install the guest agent
  ansible.builtin.apt:
    name: "{{ system_guest_agent_packages }}"
    state: present
  become: true
  when: system_is_vm_guest | bool
  notify: System | Start qemu
