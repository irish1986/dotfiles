---
- name: System | Install packages
  ansible.builtin.apt:
    name: "{{ system_packages }}"
    state: present
  become: true

# On WSL the hostname is owned by /etc/wsl.conf: the hostname module's change does not survive a wsl --shutdown, which is why a machine configured this way reverts to the Windows computer name on the next start. In a container the runtime owns both the hostname and /etc/hosts, which it bind-mounts, so the atomic rename blockinfile does fails with EBUSY.
- name: System | Hostname
  when:
    - system_manage_hostname | bool
    - not (dotfiles_is_wsl | bool)
    - not (dotfiles_in_container | bool)
  block:
    - name: System | Set the hostname
      ansible.builtin.hostname:
        name: "{{ dotfiles_hostname }}"
      become: true

    - name: System | Add the hostname to /etc/hosts
      ansible.builtin.blockinfile:
        path: /etc/hosts
        block: |
          127.0.0.1  localhost
          {{ system_loopback_address }}  {{ dotfiles_hostname }}
      become: true

- name: System | Install the guest agent
  ansible.builtin.apt:
    name: "{{ system_guest_agent_packages }}"
    state: present
  become: true
  when: system_is_vm_guest | bool
  notify: System | Start qemu

- name: System | Install the font dependencies
  ansible.builtin.apt:
    name: >-
      {{ system_fonts_dependencies
         + ([] if (dotfiles_is_wsl | bool) else system_fonts_linux_dependencies) }}
    state: present
  become: true

# mode 0755, not 0644: a directory without the execute bit cannot be traversed, so the unarchive below could never write into it.
- name: System | Ensure the font directory exists
  ansible.builtin.file:
    path: "{{ system_fonts_dir }}"
    state: directory
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: "0755"

- name: System | Install Nerd Fonts
  ansible.builtin.unarchive:
    src: >-
      https://github.com/ryanoasis/nerd-fonts/releases/download/v{{ system_fonts_version }}/{{ system_nerd_font }}.zip
    dest: "{{ system_fonts_dir }}"
    remote_src: true
    creates: "{{ system_fonts_dir }}/{{ system_nerd_font }}{{ system_fonts_probe_suffix }}"
    exclude:
      - LICENSE
      - LICENSE.txt
      - README.md
  loop: "{{ system_nerd_fonts }}"
  loop_control:
    loop_var: system_nerd_font
  notify: System | Update font cache
