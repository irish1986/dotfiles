---
- name: System | Check the base packages
  ansible.builtin.command: dpkg-query -W -f='${Status}' {{ system_package }}
  register: system_package_check
  changed_when: false
  failed_when: false
  loop: "{{ system_packages }}"
  loop_control:
    loop_var: system_package

- name: System | Assert every base package is installed
  ansible.builtin.assert:
    that:
      - system_package_check.results | selectattr('stdout', 'search', 'ok installed') | list | length == system_packages | length
    fail_msg: >-
      Missing:
      {{ system_package_check.results | rejectattr('stdout', 'search', 'ok installed')
         | map(attribute='system_package') | join(', ') }}
    success_msg: "{{ system_packages | length }} base packages installed"
    quiet: true
