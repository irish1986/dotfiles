---
- name: System | Check the base packages
  ansible.builtin.command: dpkg-query -W -f='${Status}' {{ system_package }}
  register: system_package_check
  changed_when: false
  failed_when: false
  loop: "{{ system_packages }}"
  loop_control:
    loop_var: system_package

- name: System | Assert every base package is installed
  ansible.builtin.assert:
    that:
      - system_package_check.results | selectattr('stdout', 'search', 'ok installed') | list | length == system_packages | length
    fail_msg: >-
      Missing:
      {{ system_package_check.results | rejectattr('stdout', 'search', 'ok installed')
         | map(attribute='system_package') | join(', ') }}
    success_msg: "{{ system_packages | length }} base packages installed"
    quiet: true

# A malformed sudoers drop-in locks the machine out of sudo, so it is worth
# asserting rather than assuming the earlier validate: held.
- name: System | Validate the sudoers drop-in
  ansible.builtin.command: /usr/sbin/visudo -c -f {{ system_sudoers_file }}
  register: system_sudoers_check
  changed_when: false
  failed_when: false
  become: true
  when: system_manage_sudoers | bool

- name: System | Assert the sudoers drop-in parses
  ansible.builtin.assert:
    that:
      - system_sudoers_check.rc == 0
    fail_msg: "{{ system_sudoers_file }} is invalid: {{ system_sudoers_check.stderr | default('') }}"
    success_msg: "{{ system_sudoers_file }} parses"
    quiet: true
  when: system_manage_sudoers | bool
