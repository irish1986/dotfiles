---
- name: System | Audit the package database
  ansible.builtin.command: dpkg --audit
  register: system_audit
  changed_when: false

- name: System | Assert no package is half configured
  ansible.builtin.assert:
    that:
      - system_audit.stdout | trim | length == 0
    fail_msg: "dpkg reports inconsistent packages:\n{{ system_audit.stdout }}"
    success_msg: package database consistent
    quiet: true

- name: System | Validate the sudoers drop-in
  ansible.builtin.command: /usr/sbin/visudo -cf {{ system_sudoers_file }}
  become: true
  changed_when: false

- name: System | Read the group membership
  ansible.builtin.command: id -nG {{ dotfiles_user }}
  register: system_groups_check
  changed_when: false

- name: System | Assert the login user is in every group
  ansible.builtin.assert:
    that:
      - system_groups | difference(system_groups_check.stdout.split()) | length == 0
    fail_msg: "{{ dotfiles_user }} is missing from {{ system_groups | difference(system_groups_check.stdout.split()) | join(', ') }}."
    success_msg: member of {{ system_groups | join(', ') }}
    quiet: true

- name: System | Verify WSL
  when: dotfiles_is_wsl | bool
  block:
    - name: System | Assert wsl.conf is present
      ansible.builtin.assert:
        that:
          - "'/etc/wsl.conf' is file"
        fail_msg: /etc/wsl.conf was not written.
        quiet: true

    # systemd's own generator, reading the files the user manager loads at its next start: this holds before the distro restarts.
    - name: System | Read the user services' environment
      ansible.builtin.command: /usr/lib/systemd/user-environment-generators/30-systemd-environment-d-generator
      register: system_user_environment
      changed_when: false

    - name: System | Assert user services get the WSL session environment
      ansible.builtin.assert:
        that:
          - system_user_environment.stdout is search('^WSL_DISTRO_NAME=.', multiline=True)
          - >-
            not (system_wsl_interop_enabled | bool and system_wsl_interop_append_windows_path | bool)
            or system_user_environment.stdout is search('^PATH=.*:/mnt/', multiline=True)
        fail_msg: "{{ system_wsl_environment_file }} does not give user services the distro name and Windows PATH:\n{{ system_user_environment.stdout }}"
        success_msg: user services get the WSL session environment
        quiet: true

    # The user's clipboard is put back afterwards.
    - name: System | Round-trip the clipboard
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          yank={{ dotfiles_home }}/.local/bin/win32yank.exe
          saved=$(mktemp)
          trap 'rm -f "$saved"' EXIT
          "$yank" -o --lf > "$saved" || true
          printf 'dotfiles-clipboard-probe' | "$yank" -i --crlf
          probe=$("$yank" -o --lf)
          "$yank" -i --crlf < "$saved"
          printf '%s' "$probe"
        executable: /bin/bash
      register: system_clipboard
      changed_when: false

    - name: System | Assert the clipboard round-trips cleanly
      ansible.builtin.assert:
        that:
          - system_clipboard.stdout == 'dotfiles-clipboard-probe'
        fail_msg: >-
          win32yank returned {{ system_clipboard.stdout | to_json }}. If Windows binaries fail with "Exec format error", run `wsl --shutdown` from Windows and reopen the distro.
        success_msg: clipboard round-trips cleanly
        quiet: true
