---
- name: System | Hostname
  when:
    - not (dotfiles_is_wsl | bool)
  block:
    - name: System | Set hostname to inventory hostname
      ansible.builtin.hostname:
        name: "{{ dotfiles_hostname | default('ubuntu') }}"
      become: true

    - name: System | Set /etc/hosts to include inventory hostname
      ansible.builtin.blockinfile:
        path: /etc/hosts
        block: |
          127.0.0.1  localhost
          {{ dotfiles_loopback_address | default('127.0.1.1') }}  {{ dotfiles_hostname | default('ubuntu') }}
      become: true

- name: System | Groups and Users
  block:
    - name: System | Ensure groups are present
      ansible.builtin.group:
        name:
          - sudo
        state: present
      become: true

    - name: System | Ensure sudo group has sudo privileges
      ansible.builtin.lineinfile:
        dest: /etc/sudoers
        state: present
        regexp: ^%sudo
        line: "%sudo ALL=(ALL:ALL) ALL"
        validate: /usr/sbin/visudo -cf %s
      become: true

    # A drop-in rather than surgery on /etc/sudoers. The previous blockinfile
    # had no validate:, so a bad render locked the machine out of sudo, and its
    # insertafter regex ("%sudo   ALL...", three spaces) never matched the line
    # written just above ("%sudo ALL...", one space), so it silently appended to
    # the end of the file instead of where it claimed.
    - name: "System | Give passwordless sudo to {{ dotfiles_user }}"
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-dotfiles
        content: | # pragma: allowlist secret
          # Managed by the dotfiles playbook (roles/system). Do not edit.
          {{ dotfiles_user }} ALL=(ALL) NOPASSWD: ALL
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
      become: true

- name: System | Install default packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - bind9-dnsutils
      - curl
      - git
      - make
      - nano
      - wget
    state: present
  become: true

- name: System | Install qemu-guest-agent
  ansible.builtin.apt:
    name:
      - qemu-guest-agent
    state: present
  become: true
  when:
    - not ansible_host_environment_is_wsl
    - ansible_virtualization_role == "guest"
  notify: System | Start qemu

- name: System | Create .config directory exists
  ansible.builtin.file:
    path: "{{ ansible_home }}/.config"
    state: directory
    recurse: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
