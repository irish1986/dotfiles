---
system_packages:
  - bind9-dnsutils
  - ca-certificates
  - curl
  - git
  - make
  - nano
  - openssl
  - unzip
  - wget

# unattended-upgrades holds the dpkg lock right after boot, so every apt task waits for it rather than failing.
system_apt_lock_timeout: 600

system_sudoers_file: /etc/sudoers.d/90-dotfiles
# Created when missing, so the membership lands on the first run: docker's postinst only adds the group when it is absent.
system_groups:
  - sudo
  - docker

# Relative to $HOME. The modes are what Ubuntu already creates, except .local/state, which holds logs and shell history.
system_directories:
  - { path: .cache, mode: "0700" }
  - { path: .config, mode: "0755" }
  - { path: .local/bin, mode: "0755" }
  - { path: .local/share, mode: "0700" }
  - { path: .local/state, mode: "0700" }

# ── /etc/wsl.conf ─────────────────────────────────────────────────────────
system_wsl_systemd: true
# metadata stops every file under /mnt/c reporting mode 0777. fmask=11 keeps the owner execute bit, which every .exe under /mnt/c needs.
system_wsl_automount_enabled: true
system_wsl_automount_root: /mnt/
system_wsl_automount_options: "metadata,umask=22,fmask=11"
system_wsl_automount_mount_fstab: true
system_wsl_interop_enabled: true
system_wsl_interop_append_windows_path: true
# On WSL the hostname lives here: the hostname module's change does not survive a wsl --shutdown.
system_wsl_network_hostname: "{{ dotfiles_hostname }}"
system_wsl_network_generate_hosts: true
system_wsl_network_generate_resolv_conf: true
system_wsl_default_user: "{{ dotfiles_user }}"

# win32yank, the clipboard bridge: `powershell Get-Clipboard` appends CRLF even with -Raw.
# renovate: datasource=github-releases depName=equalsraf/win32yank
system_win32yank_version: "0.1.1"
