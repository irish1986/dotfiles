---
- name: System | Restart unattended-upgrades
  ansible.builtin.systemd_service:
    name: unattended-upgrades
    enabled: true
    state: restarted
  become: true
  when: dotfiles_has_systemd | bool

# A message, not an action: `wsl --terminate` from inside the distro kills the run.
- name: System | Terminate required
  ansible.builtin.debug:
    msg: >-
      wsl.conf changed. Run `wsl --terminate {{ lookup('ansible.builtin.env', 'WSL_DISTRO_NAME') | default('<distro>', true) }}` from Windows, reopen the distro, and re-run.
