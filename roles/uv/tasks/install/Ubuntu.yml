---
- name: UV | Install dependencies
  ansible.builtin.apt:
    name: "{{ uv_dependencies }}"
    state: present
  become: true

- name: UV | Detect an existing uv
  ansible.builtin.stat:
    path: "{{ uv_binary_path }}"
  register: uv_existing

- name: UV | Install uv from the upstream installer
  when: not uv_existing.stat.exists
  block:
    - name: UV | Create a staging file
      ansible.builtin.tempfile:
        state: file
        suffix: uv-install.sh
      register: uv_script
      changed_when: false

    - name: UV | Download the installer
      ansible.builtin.get_url:
        url: "{{ uv_install_url }}"
        dest: "{{ uv_script.path }}"
        mode: "0755"
        force: true
      changed_when: false

    - name: UV | Run the installer
      ansible.builtin.command: "{{ uv_script.path }}"
      changed_when: true
  always:
    - name: UV | Remove the staging file
      ansible.builtin.file:
        path: "{{ uv_script.path | default('') }}"
        state: absent
      when: uv_script.path is defined
      changed_when: false

- name: UV | Install the default interpreter
  when: uv_manage_python | bool
  block:
    # The previous version wrapped this in failed_when: false, changed_when: false *and* a rescue -- three layers of suppression, so a failure here was invisible. Failures are real now; verify.yml is what catches them.
    - name: UV | Query the installed interpreters
      ansible.builtin.command: "{{ uv_binary_path }} python list --only-installed"
      environment:
        NO_COLOR: "1"
      register: uv_installed_pythons
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "UV | Install python {{ uv_python_version }}"
      ansible.builtin.command: "{{ uv_binary_path }} python install {{ uv_python_version }} --default"
      when: uv_installed_pythons.stdout is not search(uv_python_version | regex_escape)
      changed_when: true
