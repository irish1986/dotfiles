---
# Orchestrator only: no module calls other than include_vars / include_tasks.

- name: GitHub | Load release specific variables
  ansible.builtin.include_vars: "{{ github_vars_file }}"
  loop: "{{ query('ansible.builtin.first_found', github_vars_lookup) }}"
  loop_control:
    loop_var: github_vars_file
  vars:
    github_vars_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"
      skip: true
  tags:
    - github
    - dev

- name: GitHub | Install
  ansible.builtin.include_tasks: "{{ github_install_tasks }}"
  vars:
    github_install_tasks: "{{ lookup('ansible.builtin.first_found', github_install_lookup) }}"
    github_install_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/tasks/install"
  tags:
    - github
    - dev
    - install

- name: GitHub | Configure
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/configure.yml"
  tags:
    - github
    - dev
    - configure

- name: GitHub | Verify
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/verify.yml"
  when: not ansible_check_mode
  tags:
    - github
    - dev
    - verify
