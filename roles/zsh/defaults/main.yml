---
zsh_packages:
  - bat
  - eza
  - fzf
  - git
  - jq
  - trash-cli
  - tree
  - whois
  - yq
  - zoxide
  - zsh

zsh_shell: /usr/bin/zsh

zsh_omz_dir: "{{ dotfiles_home }}/.oh-my-zsh"
zsh_omz:
  repo: https://github.com/ohmyzsh/ohmyzsh.git
  # renovate: datasource=git-refs depName=https://github.com/ohmyzsh/ohmyzsh currentValue=master
  version: 2100c630ba4bd67bb48802c3e7da893a4fdaa1a0

zsh_plugins:
  - name: powerlevel10k
    repo: https://github.com/romkatv/powerlevel10k.git
    # renovate: datasource=github-tags depName=romkatv/powerlevel10k
    version: v1.20.0
    type: themes
  - name: you-should-use
    repo: https://github.com/MichaelAquilina/zsh-you-should-use.git
    # renovate: datasource=github-tags depName=MichaelAquilina/zsh-you-should-use
    version: 1.11.1
    type: plugins
  - name: zsh-autosuggestions
    repo: https://github.com/zsh-users/zsh-autosuggestions
    # renovate: datasource=github-tags depName=zsh-users/zsh-autosuggestions
    version: v0.7.1
    type: plugins
  - name: zsh-bat
    repo: https://github.com/fdellwing/zsh-bat.git
    # renovate: datasource=git-refs depName=https://github.com/fdellwing/zsh-bat currentValue=master
    version: 467337613c1c220c0d01d69b19d2892935f43e9f
    type: plugins
  - name: zsh-completions
    repo: https://github.com/zsh-users/zsh-completions
    # renovate: datasource=git-refs depName=https://github.com/zsh-users/zsh-completions currentValue=master
    version: 989b23277ab33e8d5e82df6aed936e846db9d8b8
    type: plugins
  - name: zsh-eza
    repo: https://github.com/z-shell/zsh-eza
    # renovate: datasource=git-refs depName=https://github.com/z-shell/zsh-eza currentValue=main
    version: e172f4ac99592e8733894dce862c435a58387fae
    type: plugins
  - name: zsh-syntax-highlighting
    repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
    # renovate: datasource=github-tags depName=zsh-users/zsh-syntax-highlighting
    version: 0.8.0
    type: plugins

# Dotfiles copied from files/ into $HOME.
zsh_dotfiles:
  - src: .zshrc
    dest: .zshrc
  - src: .zshaliases
    dest: .zshaliases
  - src: .zshfunc
    dest: .zshfunc
  - src: .p10k
    dest: .p10k.zsh
