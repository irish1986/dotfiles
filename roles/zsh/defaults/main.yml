---
zsh_packages:
  - bat
  - fzf
  - git
  - jq
  - trash-cli
  - tree
  - whois
  - yq
  - zoxide
  - zsh

zsh_omz_dir: "{{ dotfiles_home }}/.oh-my-zsh"
zsh_omz_install_url: https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh

# Every plugin pinned: these are vendored dependencies, and an unpinned clone means a shell that changes behaviour without any commit to this repo.
zsh_plugins:
  - name: powerlevel10k
    repo: https://github.com/romkatv/powerlevel10k.git
    version: v1.20.0
    type: themes
  - name: you-should-use
    repo: https://github.com/MichaelAquilina/zsh-you-should-use.git
    version: 1.9.0
    type: plugins
  - name: zsh-autosuggestions
    repo: https://github.com/zsh-users/zsh-autosuggestions
    version: v0.7.1
    type: plugins
  - name: zsh-bat
    repo: https://github.com/fdellwing/zsh-bat.git
    version: 467337613c1c220c0d01d69b19d2892935f43e9f
    type: plugins
  - name: zsh-completions
    repo: https://github.com/zsh-users/zsh-completions
    version: 67921bc12502c1e7b0f156533fbac2cb51f6943d
    type: plugins
  - name: zsh-eza
    repo: https://github.com/z-shell/zsh-eza
    version: 79484190e314c0e5bdbcc3e610300589606c45f0
    type: plugins
  - name: zsh-syntax-highlighting
    repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
    version: 0.8.0
    type: plugins

# Dotfiles deployed to $HOME. .zshenv and .p10k.zsh were in files/ all along and were never copied: .zshrc sources ~/.p10k.zsh, a name that did not even match the .p10k in the repo, and ~/.zshfunc was deployed but never sourced.
zsh_dotfiles:
  - src: .zshrc
    dest: .zshrc
  - src: .zshaliases
    dest: .zshaliases
  - src: .zshfunc
    dest: .zshfunc
  - src: .p10k
    dest: .p10k.zsh

# Absorbed from the deleted env role, which owned ~/.zshenv by blockinfile while zsh deployed a literal .zshenv over it -- whichever ran last won. Requires bitwarden-sdk importable by ansible (see the ansible_tools role) and BWS_ACCESS_TOKEN in the environment.
zsh_manage_secrets: false
zsh_secrets:
  - name: GH_TOKEN
    id: 0c5d5440-c1b4-42db-ae7e-b28f012726e1
  - name: GITGUARDIAN_API_TOKEN
    id: e6e22df6-1043-4b67-ba9a-b28f0127f6da
  - name: TAILSCALE_TOKEN
    id: 8a276e18-7edc-42ef-8842-b25c002d02b7
