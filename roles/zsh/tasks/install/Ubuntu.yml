---
- name: ZSH | Install packages
  ansible.builtin.apt:
    name: "{{ zsh_packages + zsh_optional_packages }}"
    state: present
  become: true

- name: ZSH | Set the login shell
  ansible.builtin.user:
    name: "{{ dotfiles_user }}"
    shell: "{{ zsh_shell }}"
  become: true

- name: ZSH | Detect oh-my-zsh
  ansible.builtin.stat:
    path: "{{ zsh_omz_dir }}"
  register: zsh_omz_existing

# Runs as the login user, not root. Under the old global become this installed
# oh-my-zsh into a root-owned tree in the user's home, which is why every file
# under ~/.oh-my-zsh/custom ended up owned by root.
- name: ZSH | Install oh-my-zsh
  when: not zsh_omz_existing.stat.exists
  block:
    - name: ZSH | Create a staging file
      ansible.builtin.tempfile:
        state: file
        suffix: oh-my-zsh-install.sh
      register: zsh_omz_script
      changed_when: false

    - name: ZSH | Download the oh-my-zsh installer
      ansible.builtin.get_url:
        url: "{{ zsh_omz_install_url }}"
        dest: "{{ zsh_omz_script.path }}"
        mode: "0755"
        force: true
      changed_when: false

    - name: ZSH | Run the oh-my-zsh installer
      ansible.builtin.command: "{{ zsh_omz_script.path }} --unattended --keep-zshrc"
      environment:
        ZSH: "{{ zsh_omz_dir }}"
      changed_when: true
  always:
    # The old handler removed ~/oh-my-zsh.install.sh while the download went to
    # /tmp, so it cleaned nothing.
    - name: ZSH | Remove the staging file
      ansible.builtin.file:
        path: "{{ zsh_omz_script.path | default('') }}"
        state: absent
      when: zsh_omz_script.path is defined
      changed_when: false
