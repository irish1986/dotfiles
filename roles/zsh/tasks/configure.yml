---
- name: ZSH | Install the plugins
  ansible.builtin.git:
    repo: "{{ zsh_plugin.repo }}"
    version: "{{ zsh_plugin.version }}"
    dest: "{{ zsh_omz_dir }}/custom/{{ zsh_plugin.type }}/{{ zsh_plugin.name }}"
    depth: 1
    force: true
  loop: "{{ zsh_plugins }}"
  loop_control:
    loop_var: zsh_plugin
    label: "{{ zsh_plugin.name }}"

- name: ZSH | Deploy the shell dotfiles
  ansible.builtin.copy:
    src: "{{ zsh_dotfile.src }}"
    dest: "{{ dotfiles_home }}/{{ zsh_dotfile.dest }}"
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: "0644"
  loop: "{{ zsh_dotfiles }}"
  loop_control:
    loop_var: zsh_dotfile
    label: "{{ zsh_dotfile.dest }}"
