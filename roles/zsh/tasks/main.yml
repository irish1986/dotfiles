---
# Orchestrator only: no module calls other than include_vars / include_tasks.

- name: ZSH | Load release specific variables
  ansible.builtin.include_vars: "{{ zsh_vars_file }}"
  loop: "{{ query('ansible.builtin.first_found', zsh_vars_lookup) }}"
  loop_control:
    loop_var: zsh_vars_file
  vars:
    zsh_vars_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"
      skip: true
  tags:
    - zsh
    - shell

- name: ZSH | Install
  ansible.builtin.include_tasks: "{{ zsh_install_tasks }}"
  vars:
    zsh_install_tasks: "{{ lookup('ansible.builtin.first_found', zsh_install_lookup) }}"
    zsh_install_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/tasks/install"
  tags:
    - zsh
    - shell
    - install

- name: ZSH | Configure
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/configure.yml"
  tags:
    - zsh
    - shell
    - configure

- name: ZSH | Verify
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/verify.yml"
  when: not ansible_check_mode
  tags:
    - zsh
    - shell
    - verify
