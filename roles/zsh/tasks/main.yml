---
- name: ZSH | Install packages
  ansible.builtin.apt:
    name: "{{ zsh_packages }}"
    state: present
  become: true

- name: ZSH | Set the login shell
  ansible.builtin.user:
    name: "{{ dotfiles_user }}"
    shell: "{{ zsh_shell }}"
  become: true

# Before the plugins, which are cloned into its custom/ directory: force resets tracked files only, so those untracked clones stay. .zshrc comes from files/.
- name: ZSH | Install oh-my-zsh
  ansible.builtin.git:
    repo: "{{ zsh_omz.repo }}"
    version: "{{ zsh_omz.version }}"
    dest: "{{ zsh_omz_dir }}"
    # A shallow clone can only fetch a branch or tag; a commit pin needs a full one.
    depth: "{{ omit if zsh_omz.version is match('^[0-9a-f]{40}$') else 1 }}"
    force: true

- name: ZSH | Install the plugins
  ansible.builtin.git:
    repo: "{{ zsh_plugin.repo }}"
    version: "{{ zsh_plugin.version }}"
    dest: "{{ zsh_omz_dir }}/custom/{{ zsh_plugin.type }}/{{ zsh_plugin.name }}"
    # A shallow clone can only fetch a branch or tag; a commit pin needs a full one.
    depth: "{{ omit if zsh_plugin.version is match('^[0-9a-f]{40}$') else 1 }}"
    force: true
  loop: "{{ zsh_plugins }}"
  loop_control:
    loop_var: zsh_plugin
    label: "{{ zsh_plugin.name }}"

- name: ZSH | Skip the system-wide compinit
  ansible.builtin.blockinfile:
    path: "{{ dotfiles_home }}/.zshenv"
    marker: "# {mark} ANSIBLE MANAGED BLOCK zsh"
    insertbefore: BOF
    create: true
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: "0600"
    block: |
      skip_global_compinit=1

- name: ZSH | Deploy the shell dotfiles
  ansible.builtin.copy:
    src: "{{ zsh_dotfile.src }}"
    dest: "{{ dotfiles_home }}/{{ zsh_dotfile.dest }}"
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: "0644"
  loop: "{{ zsh_dotfiles }}"
  loop_control:
    loop_var: zsh_dotfile
    label: "{{ zsh_dotfile.dest }}"

- name: ZSH | Verify
  ansible.builtin.import_tasks: verify.yml
  when: not ansible_check_mode
  tags: verify
