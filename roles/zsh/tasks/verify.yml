---
- name: ZSH | Query the installed version
  ansible.builtin.command: zsh --version
  changed_when: false

- name: ZSH | Read the passwd entry
  ansible.builtin.command: getent passwd {{ dotfiles_user }}
  register: zsh_passwd
  changed_when: false

- name: ZSH | Assert the login shell is zsh
  ansible.builtin.assert:
    that:
      - zsh_passwd.stdout.split(':') | last == zsh_shell
    fail_msg: "{{ dotfiles_user }} has login shell {{ zsh_passwd.stdout.split(':') | last }}, expected {{ zsh_shell }}."
    success_msg: login shell {{ zsh_shell }}
    quiet: true

- name: ZSH | Assert every dotfile was deployed
  ansible.builtin.assert:
    that:
      - (dotfiles_home ~ '/' ~ zsh_dotfile.dest) is file
    fail_msg: "{{ dotfiles_home }}/{{ zsh_dotfile.dest }} is missing."
    quiet: true
  loop: "{{ zsh_dotfiles }}"
  loop_control:
    loop_var: zsh_dotfile
    label: "{{ zsh_dotfile.dest }}"

# .zshrc sources it.
- name: ZSH | Assert oh-my-zsh is present
  ansible.builtin.assert:
    that:
      - (zsh_omz_dir ~ '/oh-my-zsh.sh') is file
    fail_msg: oh-my-zsh is missing from {{ zsh_omz_dir }}.
    quiet: true

# .zshrc's ZSH_THEME does not resolve without it.
- name: ZSH | Assert the powerlevel10k theme is present
  ansible.builtin.assert:
    that:
      - (zsh_omz_dir ~ '/custom/themes/powerlevel10k/powerlevel10k.zsh-theme') is file
    fail_msg: powerlevel10k is missing.
    quiet: true
