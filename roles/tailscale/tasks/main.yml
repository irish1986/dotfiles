---
# Orchestrator only: no module calls other than include_vars / include_tasks.

- name: Tailscale | Load release specific variables
  ansible.builtin.include_vars: "{{ tailscale_vars_file }}"
  loop: "{{ query('ansible.builtin.first_found', tailscale_vars_lookup) }}"
  loop_control:
    loop_var: tailscale_vars_file
  vars:
    tailscale_vars_lookup:
      files:
        - "{{ ansible_facts.distribution }}-{{ ansible_facts.distribution_major_version }}.yml"
        - "{{ ansible_facts.distribution }}.yml"
        - "{{ ansible_facts.os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"
      skip: true
  tags:
    - tailscale
    - net

- name: Tailscale | Install
  ansible.builtin.include_tasks: "{{ tailscale_install_tasks }}"
  vars:
    tailscale_install_tasks: "{{ lookup('ansible.builtin.first_found', tailscale_install_lookup) }}"
    tailscale_install_lookup:
      files:
        - "{{ ansible_facts.distribution }}-{{ ansible_facts.distribution_major_version }}.yml"
        - "{{ ansible_facts.distribution }}.yml"
        - "{{ ansible_facts.os_family }}.yml"
      paths:
        - "{{ role_path }}/tasks/install"
  tags:
    - tailscale
    - net
    - install

- name: Tailscale | Verify
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/verify.yml"
  when: not ansible_check_mode
  tags:
    - tailscale
    - net
    - verify
