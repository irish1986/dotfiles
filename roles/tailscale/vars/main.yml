---
tailscale_binary: tailscale
tailscale_service_name: tailscaled

# Left behind by Tailscale's own documented install steps, which write a .list with signed-by pointing at /usr/share/keyrings. apt refuses to load two sources for the same URI with different Signed-By values, so the .list must go before the .sources file can take effect. The keyring itself stays: the tailscale package ships it, so removing it only made every run report a change.
tailscale_legacy_artifacts:
  - /etc/apt/sources.list.d/tailscale.list
