---
# Tool entries, set in the profiles rather than here (ADR 0003). Every list is appended to layer by layer, so base.yml, the named profile and the local file each add their own.
#
# Placeholders, substituted wherever an entry takes a URL, arguments, environment or a verify command:
#   {version}   the entry's version
#   {arch}      dpkg architecture: amd64, arm64
#   {machine}   uname machine: x86_64, aarch64
#   {codename}  Ubuntu codename: noble, ...
#   {home}      the login user's home directory
#
# Every entry that installs from a release carries a version, annotated for Renovate on the line above it (ADR 0004):
#   # renovate: datasource=github-releases depName=<owner>/<repo>

# Package names from the Ubuntu archive. Upgraded by the update role, not pinned.
tools_apt: []

# Third-party apt repositories and the packages to install from them. The only way the playbook adds an apt source.
#   name            becomes /etc/apt/sources.list.d/<name>.sources; an entry named docker also gets the daemon configuration below
#   uri, key_url    repository base URI and signing key URL
#   suite           default {codename}
#   suite_fallback  suite to use when the vendor has not published {codename} yet, found by probing dists/<suite>/Release; empty disables the probe
#   components      default [main]
#   probe           default true; false for flat or channel-named suites, which have no dists/ layout to probe
#   packages        what to install from it
#   verify          optional command asserting it works
tools_apt_repos: []

# .deb files from a release, installed when dpkg reports a different version.
#   name, version, url, package (default name), verify (default "<name> --version")
tools_debs: []

# Single-file release binaries, installed to /usr/local/bin/<name> when `<name> --version` reports a different version.
#   name, version, url, checksum_url (optional: a file whose first word is the sha256; {url} is the binary's URL), verify
tools_binaries: []

# Upstream installer scripts, run once: `creates` (relative to $HOME) guards them, and the tool's own updater owns upgrades from then on.
#   name, url, creates, interpreter (default sh), args (list), env (dict), verify
tools_scripts: []

# Interpreter uv installs and marks default. Empty leaves the choice to you.
tools_uv_python: ""

# Node version nvm installs and aliases as default: a major such as "24", or anything `nvm install` takes. Installed when no matching version is present; patch upgrades within it are yours to run. Empty leaves node to you. Needs the nvm entry in tools_scripts.
tools_nvm_node_version: ""

# Python tools installed with `uv tool install <name>==<version>`.
#   name, version, verify
tools_uv_tools: []

# Plugins for an agent CLI, installed with `<cli> plugin install` when `<cli> plugin list` does not show them (ADR 0014). The CLI itself comes from a tools_scripts entry; the CLI owns updates.
#   cli          claude or copilot, found in ~/.local/bin
#   plugin       <name>@<marketplace>, as the CLI's `plugin list` prints it
#   marketplace  the marketplace's GitHub owner/repo, added first when the CLI does not list it
tools_agent_plugins: []

# Agent skills, installed globally with the skills CLI (`npx skills add`) for every agent in tools_agent_skill_agents (ADR 0015). Installed when a skill is missing from an agent's skills directory; `npx skills update -g` is yours to run. Needs tools_nvm_node_version.
#   source  what `skills add` takes: a GitHub owner/repo
#   skills  skill names from that source, default ['*'] for all of them
tools_agent_skills: []

# The skills CLI's names for the agents to install every skill for. Each needs a directory in tools_agent_skill_dirs (vars/main.yml).
tools_agent_skill_agents: []

# The skills CLI version npx runs, annotated for Renovate in the profile.
tools_agent_skills_cli_version: ""

# GitHub CLI extensions, installed with `gh extension install <repo>` when gh has no extension of that name. `gh extension upgrade` owns updates. gh itself comes from the github-cli entry in tools_apt_repos.
#   name    the extension as gh names it: the repository's name, gh-<command>
#   repo    owner/repo
#   verify  a command asserting it works, such as `gh <command> --version`
tools_gh_extensions: []

# Config files for tools, copied from roles/tools/files/.
#   src   relative to roles/tools/files/
#   dest      relative to $HOME
#   dir_mode  mode of dest's directory, default 0755
tools_files: []

# The removal list (ADR 0003). Removing an entry above only stops managing it; uninstalling is explicit, here.
tools_remove_apt: []
# Relative to $HOME.
tools_remove_paths: []

# Docker daemon configuration, applied when tools_apt_repos has an entry named docker.
# Image/container/volume store. Left unset so Docker uses its default, /var/lib/docker. Relocating it into $HOME buys nothing on WSL -- /home and /var share one ext4.vhdx -- and Docker requires the directory root-owned 0710, which is hostile to anything that walks the home directory.
tools_docker_data_root: ""
tools_docker_address_pool_base: 172.10.0.0/16
tools_docker_address_pool_size: 24
tools_docker_experimental: true
tools_docker_buildkit: true
