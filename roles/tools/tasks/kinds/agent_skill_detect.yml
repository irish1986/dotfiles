---
# Which of one tools_agent_skill entry's skills are missing from an agent's skills directory, as tools_agent_skill_missing: the SKILL.md paths not there. Shared by the install (kinds/agent_skill.yml) and the verify phase. A skill is its files, so their presence is the install; the skills CLI has no other record per agent.

# Absent until the skills CLI first installs something.
- name: "Tools | Read the skills lock: {{ tools_agent_skill.source }}"
  ansible.builtin.slurp:
    src: "{{ tools_agent_skill_lock }}"
  register: tools_agent_skill_lock_read
  failed_when: false

# '*' names no skill, so the lock says which skills the source gave; before the first install it gave none, and the entry counts as missing.
- name: "Tools | Find the missing agent skills: {{ tools_agent_skill.source }}"
  ansible.builtin.set_fact:
    tools_agent_skill_missing: >-
      {{ ['every skill in ' ~ tools_agent_skill.source] if tools_agent_skill_names | length == 0 else
         tools_agent_skill_agents | map('extract', tools_agent_skill_dirs)
         | product(tools_agent_skill_names) | map('join', '/')
         | map('regex_replace', '^(.*)$', dotfiles_home ~ '/\1/SKILL.md')
         | reject('file') | list }}
  vars:
    tools_agent_skill_wanted: "{{ tools_agent_skill.skills | default(['*']) }}"
    tools_agent_skill_locked: >-
      {{ (tools_agent_skill_lock_read.content | default('e30=') | b64decode | from_json).skills | default({})
         | dict2items | selectattr('value.source', 'equalto', tools_agent_skill.source)
         | map(attribute='key') | list }}
    tools_agent_skill_names: "{{ tools_agent_skill_locked if '*' in tools_agent_skill_wanted else tools_agent_skill_wanted }}"
