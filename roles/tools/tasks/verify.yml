---
# One command per entry, defaulting to `<name> --version`. A non-zero exit fails the run, which is the point: a tool that installed but does not start is caught here, not the next time it is needed.
- name: Tools | Run the verify commands
  ansible.builtin.shell:
    cmd: "{{ tools_entry.verify | default(tools_entry.name ~ ' --version') | replace('{home}', dotfiles_home) }}"
    executable: /bin/bash
  environment:
    PATH: "{{ tools_path }}"
  loop: "{{ tools_verifiable }}"
  loop_control:
    loop_var: tools_entry
    label: "{{ tools_entry.name }}"
  changed_when: false

# nvm.sh puts the default alias on PATH as it loads, so this is the node a new shell gets once nvm is loaded.
- name: Tools | Verify the nvm node
  ansible.builtin.shell:
    cmd: . "$NVM_DIR/nvm.sh" && node --version && npm --version
    executable: /bin/bash
  environment:
    NVM_DIR: "{{ tools_nvm_dir }}"
    PATH: "{{ tools_path }}"
  when: tools_nvm_node_version | length > 0
  changed_when: false
