---
# One command per entry, defaulting to `<name> --version`: a tool that installed but does not start fails the run here, not the next time it is needed. A plain apt package is verified by apt itself.
- name: Tools | Run the verify commands
  ansible.builtin.shell:
    cmd: "{{ tools_entry.verify | default(tools_entry.name ~ ' --version') | replace('{home}', dotfiles_home) }}"
    executable: /bin/bash
  environment:
    PATH: "{{ tools_path }}"
  changed_when: false
  loop: >-
    {{ tools_debs + tools_binaries + tools_scripts + tools_uv_tools + tools_gh_extensions
       + (tools_apt_repos | selectattr('verify', 'defined') | list)
       + [{'name': 'uv'}] }}
  loop_control:
    loop_var: tools_entry
    label: "{{ tools_entry.name }}"

- name: Tools | Verify node
  ansible.builtin.shell:
    cmd: . "$NVM_DIR/nvm.sh" && nvm --version && node --version && npm --version
    executable: /bin/bash
  environment:
    NVM_DIR: "{{ tools_nvm_dir }}"
    PATH: "{{ tools_path }}"
  changed_when: false
  when: tools_nvm_version | length > 0

- name: Tools | Read the skills lock again
  ansible.builtin.slurp:
    src: "{{ tools_agent_skill_lock_file }}"
  register: tools_agent_skill_lock_after
  failed_when: false

- name: Tools | Assert the agent skills are installed
  ansible.builtin.assert:
    that:
      - tools_agent_skill_missing | length == 0
    fail_msg: "The skills CLI did not install: {{ tools_agent_skill_missing | join(', ') }}"
    quiet: true
  loop: "{{ tools_agent_skills }}"
  loop_control:
    loop_var: tools_agent_skill
    label: "{{ tools_agent_skill.source }}"
  vars:
    tools_agent_skill_lock: "{{ tools_agent_skill_lock_after }}"
