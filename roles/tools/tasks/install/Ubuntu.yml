---
# Order matters only where one kind depends on another: repositories before their packages, and the uv installer (a script) before uv tools.

# deb822_repository is implemented on top of python3-debian, which is not installed by default on a minimal Ubuntu image.
- name: Tools | Install the deb822 dependency
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: tools_apt_repos | length > 0

# Left behind by the pre-deb822 docker role, which used the deprecated apt_key module. Removing them prevents a duplicate-source warning on every apt update and drops a key from the legacy trusted keyring.
- name: Tools | Remove pre-deb822 docker artefacts
  ansible.builtin.file:
    path: "{{ tools_docker_legacy_artifact }}"
    state: absent
  become: true
  loop: "{{ tools_docker_legacy_artifacts }}"
  loop_control:
    loop_var: tools_docker_legacy_artifact
  when: tools_docker_enabled | bool

- name: Tools | Configure the apt repositories
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/kinds/apt_repo.yml"
  vars:
    tools_repo_uri: "{{ tools_repo.uri | replace('{codename}', ansible_facts.distribution_release) }}"
    tools_repo_suite: "{{ tools_repo.suite | default('{codename}') | replace('{codename}', ansible_facts.distribution_release) }}"
  loop: "{{ tools_apt_repos }}"
  loop_control:
    loop_var: tools_repo
    label: "{{ tools_repo.name }}"

- name: Tools | Install the apt packages
  ansible.builtin.apt:
    name: "{{ tools_apt + (tools_apt_repos | map(attribute='packages') | flatten) }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: (tools_apt + (tools_apt_repos | map(attribute='packages') | flatten)) | length > 0

- name: Tools | Install the .deb releases
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/kinds/deb.yml"
  loop: "{{ tools_debs }}"
  loop_control:
    loop_var: tools_deb
    label: "{{ tools_deb.name }}"

- name: Tools | Install the release binaries
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/kinds/binary.yml"
  loop: "{{ tools_binaries }}"
  loop_control:
    loop_var: tools_binary
    label: "{{ tools_binary.name }}"

- name: Tools | Run the installer scripts
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/kinds/script.yml"
  loop: "{{ tools_scripts }}"
  loop_control:
    loop_var: tools_script
    label: "{{ tools_script.name }}"

# After the installer scripts, which put the agent CLIs in place.
- name: Tools | Install the agent CLI plugins
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/kinds/agent_plugin.yml"
  loop: "{{ tools_agent_plugins }}"
  loop_control:
    loop_var: tools_agent_plugin
    label: "{{ tools_agent_plugin.plugin }} ({{ tools_agent_plugin.cli }})"

# After the installer scripts, which put nvm in place.
- name: Tools | Install the nvm node
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/kinds/nvm.yml"
  when: tools_nvm_node_version | length > 0

# After the nvm node, which runs the skills CLI.
- name: Tools | Assert the agent skills have a node and agents
  ansible.builtin.assert:
    that:
      - tools_nvm_node_version | length > 0
      - tools_agent_skills_cli_version | length > 0
      - tools_agent_skill_agents | length > 0
      - tools_agent_skill_agents | difference(tools_agent_skill_dirs.keys()) | length == 0
    fail_msg: >-
      tools_agent_skills needs tools_nvm_node_version, tools_agent_skills_cli_version and tools_agent_skill_agents, and every agent in tools_agent_skill_dirs ({{ tools_agent_skill_dirs.keys() | join(', ') }}).
    quiet: true
  when: tools_agent_skills | length > 0

- name: Tools | Install the agent skills
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/kinds/agent_skill.yml"
  loop: "{{ tools_agent_skills }}"
  loop_control:
    loop_var: tools_agent_skill
    label: "{{ tools_agent_skill.source }}"

# After the apt packages, which install gh. Without a login: `gh extension install` needs none, unlike `gh extension list`.
- name: Tools | Install the gh extensions
  ansible.builtin.command:
    argv: [gh, extension, install, "{{ tools_gh_extension.repo }}"]
    creates: "{{ tools_gh_extension_dir }}/{{ tools_gh_extension.name }}"
  environment:
    PATH: "{{ tools_path }}"
  loop: "{{ tools_gh_extensions }}"
  loop_control:
    loop_var: tools_gh_extension
    label: "{{ tools_gh_extension.repo }}"

- name: Tools | Install the uv interpreter and tools
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/kinds/uv.yml"
  when: tools_uv_python | length > 0 or tools_uv_tools | length > 0
