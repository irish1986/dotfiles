---
- name: Tools | Ensure the config directories exist
  ansible.builtin.file:
    path: "{{ dotfiles_home }}/{{ tools_file.dest | dirname }}"
    state: directory
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: "0755"
  loop: "{{ tools_files }}"
  loop_control:
    loop_var: tools_file
    label: "{{ tools_file.dest | dirname }}"

- name: Tools | Deploy the config files
  ansible.builtin.copy:
    src: "{{ tools_file.src }}"
    dest: "{{ dotfiles_home }}/{{ tools_file.dest }}"
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: "0644"
  loop: "{{ tools_files }}"
  loop_control:
    loop_var: tools_file
    label: "{{ tools_file.dest }}"

# The removal list. Home-relative only: an absolute path here is almost certainly a mistake, and this runs without become.
- name: Tools | Assert the removal paths are relative to $HOME
  ansible.builtin.assert:
    that:
      - tools_remove_paths | select('match', '^/') | list | length == 0
      - tools_remove_paths | select('search', '(^|/)\.\.(/|$)') | list | length == 0
    fail_msg: "tools_remove_paths must be relative to $HOME: {{ tools_remove_paths | join(', ') }}"
    quiet: true

- name: Tools | Remove the listed paths
  ansible.builtin.file:
    path: "{{ dotfiles_home }}/{{ tools_remove_path }}"
    state: absent
  loop: "{{ tools_remove_paths }}"
  loop_control:
    loop_var: tools_remove_path

# Only packages whose removal takes nothing else with it. A stock install depends on some of these through a metapackage (tmux via byobu -> ubuntu-wsl on WSL, tmux and htop via ubuntu-server), and removing one silently removes the metapackage too; the next upgrade's autoremove then strips everything it was holding, snapd and wsl-pro-service included.
- name: Tools | Simulate removing the listed apt packages
  ansible.builtin.command:
    argv: [apt-get, --simulate, --quiet, remove, "{{ tools_remove_pkg }}"]
  environment:
    LC_ALL: C
  register: tools_remove_sim
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ tools_remove_apt }}"
  loop_control:
    loop_var: tools_remove_pkg

- name: Tools | Register the packages safe to remove
  ansible.builtin.set_fact:
    # "Remv <pkg> [...]": exactly one such line means the package goes alone. None means it is not installed.
    tools_remove_safe: >-
      {{ tools_remove_sim.results
         | selectattr('stdout', 'search', '(?m)^Remv ')
         | rejectattr('stdout', 'search', '(?ms)^Remv .*^Remv ')
         | map(attribute='tools_remove_pkg') | list }}
    tools_remove_held: >-
      {{ tools_remove_sim.results
         | selectattr('stdout', 'search', '(?ms)^Remv .*^Remv ')
         | map(attribute='tools_remove_pkg') | list }}

- name: Tools | Report packages kept because other packages depend on them
  ansible.builtin.debug:
    msg: >-
      Kept {{ tools_remove_held | join(', ') }}: removing them would also remove packages that depend on them, such as a distribution metapackage.
  when: tools_remove_held | length > 0

- name: Tools | Remove the listed apt packages
  ansible.builtin.apt:
    name: "{{ tools_remove_safe }}"
    state: absent
  become: true
  when: tools_remove_safe | length > 0
