---
# try-restart: restarts docker only if it is running, and is a no-op before the tools role has installed it -- this role runs first.
- name: Network | Restart docker
  ansible.builtin.systemd_service:
    name: docker
    state: restarted
    daemon_reload: true
  become: true
  when: dotfiles_has_systemd | bool
  failed_when: false
