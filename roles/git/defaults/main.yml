---
git_packages:
  - git
  - git-lfs
  # Replaces the deleted bfg role: same job, no JRE, and packaged from 24.04.
  - git-filter-repo

# Identity, set in the local file. Left empty, the role skips user.*, commit signing and the allowed signer, and warns.
git_user_email: ""
git_user_name: ""
git_user_login: ""
git_signing_key: id_ed25519.pub

# Directory created for checkouts, under ~/git/<login>.
git_manage_project_dir: true

# Written verbatim into ~/.gitconfig. Override or extend in group_vars.
git_config:
  advice.diverging: false
  branch.sort: -committerdate
  color.ui: auto
  column.ui: auto
  commit.gpgsign: true
  commit.verbose: true
  # false, not input: this is a Linux checkout even when the host is Windows.
  core.autocrlf: false
  core.editor: code --wait
  diff.algorithm: histogram
  diff.colorMoved: zebra
  fetch.all: true
  fetch.prune: true
  fetch.pruneTags: true
  fetch.writeCommitGraph: true
  gpg.format: ssh
  help.autocorrect: prompt
  init.defaultBranch: main
  log.abbrevCommit: true
  pull.rebase: true
  push.autoSetupRemote: true
  push.default: simple
  push.followTags: true
  rebase.autoStash: true
  rerere.autoupdate: true
  rerere.enabled: true
  status.short: true
  tag.gpgsign: true
  tag.sort: version:refname

# gh, which the tools role installs from base.yml. Written through `gh config set`, the same way git_config goes through git_config: gh rewrites config.yml itself, maintaining a `version` key of its own, so a template would fight it on every run. Skipped when gh is not installed.
git_gh_config_dir: "{{ dotfiles_home }}/.config/gh"
git_gh_config:
  git_protocol: ssh
  # Matches core.editor above.
  editor: code --wait
  prompt: enabled
git_gh_aliases:
  co: pr checkout
  pv: pr view
  st: status
