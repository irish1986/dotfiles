---
# Orchestrator only: no module calls other than include_vars / include_tasks.

- name: Git | Load release specific variables
  ansible.builtin.include_vars: "{{ git_vars_file }}"
  loop: "{{ query('ansible.builtin.first_found', git_vars_lookup) }}"
  loop_control:
    loop_var: git_vars_file
  vars:
    git_vars_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"
      skip: true
  tags:
    - git
    - dev

- name: Git | Install
  ansible.builtin.include_tasks: "{{ git_install_tasks }}"
  vars:
    git_install_tasks: "{{ lookup('ansible.builtin.first_found', git_install_lookup) }}"
    git_install_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/tasks/install"
  tags:
    - git
    - dev
    - install

- name: Git | Configure
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/configure.yml"
  tags:
    - git
    - dev
    - configure

- name: Git | Verify
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/verify.yml"
  when: not ansible_check_mode
  tags:
    - git
    - dev
    - verify
