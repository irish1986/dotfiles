---
- name: Git | Deploy the global gitignore
  ansible.builtin.copy:
    src: .gitignore
    dest: "{{ git_ignore_file }}"
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: "0644"

- name: Git | Create the project directory
  ansible.builtin.file:
    path: "{{ git_project_dir }}"
    state: directory
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: "0700"
  when:
    - git_manage_project_dir | bool
    - git_user_login | length > 0

# A warning, not a failure: a fresh bootstrap has no identity yet, and failing here would stop the rest of the machine converging over two strings.
- name: Git | Warn about a missing identity
  ansible.builtin.debug:
    msg: >-
      git_user_name and git_user_email are not set, so ~/.gitconfig gets no user.name, user.email or signing identity. Set them in {{ dotfiles_local_file }}.
  when: not (git_identity_set | bool)

- name: Git | Detect the signing key
  ansible.builtin.stat:
    path: "{{ git_signing_key_path }}"
  register: git_signing_key_stat

# Signing is all or nothing: gpgsign=true without a key makes every `git commit` fail with "Couldn't load public key", which on a fresh machine is every commit until a key is generated.
- name: Git | Register whether commits can be signed
  ansible.builtin.set_fact:
    git_signing_ready: "{{ (git_identity_set | bool) and git_signing_key_stat.stat.exists }}"

- name: Git | Warn about a missing signing key
  ansible.builtin.debug:
    msg: >-
      {{ git_signing_key_path }} does not exist, so commit and tag signing are turned off. Create the key, or point git_signing_key in {{ dotfiles_local_file }} at an existing one, and re-run --tags git.
  when:
    - git_identity_set | bool
    - not git_signing_key_stat.stat.exists

- name: Git | Configure commit signing
  when: git_signing_ready | bool
  block:
    - name: Git | Read the signing key
      ansible.builtin.slurp:
        src: "{{ git_signing_key_path }}"
      register: git_signing_key_content

    # marker: keyed on the email, so rotating a key replaces that signer's line instead of appending a second one. Without it blockinfile grows the file every time the key changes.
    - name: Git | Add the allowed signer
      ansible.builtin.blockinfile:
        path: "{{ git_allowed_signers }}"
        marker: "# {mark} ANSIBLE MANAGED BLOCK {{ git_user_email }}"
        create: true
        owner: "{{ dotfiles_user }}"
        group: "{{ dotfiles_user }}"
        mode: "0644"
        block: |
          {{ git_user_email }} {{ git_signing_key_content.content | b64decode | trim }}

- name: Git | Write the git configuration
  community.general.git_config:
    name: "{{ git_config_entry.key }}"
    value: "{{ git_config_entry.value }}"
    scope: file
    file: "{{ git_config_file }}"
  loop: >-
    {{ (git_config | combine(git_computed_config)
        | combine({} if git_signing_ready | bool else git_signing_off_config)) | dict2items }}
  loop_control:
    loop_var: git_config_entry
    label: "{{ git_config_entry.key }}"
  when: git_config_entry.value | string | length > 0

- name: Git | Detect gh
  ansible.builtin.stat:
    path: "{{ git_gh_binary }}"
  register: git_gh_present

- name: Git | Configure gh
  when: git_gh_present.stat.exists
  block:
    - name: Git | Ensure the gh configuration directory exists
      ansible.builtin.file:
        path: "{{ git_gh_config_dir }}"
        state: directory
        owner: "{{ dotfiles_user }}"
        group: "{{ dotfiles_user }}"
        mode: "0700"

    - name: Git | Read the current gh configuration
      ansible.builtin.command: "{{ git_gh_binary }} config get {{ git_gh_entry.key }}"
      environment: "{{ git_gh_environment }}"
      register: git_gh_config_current
      loop: "{{ git_gh_config | dict2items }}"
      loop_control:
        loop_var: git_gh_entry
        label: "{{ git_gh_entry.key }}"
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Git | Write the gh configuration
      ansible.builtin.command: >-
        {{ git_gh_binary }} config set {{ git_gh_result.git_gh_entry.key }}
        {{ git_gh_result.git_gh_entry.value | quote }}
      environment: "{{ git_gh_environment }}"
      loop: "{{ git_gh_config_current.results }}"
      loop_control:
        loop_var: git_gh_result
        label: "{{ git_gh_result.git_gh_entry.key }}"
      when: git_gh_result.stdout | trim != git_gh_result.git_gh_entry.value
      changed_when: true

    - name: Git | Read the current gh aliases
      ansible.builtin.command: "{{ git_gh_binary }} alias list"
      environment: "{{ git_gh_environment }}"
      register: git_gh_alias_list
      changed_when: false
      failed_when: false
      check_mode: false

    # `gh alias list` prints one "name: expansion" line per alias, so matching the whole line catches a changed expansion as well as a missing alias. --clobber because a plain `alias set` fails on an alias that already exists.
    - name: Git | Write the gh aliases
      ansible.builtin.command: >-
        {{ git_gh_binary }} alias set {{ git_gh_alias.key }}
        {{ git_gh_alias.value | quote }} --clobber
      environment: "{{ git_gh_environment }}"
      loop: "{{ git_gh_aliases | dict2items }}"
      loop_control:
        loop_var: git_gh_alias
        label: "{{ git_gh_alias.key }}"
      when: >-
        git_gh_alias_list.stdout | default('')
        is not search('^' ~ (git_gh_alias.key | regex_escape) ~ ': '
                      ~ (git_gh_alias.value | regex_escape) ~ '$', multiline=True)
      changed_when: true
