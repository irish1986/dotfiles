---
# git_repos (specs/adr/0013): each missing checkout is cloned once and an existing one is never touched. Every problem is collected into one warning at the end, so one bad entry never stops the rest of the machine.

# dest: the entry's own, or ~/git/<owner>/<repo> when the URL's path is exactly owner/repo. ssh_host: the host of an SSH URL (scp-like or ssh://), empty for any other URL.
- name: Git | Resolve the repos
  ansible.builtin.set_fact:
    git_repos_resolved: "{{ git_repos_resolved | default([]) + [{'url': git_repo.url, 'dest': git_repo_dest, 'ssh_host': git_repo_ssh_host}] }}"
  loop: "{{ git_repos }}"
  loop_control:
    loop_var: git_repo
    label: "{{ git_repo.url }}"
  vars:
    git_repo_path: >-
      {{ git_repo.url | regex_replace('^[a-z][a-z0-9+.-]*://[^/]+/', '') | regex_replace('^[^/:]+:', '') | regex_replace('(\.git)?/*$', '') }}
    git_repo_dest: >-
      {{ (git_repo.dest | regex_replace('^~(?=/|$)', dotfiles_home)) if git_repo.dest is defined
         else ((git_repos_dir ~ '/' ~ git_repo_path) if git_repo_path.split('/') | length == 2 else '') }}
    git_repo_ssh_host: >-
      {{ (git_repo.url | regex_replace('^ssh://(?:[^@/]+@)?([^/:]+).*$', '\1')) if git_repo.url is match('ssh://')
         else ('' if '://' in git_repo.url or ':' not in git_repo.url
               else git_repo.url | regex_replace('^(?:[^@/:]+@)?([^/:]+):.*$', '\1')) }}

# The one failure: a typo'd entry should be fixed, not warned about forever.
- name: Git | Assert every repo has a directory
  ansible.builtin.assert:
    that:
      - git_repo.dest | length > 0
    fail_msg: The path of {{ git_repo.url }} is not owner/repo, so its directory cannot be derived; give the git_repos entry a dest.
    quiet: true
  loop: "{{ git_repos_resolved | default([]) }}"
  loop_control:
    loop_var: git_repo
    label: "{{ git_repo.url }}"

# Only the derived ones: a dest of your own may sit in a directory whose mode is not ours to change.
- name: Git | Create the owner directories
  ansible.builtin.file:
    path: "{{ git_repo_owner_dir }}"
    state: directory
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: "0700"
  loop: >-
    {{ git_repos_resolved | default([]) | map(attribute='dest')
       | select('match', (git_repos_dir ~ '/') | regex_escape) | map('dirname') | unique }}
  loop_control:
    loop_var: git_repo_owner_dir

# All the entries in one task, git_repos_parallel at a time: dozens of clones one after another would dominate a fresh machine's run. Each entry is three stdin lines (url, dest, ssh_host; an empty line is an empty field), so no field is ever word-split. Problems go to stderr, one line each, and become the warning below; stdout names each repo cloned. BatchMode and no terminal prompt: a key, host or password that would need a person fails at once instead of hanging the run. ControlMaster=no: a persisted master would hold the captured output open for ControlPersist. A failed clone removes what it created.
- name: Git | Clone the missing repos
  ansible.builtin.shell:
    cmd: |
      clone_repo() {
        local url="$1" dest="$2" ssh_host="$3" origin error config
        if [ -e "$dest" ]; then
          if [ ! -e "$dest/.git" ]; then
            echo "$dest exists but is not a git checkout; left alone." >&2
          elif origin="$(git -C "$dest" remote get-url origin 2>/dev/null)"; [ "$origin" != "$url" ]; then
            echo "$dest has origin ${origin:-unset}, not $url; left alone." >&2
          fi
          return 0
        fi
        if [ -n "$ssh_host" ] && ! ssh-keygen -F "$ssh_host" -f "$GIT_REPOS_KNOWN_HOSTS" >/dev/null 2>&1; then
          echo "$url was not cloned: $ssh_host has no key in $GIT_REPOS_KNOWN_HOSTS." >&2
          return 0
        fi
        if ! error="$(git clone --quiet "$url" "$dest" 2>&1)"; then
          echo "$url did not clone: ${error%%$'\n'*}" >&2
          return 0
        fi
        echo "cloned $url"
        for config in .pre-commit-config.yaml .pre-commit-config.yml prek.toml; do
          if [ -f "$dest/$config" ]; then
            if ! (cd "$dest" && "$HOME/.local/bin/prek" install) >/dev/null 2>&1; then
              echo "prek install failed in $dest; run it there by hand." >&2
            fi
            break
          fi
        done
      }
      export -f clone_repo
      xargs -d '\n' -n 3 -P "$GIT_REPOS_PARALLEL" bash -c 'clone_repo "$@"' _
    executable: /bin/bash
    # Every line already ends in a newline: one more would be a stray empty entry.
    stdin: |
      {% for git_repo in git_repos_resolved %}
      {{ git_repo.url }}
      {{ git_repo.dest }}
      {{ git_repo.ssh_host }}
      {% endfor %}
    stdin_add_newline: false
  environment:
    GIT_REPOS_PARALLEL: "{{ git_repos_parallel }}"
    GIT_REPOS_KNOWN_HOSTS: "{{ ssh_known_hosts_file }}"
    GIT_TERMINAL_PROMPT: "0"
    GIT_SSH_COMMAND: ssh -o BatchMode=yes -o ControlMaster=no
  register: git_repos_cloned
  changed_when: git_repos_cloned.stdout_lines | length > 0
  when: git_repos_resolved | default([]) | length > 0

- name: Git | Report the repo problems
  ansible.builtin.debug:
    msg: "{{ git_repos_cloned.stderr_lines }}"
  when: git_repos_cloned.stderr_lines | default([]) | length > 0
