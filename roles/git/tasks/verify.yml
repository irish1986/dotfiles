---
- name: Git | Query the installed version
  ansible.builtin.command: git --version # noqa: command-instead-of-module
  changed_when: false

- name: Git | Read back the configuration
  ansible.builtin.command:
    argv: [git, config, --file, "{{ git_config_file }}", --get, "{{ git_entry.key }}"]
  register: git_config_check
  changed_when: false
  failed_when: git_config_check.stdout != git_entry.value
  loop: "{{ git_config_wanted }}"
  loop_control:
    loop_var: git_entry
    label: "{{ git_entry.key }}"
