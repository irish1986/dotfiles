---
git_binary: git
git_gh_binary: /usr/bin/gh
# gh resolves its config directory from XDG_CONFIG_HOME, which need not agree with git_gh_config_dir; setting it on every call makes the role write where it says it writes.
git_gh_environment:
  GH_CONFIG_DIR: "{{ git_gh_config_dir }}"
git_identity_set: "{{ git_user_name | length > 0 and git_user_email | length > 0 }}"
git_config_file: "{{ dotfiles_home }}/.gitconfig"
git_ignore_file: "{{ dotfiles_home }}/.gitignore"
git_signing_key_path: "{{ dotfiles_home }}/.ssh/{{ git_signing_key }}"
git_allowed_signers: "{{ dotfiles_home }}/.ssh/allowed_signers"
git_project_dir: "{{ dotfiles_home }}/git/{{ git_user_login }}"

# Paths that must be absolute in the config file.
git_computed_config:
  core.excludesfile: "{{ git_ignore_file }}"
  gpg.ssh.allowedSignersFile: "{{ git_allowed_signers }}"
  user.email: "{{ git_user_email }}"
  user.name: "{{ git_user_name }}"
  user.signingkey: "{{ git_signing_key_path }}"

# Replaces the signing entries when there is no identity or no key. false rather than left alone, so a machine that had signing on before its key went missing is corrected; empty values are skipped by the writer.
git_signing_off_config:
  commit.gpgsign: false
  tag.gpgsign: false
  user.signingkey: ""
  gpg.ssh.allowedSignersFile: ""
