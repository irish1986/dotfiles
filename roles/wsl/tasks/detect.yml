---
# Interop, not WSL. /run/WSL is present whenever the interop server is running; it is absent when [interop] enabled=false, and every Windows-side task in this role depends on interop rather than on merely being inside WSL.
- name: WSL | Detect interop
  ansible.builtin.stat:
    path: /run/WSL
  register: wsl_interop_stat
  become: false

- name: WSL | Register interop availability
  ansible.builtin.set_fact:
    wsl_interop_available: "{{ wsl_interop_stat.stat.exists }}"

- name: WSL | Resolve the Windows user profile
  when: wsl_interop_available | bool
  block:
    # chdir is mandatory. Run from a WSL path, cmd.exe emits three lines of UNC warning on stdout *before* the value, which then has to be parsed off. Resolving the profile path rather than the user name also survives C:\Users\name.DOMAIN, redirected profiles and a non-C: profile drive.
    - name: WSL | Query USERPROFILE
      ansible.builtin.command:
        cmd: "{{ wsl_cmd }} /c echo %USERPROFILE%"
        chdir: /mnt/c
      register: wsl_userprofile
      changed_when: false
      failed_when: false
      check_mode: false
      become: false

    - name: WSL | Query USERPROFILE via PowerShell
      ansible.builtin.command:
        argv:
          - "{{ wsl_powershell }}"
          - -NoProfile
          - -NonInteractive
          - -Command
          - "[Console]::Out.Write($env:USERPROFILE)"
        chdir: /mnt/c
      register: wsl_userprofile_ps
      changed_when: false
      failed_when: false
      check_mode: false
      become: false
      when: wsl_userprofile.rc != 0 or (wsl_userprofile.stdout | trim | length) == 0

    - name: WSL | Translate the profile path to a WSL path
      ansible.builtin.command:
        argv:
          - wslpath
          - -u
          - "{{ (wsl_userprofile.stdout | trim) if (wsl_userprofile.stdout | trim | length) > 0
                else (wsl_userprofile_ps.stdout | default('') | trim) }}"
      register: wsl_windows_home_path
      changed_when: false
      failed_when: false
      check_mode: false
      become: false

- name: WSL | Register the Windows host facts
  ansible.builtin.set_fact:
    # Falls back to the configured user name so the role degrades rather than failing when interop is unavailable.
    wsl_windows_home: >-
      {{ (wsl_windows_home_path.stdout | default('') | trim)
         if (wsl_windows_home_path.stdout | default('') | trim | length) > 0
         else '/mnt/c/Users/' ~ dotfiles_windows_user }}

- name: WSL | Register the detected Windows user
  ansible.builtin.set_fact:
    wsl_windows_user: "{{ wsl_windows_home | basename }}"

- name: WSL | Show the Windows host facts
  ansible.builtin.debug:
    msg: >-
      interop={{ wsl_interop_available }}
      windows_home={{ wsl_windows_home }}
      windows_user={{ wsl_windows_user }}
