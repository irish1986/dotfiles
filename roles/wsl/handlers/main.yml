---
# Deliberately messages, not actions. `wsl --terminate` and `wsl --shutdown` must run from Windows; invoking either from inside the distro kills the playbook mid-run. Two scopes, because wsl.conf is read when this distro starts while .wslconfig is read when the shared VM boots -- and --shutdown stops every distro, so asking for it when a terminate would do costs the user their other sessions.
- name: WSL | Terminate required
  ansible.builtin.debug:
    msg: >-
      wsl.conf changed. Close this distro's terminals, run `wsl --terminate {{ wsl_distro_name | default('<distro>', true) }}` from PowerShell or CMD, reopen it, and re-run the playbook to finish anything that needed the new settings (systemd services, mount options, hostname).

- name: WSL | Shutdown required
  ansible.builtin.debug:
    msg: >-
      .wslconfig changed. It applies to the whole WSL VM, so every distro must stop: run `wsl --shutdown` from PowerShell or CMD, then reopen.

- name: WSL | Terminal restart required
  ansible.builtin.debug:
    msg: >-
      Fonts were installed or registered with Windows. Restart Windows Terminal to pick them up -- already-running processes do not see newly registered fonts.
