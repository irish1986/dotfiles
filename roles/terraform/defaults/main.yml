---
terraform_packages:
  - terraform

terraform_dependencies:
  - apt-transport-https
  - ca-certificates
  - curl

# HashiCorp is the worst codename laggard of the repositories used here, often
# months behind a new Ubuntu release, so the suite probe earns its keep.
terraform_apt_uri: https://apt.releases.hashicorp.com
terraform_apt_key_url: https://apt.releases.hashicorp.com/gpg
terraform_apt_suite: "{{ ansible_distribution_release }}"
terraform_apt_suite_fallback: noble
terraform_apt_components:
  - main
