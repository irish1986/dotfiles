---
# Orchestrator only: no module calls other than include_vars / include_tasks.

- name: Terraform | Load release specific variables
  ansible.builtin.include_vars: "{{ terraform_vars_file }}"
  loop: "{{ query('ansible.builtin.first_found', terraform_vars_lookup) }}"
  loop_control:
    loop_var: terraform_vars_file
  vars:
    terraform_vars_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"
      skip: true
  tags:
    - terraform
    - iac

- name: Terraform | Install
  ansible.builtin.include_tasks: "{{ terraform_install_tasks }}"
  vars:
    terraform_install_tasks: "{{ lookup('ansible.builtin.first_found', terraform_install_lookup) }}"
    terraform_install_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/tasks/install"
  tags:
    - terraform
    - iac
    - install

- name: Terraform | Verify
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/verify.yml"
  when: not ansible_check_mode
  tags:
    - terraform
    - iac
    - verify
