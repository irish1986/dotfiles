---
- name: Terraform | Query the installed version
  ansible.builtin.command: "{{ terraform_binary }} version"
  register: terraform_version_check
  changed_when: false
  failed_when: false

- name: Terraform | Assert terraform is usable
  ansible.builtin.assert:
    that:
      - terraform_version_check.rc == 0
      - "'Terraform v' in terraform_version_check.stdout"
    fail_msg: "terraform did not install correctly: {{ terraform_version_check.stderr | default('no output') }}"
    success_msg: "{{ terraform_version_check.stdout_lines | first | default('terraform installed') }}"
    quiet: true
