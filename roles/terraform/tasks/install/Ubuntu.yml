---
- name: Terraform | Install dependencies
  ansible.builtin.apt:
    name: "{{ terraform_dependencies }}"
    state: present
  become: true

- name: Terraform | Remove pre-deb822 repository artefacts
  ansible.builtin.file:
    path: "{{ terraform_legacy_artifact }}"
    state: absent
  become: true
  loop: "{{ terraform_legacy_artifacts }}"
  loop_control:
    loop_var: terraform_legacy_artifact

- name: Terraform | Configure the upstream apt repository
  ansible.builtin.include_role:
    name: apt_repo
  vars:
    apt_repo_name: hashicorp
    apt_repo_uri: "{{ terraform_apt_uri }}"
    apt_repo_key_url: "{{ terraform_apt_key_url }}"
    apt_repo_suite: "{{ terraform_apt_suite }}"
    apt_repo_suite_fallback: "{{ terraform_apt_suite_fallback }}"
    apt_repo_components: "{{ terraform_apt_components }}"

- name: Terraform | Install packages
  ansible.builtin.apt:
    name: "{{ terraform_packages }}"
    state: present
  become: true
