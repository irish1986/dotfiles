---
# Asset names, not a family label. The previous value was fonts.nf: Nerd, which built .../Nerd.zip -- an asset that has never existed in a Nerd Fonts release.
fonts_nerd_fonts:
  - Hack

# Pinned (ADR 0004). A bump downloads nothing on a machine that already has the fonts: the creates: guard in the install task keys on the file, not the version.
# renovate: datasource=github-releases depName=ryanoasis/nerd-fonts
fonts_version: "3.5.1"
fonts_dir: "{{ dotfiles_home }}/.local/share/fonts"

fonts_dependencies:
  - fontconfig
  # unarchive shells out to unzip for .zip assets, and a minimal image does not carry it.
  - unzip
