---
trufflehog_version: "" # empty resolves the latest release
trufflehog_release_api: https://api.github.com/repos/trufflesecurity/trufflehog/releases/latest
trufflehog_install_dir: /usr/local/bin

# Composed from short parts rather than wrapped: a folded scalar (>-) replaces
# each newline with a space, which would corrupt the URL.
trufflehog_release_base: https://github.com/trufflesecurity/trufflehog/releases/download
trufflehog_archive: >-
  trufflehog_{{ trufflehog_resolved_version }}_linux_{{ dotfiles_dpkg_architecture }}.tar.gz
trufflehog_download_url: >-
  {{ trufflehog_release_base }}/v{{ trufflehog_resolved_version }}/{{ trufflehog_archive }}
