---
- name: Trufflehog | Query the installed version
  ansible.builtin.command: "{{ trufflehog_binary }} --version"
  register: trufflehog_version_check
  changed_when: false
  failed_when: false

- name: Trufflehog | Assert trufflehog is usable
  ansible.builtin.assert:
    that:
      - trufflehog_version_check.rc == 0
    fail_msg: "trufflehog did not install correctly: {{ trufflehog_version_check.stderr | default('no output') }}"
    success_msg: "trufflehog {{ trufflehog_resolved_version | default('') }}"
    quiet: true
