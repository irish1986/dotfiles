---
# Orchestrator only: no module calls other than include_vars / include_tasks.

- name: Trufflehog | Load release specific variables
  ansible.builtin.include_vars: "{{ trufflehog_vars_file }}"
  loop: "{{ query('ansible.builtin.first_found', trufflehog_vars_lookup) }}"
  loop_control:
    loop_var: trufflehog_vars_file
  vars:
    trufflehog_vars_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"
      skip: true
  tags:
    - trufflehog
    - sec

- name: Trufflehog | Install
  ansible.builtin.include_tasks: "{{ trufflehog_install_tasks }}"
  vars:
    trufflehog_install_tasks: "{{ lookup('ansible.builtin.first_found', trufflehog_install_lookup) }}"
    trufflehog_install_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/tasks/install"
  tags:
    - trufflehog
    - sec
    - install

- name: Trufflehog | Verify
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/verify.yml"
  when: not ansible_check_mode
  tags:
    - trufflehog
    - sec
    - verify
