---
# Orchestrator only: no module calls other than include_vars / include_tasks.

- name: Copilot | Load release specific variables
  ansible.builtin.include_vars: "{{ copilot_vars_file }}"
  loop: "{{ query('ansible.builtin.first_found', copilot_vars_lookup) }}"
  loop_control:
    loop_var: copilot_vars_file
  vars:
    copilot_vars_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"
      skip: true
  tags:
    - copilot
    - dev

- name: Copilot | Install
  ansible.builtin.include_tasks: "{{ copilot_install_tasks }}"
  vars:
    copilot_install_tasks: "{{ lookup('ansible.builtin.first_found', copilot_install_lookup) }}"
    copilot_install_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/tasks/install"
  tags:
    - copilot
    - dev
    - install

- name: Copilot | Configure
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/configure.yml"
  tags:
    - copilot
    - dev
    - configure

- name: Copilot | Verify
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/verify.yml"
  when: not ansible_check_mode
  tags:
    - copilot
    - dev
    - verify
