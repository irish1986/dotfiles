---
# The absolute path, not the bare name: the installer puts copilot under the user's ~/.local/bin, which is on PATH for an interactive shell but not for the one ansible runs commands in.
- name: Copilot | Query the installed version
  ansible.builtin.command: "{{ copilot_binary_path }} --version"
  register: copilot_version_check
  changed_when: false
  failed_when: false

- name: Copilot | Assert copilot is usable
  ansible.builtin.assert:
    that:
      - copilot_version_check.rc == 0
    fail_msg: "copilot did not install correctly: {{ copilot_version_check.stderr | default('no output') }}"
    success_msg: "copilot {{ copilot_version_check.stdout | trim }}"
    quiet: true
