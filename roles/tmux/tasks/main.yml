---
# Orchestrator only: no module calls other than include_vars / include_tasks.

- name: Tmux | Load release specific variables
  ansible.builtin.include_vars: "{{ tmux_vars_file }}"
  loop: "{{ query('ansible.builtin.first_found', tmux_vars_lookup) }}"
  loop_control:
    loop_var: tmux_vars_file
  vars:
    tmux_vars_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"
      skip: true
  tags:
    - tmux
    - shell

- name: Tmux | Install
  ansible.builtin.include_tasks: "{{ tmux_install_tasks }}"
  vars:
    tmux_install_tasks: "{{ lookup('ansible.builtin.first_found', tmux_install_lookup) }}"
    tmux_install_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/tasks/install"
  tags:
    - tmux
    - shell
    - install

- name: Tmux | Configure
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/configure.yml"
  tags:
    - tmux
    - shell
    - configure

- name: Tmux | Verify
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/verify.yml"
  when: not ansible_check_mode
  tags:
    - tmux
    - shell
    - verify
