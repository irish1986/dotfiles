---
# Orchestrator only: no module calls other than include_vars / include_tasks.

- name: Timezone | Load release specific variables
  ansible.builtin.include_vars: "{{ timezone_vars_file }}"
  loop: "{{ query('ansible.builtin.first_found', timezone_vars_lookup) }}"
  loop_control:
    loop_var: timezone_vars_file
  vars:
    timezone_vars_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"
      skip: true
  tags:
    - timezone
    - base

- name: Timezone | Install
  ansible.builtin.include_tasks: "{{ timezone_install_tasks }}"
  vars:
    timezone_install_tasks: "{{ lookup('ansible.builtin.first_found', timezone_install_lookup) }}"
    timezone_install_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/tasks/install"
  tags:
    - timezone
    - base
    - install

- name: Timezone | Verify
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/verify.yml"
  when: not ansible_check_mode
  tags:
    - timezone
    - base
    - verify
