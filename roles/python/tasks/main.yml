---
# Orchestrator only: no module calls other than include_vars / include_tasks.

- name: Python | Load release specific variables
  ansible.builtin.include_vars: "{{ python_vars_file }}"
  loop: "{{ query('ansible.builtin.first_found', python_vars_lookup) }}"
  loop_control:
    loop_var: python_vars_file
  vars:
    python_vars_lookup:
      files:
        - "{{ ansible_facts.distribution }}-{{ ansible_facts.distribution_major_version }}.yml"
        - "{{ ansible_facts.distribution }}.yml"
        - "{{ ansible_facts.os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"
      skip: true
  tags:
    - python
    - dev

- name: Python | Install
  ansible.builtin.include_tasks: "{{ python_install_tasks }}"
  vars:
    python_install_tasks: "{{ lookup('ansible.builtin.first_found', python_install_lookup) }}"
    python_install_lookup:
      files:
        - "{{ ansible_facts.distribution }}-{{ ansible_facts.distribution_major_version }}.yml"
        - "{{ ansible_facts.distribution }}.yml"
        - "{{ ansible_facts.os_family }}.yml"
      paths:
        - "{{ role_path }}/tasks/install"
  tags:
    - python
    - dev
    - install

- name: Python | Verify
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/verify.yml"
  when: not ansible_check_mode
  tags:
    - python
    - dev
    - verify
