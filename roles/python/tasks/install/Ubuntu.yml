---
- name: Python | Install packages
  ansible.builtin.apt:
    name: "{{ python_packages }}"
    state: present
  become: true

- name: Python | Install uv
  when: python_uv_enabled | bool
  block:
    - name: Python | Install dependencies
      ansible.builtin.apt:
        name: "{{ python_dependencies }}"
        state: present
      become: true

    - name: Python | Detect an existing uv
      ansible.builtin.stat:
        path: "{{ python_uv_binary }}"
      register: python_uv_existing

    - name: Python | Install uv from the upstream installer
      when: not python_uv_existing.stat.exists
      block:
        - name: Python | Create a staging file
          ansible.builtin.tempfile:
            state: file
            suffix: uv-install.sh
          register: python_uv_script
          changed_when: false

        - name: Python | Download the uv installer
          ansible.builtin.get_url:
            url: "{{ python_uv_install_url }}"
            dest: "{{ python_uv_script.path }}"
            mode: "0755"
            force: true
          changed_when: false

        - name: Python | Run the uv installer
          ansible.builtin.command: "{{ python_uv_script.path }}"
          changed_when: true
      always:
        - name: Python | Remove the staging file
          ansible.builtin.file:
            path: "{{ python_uv_script.path | default('') }}"
            state: absent
          when: python_uv_script.path is defined
          changed_when: false

    # The previous version wrapped this in failed_when: false, changed_when:
    # false *and* a rescue -- three layers of suppression, so a failure here was
    # invisible. Failures are real now; verify.yml is what catches them.
    - name: Python | Query the installed interpreters
      ansible.builtin.command: "{{ python_uv_binary }} python list --only-installed"
      environment:
        NO_COLOR: "1"
      register: python_uv_installed
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "Python | Install python {{ python_version }}"
      ansible.builtin.command: "{{ python_uv_binary }} python install {{ python_version }} --default"
      when: python_uv_installed.stdout is not search(python_version | regex_escape)
      changed_when: true
