---
- name: Python | Query the distro interpreter
  ansible.builtin.command: "{{ python_binary }} --version"
  register: python_version_check
  changed_when: false
  failed_when: false

- name: Python | Assert the distro interpreter is present
  ansible.builtin.assert:
    that:
      - python_version_check.rc == 0
    fail_msg: "{{ python_binary }} is missing: {{ python_version_check.stderr | default('no output') }}"
    success_msg: "{{ python_version_check.stdout | trim }}"
    quiet: true

# ansible_python_version is the interpreter ansible itself runs on, pinned to the distro python by inventory/hosts.yml. Asserting on it is what catches a pin that has drifted to something older than the collections require.
- name: Python | Assert the interpreter is recent enough
  ansible.builtin.assert:
    that:
      - ansible_python_version is version('3.10', '>=')
    fail_msg: "python3 is missing or too old: {{ ansible_python_version | default('unknown') }}"
    success_msg: "python {{ ansible_python_version }}"
    quiet: true
