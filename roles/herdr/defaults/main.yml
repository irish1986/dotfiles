---
# herdr publishes a standalone binary per platform and no Linux package, so there is no apt repository to point at -- the same arrangement as snyk in profiles/work.yml. The upstream one-liner (`curl -fsSL https://herdr.dev/install.sh | sh`) is not used: it only ever installs the latest release, so a pin would be impossible and every run would be unguarded.
# Pinned, because herdr is not an ordinary tool here: native agent-session restore carries a per-agent minimum herdr version, so a floating multiplexer can change restore behaviour under a session that is already open. Set to "" to resolve the latest release instead.
#
# After a bump, the herdr agent integrations (the hooks herdr installs into ~/.claude and ~/.copilot) must be reinstalled: their versions are tied to herdr's, and an outdated hook silently stops reporting agent state and session refs, which is what restore resumes from. Check with `herdr integration status`.
#
# A running server keeps the old binary until it restarts: `herdr status` reports server_binary_stale. Since 0.9.0 a newer client attaches to a compatible older server without stopping it, so the restart can wait for a convenient moment.
# renovate: datasource=github-releases depName=herdrdev/herdr
herdr_version: "0.9.1"
# The same manifest `herdr update` reads, so an install and an in-place update agree on what "latest" is. It is also what makes the GitHub API unnecessary here: no rate limit, no token.
herdr_manifest_url: https://herdr.dev/latest.json
herdr_download_base: https://github.com/herdrdev/herdr/releases/download

# User-scoped, matching the upstream installer's default and where uv and prek already put their binaries. herdr is a per-user terminal multiplexer, not a system service, so nothing here needs become.
herdr_install_dir: "{{ dotfiles_home }}/.local/bin"

# herdr keeps config, plugin lock, logs and its sockets in one directory, so this is not only where config.toml lands -- it is the runtime directory too, and the role only ever writes config.toml inside it.
herdr_config_dir: "{{ dotfiles_home }}/.config/herdr"

# Upstream publishes no .sha256 beside its assets, unlike snyk. Set this to a sha256 hex digest -- alongside a pinned herdr_version -- to have get_url verify the download; empty skips verification.
herdr_checksum: ""

# Replace the login shell with the herdr client, so a terminal window opens straight into the persistent session. Written as a marker block in ~/.zshenv, so false removes the block again rather than leaving it behind.
herdr_autostart: true

# Run the server under systemd --user so it comes up at boot and restores session.json before anything attaches -- the job tmux-continuum did. Skipped on a host without systemd.
herdr_manage_service: true

# Without linger the user manager stops when the last session closes, so the unit above would only ever start on first login, which defeats the point of running it as a service.
herdr_linger: true
