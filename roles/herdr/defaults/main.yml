---

# renovate: datasource=github-releases depName=herdrdev/herdr
herdr_version: "0.9.1"
herdr_manifest_url: https://herdr.dev/latest.json
herdr_download_base: https://github.com/herdrdev/herdr/releases/download

herdr_install_dir: "{{ dotfiles_home }}/.local/bin"
herdr_config_dir: "{{ dotfiles_home }}/.config/herdr"
herdr_checksum: ""

herdr_autostart: true
herdr_manage_service: true
herdr_linger: true

# ── Paths ─────────────────────────────────────────────────────────────────
herdr_binary_path: "{{ herdr_install_dir }}/herdr"
# Asset names carry the uname machine: herdr-linux-x86_64, herdr-linux-aarch64.
herdr_target: linux-{{ ansible_facts.architecture }}
herdr_zshenv: "{{ dotfiles_home }}/.zshenv"
herdr_service_dir: "{{ dotfiles_home }}/.config/systemd/user"

# Agents whose herdr integration is installed when the agent is (the tools role installs them first).
herdr_integrations:
  - name: claude
    binary: "{{ dotfiles_home }}/.local/bin/claude"
    config_dir: "{{ dotfiles_home }}/.claude"
  - name: copilot
    binary: "{{ dotfiles_home }}/.local/bin/copilot"
    config_dir: "{{ dotfiles_home }}/.copilot"
