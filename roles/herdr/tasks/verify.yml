---
- name: Herdr | Query the installed version
  ansible.builtin.command: "{{ herdr_binary_path }} --version"
  register: herdr_version_check
  changed_when: false
  failed_when: false

- name: Herdr | Assert herdr is usable
  ansible.builtin.assert:
    that:
      - herdr_version_check.rc == 0
    fail_msg: "herdr did not install correctly: {{ herdr_version_check.stderr | default('no output') }}"
    success_msg: "{{ herdr_version_check.stdout | trim }}"
    quiet: true

- name: Herdr | Read the shell environment
  ansible.builtin.slurp:
    src: "{{ herdr_zshenv }}"
  register: herdr_zshenv_content
  when: herdr_autostart | bool

- name: Herdr | Assert the autostart block is present
  ansible.builtin.assert:
    that:
      - "'ANSIBLE MANAGED BLOCK herdr' in (herdr_zshenv_content.content | b64decode)"
      - "'exec ' ~ herdr_binary_path in (herdr_zshenv_content.content | b64decode)"
    fail_msg: "{{ herdr_zshenv }} carries no herdr autostart block; a new login shell will not enter herdr."
    success_msg: "autostart block present in {{ herdr_zshenv }}"
    quiet: true
  when: herdr_autostart | bool

- name: Herdr | Query the server unit
  ansible.builtin.systemd_service:
    name: "{{ herdr_service_name }}"
    scope: user
  register: herdr_service_state
  when: dotfiles_has_systemd | bool and herdr_manage_service | bool

# Enabled only. ActiveState is reported, not asserted: on the run that introduces the unit the server is still the one the configure phase declined to restart, so inactive is the correct state until the next boot.
- name: Herdr | Assert the server unit is enabled
  ansible.builtin.assert:
    that:
      - herdr_service_state.status.UnitFileState == 'enabled'
    fail_msg: >-
      the herdr server unit is {{ herdr_service_state.status.UnitFileState | default('missing') }};
      check `systemctl --user status {{ herdr_service_name }}`.
    success_msg: >-
      herdr server unit enabled, currently
      {{ herdr_service_state.status.ActiveState | default('unknown') }}
    quiet: true
  when: dotfiles_has_systemd | bool and herdr_manage_service | bool

- name: Herdr | Read back the installed plugins
  ansible.builtin.command: "{{ herdr_binary_path }} plugin list --json"
  register: herdr_plugin_check
  changed_when: false
  when: herdr_plugins | length > 0 or herdr_plugins_remove | length > 0

# Also catches a pinned commit that upstream no longer serves under that repository, which the install step would only have reported as a failure once.
- name: Herdr | Assert every listed plugin is installed at its pinned commit
  ansible.builtin.assert:
    that:
      - herdr_plugin.repo ~ '@' ~ herdr_plugin.commit in herdr_plugin_pins
    fail_msg: "{{ herdr_plugin.repo }} is not installed at {{ herdr_plugin.commit }} ({{ herdr_plugin.ref }}). Installed: {{ herdr_plugin_pins | join(', ') }}"
    success_msg: "{{ herdr_plugin.repo }} {{ herdr_plugin.ref }}"
    quiet: true
  loop: "{{ herdr_plugins }}"
  loop_control:
    loop_var: herdr_plugin
    label: "{{ herdr_plugin.repo }}"
  vars:
    herdr_plugin_sources: "{{ (herdr_plugin_check.stdout | from_json).result.plugins | map(attribute='source') | selectattr('owner', 'defined') }}"
    herdr_plugin_pins: >-
      {{ herdr_plugin_sources | map(attribute='owner')
         | zip(herdr_plugin_sources | map(attribute='repo'), herdr_plugin_sources | map(attribute='resolved_commit'))
         | map('join', '/') | map('regex_replace', '/([0-9a-f]{40})$', '@\1') | list }}

- name: Herdr | Assert the removed plugins are gone
  ansible.builtin.assert:
    that:
      - herdr_plugin_id not in ((herdr_plugin_check.stdout | from_json).result.plugins | map(attribute='plugin_id'))
    fail_msg: "{{ herdr_plugin_id }} is in herdr_plugins_remove but still installed."
    quiet: true
  loop: "{{ herdr_plugins_remove }}"
  loop_control:
    loop_var: herdr_plugin_id

- name: Herdr | Check the config directory
  ansible.builtin.stat:
    path: "{{ herdr_config_dir }}"
  register: herdr_config_dir_check

- name: Herdr | Find the files in the config directory
  ansible.builtin.find:
    paths: "{{ herdr_config_dir }}"
    file_type: file
    hidden: true
    recurse: false
  register: herdr_config_files_check

- name: Herdr | Assert the config directory is private
  ansible.builtin.assert:
    that:
      - herdr_config_dir_check.stat.mode == '0700'
      - herdr_config_files_check.files | rejectattr('mode', 'equalto', '0600') | list | length == 0
    fail_msg: >-
      {{ herdr_config_dir }} is {{ herdr_config_dir_check.stat.mode }}; files not 0600:
      {{ herdr_config_files_check.files | rejectattr('mode', 'equalto', '0600') | map(attribute='path') | map('basename') | join(', ') }}
    success_msg: "{{ herdr_config_dir }} is 0700, its files 0600"
    quiet: true

- name: Herdr | Read back the integration status
  ansible.builtin.command: "{{ herdr_binary_path }} integration status"
  register: herdr_integration_check
  changed_when: false

- name: Herdr | Assert each present agent's integration is current
  ansible.builtin.assert:
    that:
      - >-
        herdr_integration_check.stdout is search('^' ~ (herdr_integration.name | regex_escape) ~ ': current', multiline=True)
    fail_msg: "herdr reports the {{ herdr_integration.name }} integration as not current: {{ herdr_integration_check.stdout_lines | select('match', herdr_integration.name ~ ':') | join('') }}"
    success_msg: "{{ herdr_integration.name }} integration current"
    quiet: true
  loop: "{{ herdr_integrations }}"
  loop_control:
    loop_var: herdr_integration
    label: "{{ herdr_integration.name }}"
  when: (dotfiles_home ~ '/' ~ herdr_integration.dir) is directory
