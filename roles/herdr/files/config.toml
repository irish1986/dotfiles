# herdr configuration, deployed to ~/.config/herdr/config.toml by roles/herdr.
# Only the keys set on purpose are here; `herdr --default-config` prints every option with its default.
# Edits made on the machine (settings UI, hand edits) are overwritten on the next run: change this file instead.

onboarding = false

[theme]
name = "one-dark"

[terminal]
default_shell = "/usr/bin/zsh"

[update]
channel = "stable"
version_check = false
manifest_check = false

[keys]
prefix = "ctrl+space"

# btop is a base tools_apt package, so the popup works on every machine.
[[keys.command]]
key = "prefix+alt+t"
type = "popup"
command = "btop"
width = "80%"
height = "80%"

[worktrees]
directory = "~/git/.worktrees"

[ui]
pane_gaps = false
show_agent_labels_on_pane_borders = true
prompt_new_tab_name = false
prompt_new_workspace_name = false

[ui.toast]
delivery = "herdr"

[experimental]
pane_history = true
