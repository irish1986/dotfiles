# herdr configuration. Managed by the dotfiles playbook (roles/herdr): the repository owns this file, and edits made here or through herdr's settings are replaced on the next run.
#
# Only settings that differ from herdr's defaults, each with the reason. The full reference: https://herdr.dev/docs/config-reference/
# Everything not listed runs at its default, including [session] resume_agents_on_restore = true, which ADR 0009's integration hooks exist to serve.
#
# The playbook validates this file with `herdr config check` before deploying it, then applies it with `herdr server reload-config`. A few settings apply only when the server next starts.

# Every terminal launch execs into herdr from ~/.zshenv, so an already-answered first-run screen would otherwise greet every window.
onboarding = false

[theme]
name = "one-dark"

[terminal]
# Explicit rather than $SHELL: the systemd unit starts the server without a login environment, where $SHELL may be unset and panes would fall back to /bin/sh.
default_shell = "/usr/bin/zsh"

[update]
# herdr_version is pinned in the role, so Ansible decides which release is on disk (ADR 0004). A version nag would only suggest `herdr update`, which would move the binary out from under the pin.
version_check = false
# Agent-detection manifests follow the pinned binary too, so detection only changes with a reviewed bump.
manifest_check = false

[keys]
# ctrl+b is readline's backward-char, used constantly at the shell prompt.
prefix = "ctrl+space"

# prefix+f: the sessionizer project picker (profiles/base.yml).
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "sessionizer.open"
description = "open project space"

[ui]
# Shared divider borders take less room than separated panes.
pane_gaps = false
# Account-wide AI usage on the right of the tab bar: Claude's 5-hour window and Copilot's monthly premium requests. The script is deployed by the herdr role; herdr clears the entry if it fails or exceeds its timeout.
tab_bar_right = [
  { type = "command", command = "~/.local/bin/herdr-usage-segment", interval_seconds = 60, timeout_seconds = 20 },
]

# Per-agent usage from the usagebar plugin: $limit is the provider's rate-limit use, $context the context-window fill. $title and $provider replace the built-in tab and agent tokens, which usagebar fills in more reliably.
[ui.sidebar.agents]
rows = [
  ["state_icon", "$title"],
  ["$provider", "$limit"],
  ["$context"],
]

[ui.toast]
# A finished or blocked agent in a background space should be noticed without looking at herdr. "terminal" asks Windows Terminal for a Windows notification; "system" has no notification bridge under WSL.
delivery = "terminal"

[experimental]
# Restores what was on screen after a server restart, not only the layout. The capture lands in session-history.json in plaintext and can contain tokens and prompts, which is why the role keeps this directory 0700 and the processes that write it at umask 077.
pane_history = true
