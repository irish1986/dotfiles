---
# daemon-reload only. Restarting the server would kill every live pane and any agent inside it, so a changed unit is picked up deliberately, not as a side effect of an unrelated playbook run.
- name: Herdr | Reload the user daemon
  ansible.builtin.systemd_service:
    scope: user
    daemon_reload: true
  # A dead user manager (WSL first boot) would fail the reload; the unit is picked up when it next starts anyway.
  when: dotfiles_has_user_systemd | bool

# Applies config.toml to the running server in place: panes and agents survive, unlike a restart. With no server up (a fresh machine, CI) there is nothing to reload, and the next start reads the file anyway.
- name: Herdr | Reload the server config
  ansible.builtin.command: "{{ herdr_binary_path }} server reload-config"
  register: herdr_reload_config
  changed_when: herdr_reload_config.rc == 0
  failed_when:
    - herdr_reload_config.rc != 0
    - "'server_not_running' not in herdr_reload_config.stderr"
