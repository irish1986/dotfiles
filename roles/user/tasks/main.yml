---
# Orchestrator only: no module calls other than include_vars / include_tasks.

- name: User | Load release specific variables
  ansible.builtin.include_vars: "{{ user_vars_file }}"
  loop: "{{ query('ansible.builtin.first_found', user_vars_lookup) }}"
  loop_control:
    loop_var: user_vars_file
  vars:
    user_vars_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"
      skip: true
  tags:
    - user
    - base

- name: User | Install
  ansible.builtin.include_tasks: "{{ user_install_tasks }}"
  vars:
    user_install_tasks: "{{ lookup('ansible.builtin.first_found', user_install_lookup) }}"
    user_install_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/tasks/install"
  tags:
    - user
    - base
    - install

- name: User | Configure
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/configure.yml"
  tags:
    - user
    - base
    - configure

- name: User | Verify
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/verify.yml"
  when: not ansible_check_mode
  tags:
    - user
    - base
    - verify
