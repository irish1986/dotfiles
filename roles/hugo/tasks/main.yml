---
# Orchestrator only: no module calls other than include_vars / include_tasks.

- name: Hugo | Load release specific variables
  ansible.builtin.include_vars: "{{ hugo_vars_file }}"
  loop: "{{ query('ansible.builtin.first_found', hugo_vars_lookup) }}"
  loop_control:
    loop_var: hugo_vars_file
  vars:
    hugo_vars_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"
      skip: true
  tags:
    - hugo
    - web

- name: Hugo | Install
  ansible.builtin.include_tasks: "{{ hugo_install_tasks }}"
  vars:
    hugo_install_tasks: "{{ lookup('ansible.builtin.first_found', hugo_install_lookup) }}"
    hugo_install_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/tasks/install"
  tags:
    - hugo
    - web
    - install

- name: Hugo | Verify
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/verify.yml"
  when: not ansible_check_mode
  tags:
    - hugo
    - web
    - verify
