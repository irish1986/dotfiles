---
# Orchestrator only: no module calls other than include_vars / include_tasks.

- name: VSCode | Load release specific variables
  ansible.builtin.include_vars: "{{ vscode_vars_file }}"
  loop: "{{ query('ansible.builtin.first_found', vscode_vars_lookup) }}"
  loop_control:
    loop_var: vscode_vars_file
  vars:
    vscode_vars_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"
      skip: true
  tags:
    - vscode
    - dev

- name: VSCode | Install
  ansible.builtin.include_tasks: "{{ vscode_install_tasks }}"
  vars:
    vscode_install_tasks: "{{ lookup('ansible.builtin.first_found', vscode_install_lookup) }}"
    vscode_install_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/tasks/install"
  tags:
    - vscode
    - dev
    - install

- name: VSCode | Verify
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/verify.yml"
  when: not ansible_check_mode
  tags:
    - vscode
    - dev
    - verify
