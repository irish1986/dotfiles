---
# Orchestrator only: no module calls other than include_vars / include_tasks.

- name: Update | Load release specific variables
  ansible.builtin.include_vars: "{{ update_vars_file }}"
  loop: "{{ query('ansible.builtin.first_found', update_vars_lookup) }}"
  loop_control:
    loop_var: update_vars_file
  vars:
    update_vars_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"
      skip: true
  tags:
    - update
    - base

- name: Update | Install
  ansible.builtin.include_tasks: "{{ update_install_tasks }}"
  vars:
    update_install_tasks: "{{ lookup('ansible.builtin.first_found', update_install_lookup) }}"
    update_install_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/tasks/install"
  tags:
    - update
    - base
    - install

- name: Update | Verify
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/verify.yml"
  when: not ansible_check_mode
  tags:
    - update
    - base
    - verify
