---
# Orchestrator only: no module calls other than include_vars / include_tasks.

- name: Fastfetch | Load release specific variables
  ansible.builtin.include_vars: "{{ fastfetch_vars_file }}"
  loop: "{{ query('ansible.builtin.first_found', fastfetch_vars_lookup) }}"
  loop_control:
    loop_var: fastfetch_vars_file
  vars:
    fastfetch_vars_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"
      skip: true
  tags:
    - fastfetch
    - shell

- name: Fastfetch | Install
  ansible.builtin.include_tasks: "{{ fastfetch_install_tasks }}"
  vars:
    fastfetch_install_tasks: "{{ lookup('ansible.builtin.first_found', fastfetch_install_lookup) }}"
    fastfetch_install_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/tasks/install"
  tags:
    - fastfetch
    - shell
    - install

- name: Fastfetch | Configure
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/configure.yml"
  tags:
    - fastfetch
    - shell
    - configure

- name: Fastfetch | Verify
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/verify.yml"
  when: not ansible_check_mode
  tags:
    - fastfetch
    - shell
    - verify
