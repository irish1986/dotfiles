---
# Orchestrator only: no module calls other than include_vars / include_tasks.

- name: Rust | Load release specific variables
  ansible.builtin.include_vars: "{{ rust_vars_file }}"
  loop: "{{ query('ansible.builtin.first_found', rust_vars_lookup) }}"
  loop_control:
    loop_var: rust_vars_file
  vars:
    rust_vars_lookup:
      files:
        - "{{ ansible_facts.distribution }}-{{ ansible_facts.distribution_major_version }}.yml"
        - "{{ ansible_facts.distribution }}.yml"
        - "{{ ansible_facts.os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"
      skip: true
  tags:
    - rust
    - dev

- name: Rust | Install
  ansible.builtin.include_tasks: "{{ rust_install_tasks }}"
  vars:
    rust_install_tasks: "{{ lookup('ansible.builtin.first_found', rust_install_lookup) }}"
    rust_install_lookup:
      files:
        - "{{ ansible_facts.distribution }}-{{ ansible_facts.distribution_major_version }}.yml"
        - "{{ ansible_facts.distribution }}.yml"
        - "{{ ansible_facts.os_family }}.yml"
      paths:
        - "{{ role_path }}/tasks/install"
  tags:
    - rust
    - dev
    - install

- name: Rust | Verify
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/verify.yml"
  when: not ansible_check_mode
  tags:
    - rust
    - dev
    - verify
