---
# Orchestrator only: no module calls other than include_vars / include_tasks.

- name: Ansible Tools | Load release specific variables
  ansible.builtin.include_vars: "{{ ansible_tools_vars_file }}"
  loop: "{{ query('ansible.builtin.first_found', ansible_tools_vars_lookup) }}"
  loop_control:
    loop_var: ansible_tools_vars_file
  vars:
    ansible_tools_vars_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"
      skip: true
  tags:
    - ansible_tools
    - dev

- name: Ansible Tools | Install
  ansible.builtin.include_tasks: "{{ ansible_tools_install_tasks }}"
  vars:
    ansible_tools_install_tasks: "{{ lookup('ansible.builtin.first_found', ansible_tools_install_lookup) }}"
    ansible_tools_install_lookup:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/tasks/install"
  tags:
    - ansible_tools
    - dev
    - install

- name: Ansible Tools | Verify
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/verify.yml"
  when: not ansible_check_mode
  tags:
    - ansible_tools
    - dev
    - verify
