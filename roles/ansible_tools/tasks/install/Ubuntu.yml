---
- name: Ansible Tools | Assert uv is available
  ansible.builtin.assert:
    that:
      - (ansible_tools_uv_binary) is file
    fail_msg: >-
      uv is not installed. The uv role provides it; list uv before ansible_tools in dotfiles_roles.
    quiet: true

- name: Ansible Tools | Remove the apt and PPA install
  when: ansible_tools_remove_apt_install | bool
  block:
    - name: Ansible Tools | Remove the conflicting packages
      ansible.builtin.apt:
        name: "{{ ansible_tools_conflicting_packages }}"
        state: absent
      become: true

    - name: Ansible Tools | Remove the PPA source
      ansible.builtin.file:
        path: "{{ ansible_tools_ppa_artifact }}"
        state: absent
      become: true
      loop: "{{ ansible_tools_ppa_artifacts }}"
      loop_control:
        loop_var: ansible_tools_ppa_artifact

# Keyed on what uv manages, not on whether a binary exists: uv refuses to overwrite an executable it did not create, so an apt-installed ansible would make a plain install fail on every run. --force adopts it once.
- name: Ansible Tools | List the uv managed tools
  ansible.builtin.command: "{{ ansible_tools_uv_binary }} tool list"
  environment:
    NO_COLOR: "1"
  register: ansible_tools_uv_list
  changed_when: false
  failed_when: false
  check_mode: false

- name: Ansible Tools | Install ansible-core
  ansible.builtin.command:
    cmd: >-
      {{ ansible_tools_uv_binary }} tool install --force {{ ansible_tools_core_package }}{{ ('==' ~ ansible_tools_core_version) if ansible_tools_core_version | length > 0 else '' }} {% for extra in ansible_tools_core_extras %}--with {{ extra }} {% endfor %}
  when: ansible_tools_uv_list.stdout is not search('^' ~ ansible_tools_core_package, multiline=True)
  changed_when: true

- name: Ansible Tools | Install the supporting tools
  ansible.builtin.command: "{{ ansible_tools_uv_binary }} tool install --force {{ ansible_tools_extra_tool }}"
  loop: "{{ ansible_tools_extra_tools }}"
  loop_control:
    loop_var: ansible_tools_extra_tool
  when: ansible_tools_uv_list.stdout is not search('^' ~ ansible_tools_extra_tool, multiline=True)
  changed_when: true
