---
# Installed with uv, not apt and not the PPA:
#
#  * ppa:ansible/ansible ships the batteries-included `ansible` package, whose bundled collections shadow the five pinned in collections/requirements.yml, and the PPA can have no pocket at all for a brand-new LTS.
#  * jammy's archive ansible-core is 2.12, below the >=2.16 those collections declare, so the distro package cannot satisfy this repo on 22.04.
#  * uv is a static binary that behaves identically on 22.04/24.04/26.04 and sidesteps PEP 668 without --break-system-packages.
ansible_tools_core_package: ansible-core
ansible_tools_core_version: "" # empty installs the latest

# Injected into the ansible-core environment so controller-side lookups can import them. bitwarden.secrets.lookup needs bitwarden_sdk importable by the interpreter running ansible-playbook; installing it as its own pipx app -- as the old pre_tasks/vault.yml did -- puts it in a venv ansible cannot see.
ansible_tools_core_extras:
  - bitwarden-sdk

ansible_tools_extra_tools:
  - ansible-lint

# Off by default, and deliberately so: on a machine bootstrapped from apt or the PPA, the ansible running this very play *is* that package. Removing it mid-run pulls the interpreter out from under the playbook. Enable it only once the uv-managed ansible is ahead on PATH, then run once to converge.
ansible_tools_remove_apt_install: false
ansible_tools_conflicting_packages:
  - ansible
  - ansible-core
