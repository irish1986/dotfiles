[defaults]

#--- General settings
nocows                      = true
forks                       = 8
deprecation_warnings        = true

# Top-level fact injection is deprecated in ansible-core 2.21 and removed in 2.24, and leaving it at the default emitted a deprecation warning per include. Facts are read as `ansible_facts.<name>`; magic vars (ansible_check_mode, ansible_version, ansible_run_tags) and connection vars are unaffected by this.
inject_facts_as_vars        = false

# Pinned to the distro interpreter rather than discovered. `uv python install --default` puts a user-owned python on PATH ahead of /usr/bin/python3, and auto-discovery follows it -- so every `become: true` task would have root executing an interpreter the login user can modify, and root-owned __pycache__ trees accumulate under ~/.local/share/uv.
interpreter_python          = /usr/bin/python3

#--- Files/Directory settings
inventory                   = ./inventory
roles_path                  = ./roles
log_path                    = ~/.ansible/ansible.log
retry_files_enabled         = false

#--- Output
# A skipped task says nothing about the machine -- the role selection and the `when` guards already record why. Roughly a quarter of the tasks in a full run are skipped, and printing each one buries the ones that did work.
display_skipped_hosts       = false

# profile_tasks is deliberately NOT enabled here. It prints a timestamp line after every task, which at ~200 tasks is most of the run's output. `scripts/setup --profile` turns it on for the runs where the timings are the point.

[inventory]
unparsed_is_failed          = true

#--- Privilege escalation
#
# `become` is deliberately NOT enabled globally. When it is, it also applies to the implicit gather_facts task, so `ansible_user_dir` resolves to /root and every task writing to the user's home creates root-owned files. Roles declare `become: true` on the individual tasks that need it.
#
# Fact caching is deliberately NOT enabled either. For a single-host localhost play it saves about a second, and it persists whatever facts were gathered -- including the /root ones above -- for the whole cache timeout.
