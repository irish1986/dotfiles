[defaults]

#--- General settings
nocows                      = true
forks                       = 8
deprecation_warnings        = true

#--- Files/Directory settings
inventory                   = ./inventory
roles_path                  = ./roles
log_path                    = ~/.ansible/ansible.log
retry_files_enabled         = false

#--- Output
callbacks_enabled           = ansible.posix.profile_tasks

[inventory]
unparsed_is_failed          = true

#--- Privilege escalation
#
# `become` is deliberately NOT enabled globally. When it is, it also applies to
# the implicit gather_facts task, so `ansible_user_dir` resolves to /root and
# every task writing to the user's home creates root-owned files. Roles declare
# `become: true` on the individual tasks that need it.
#
# Fact caching is deliberately NOT enabled either. For a single-host localhost
# play it saves about a second, and it persists whatever facts were gathered --
# including the /root ones above -- for the whole cache timeout.
