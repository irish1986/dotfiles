---
# Sets up one WSL2 Ubuntu 26.04 distro (specs/adr/0001). Safe to re-run: a second run on an unchanged machine reports changed=0, and CI checks that it does.
- name: Dotfiles
  hosts: localhost
  connection: local
  gather_facts: true

  # Every tool the run starts reads the system trust store, which holds the corporate CA on a work machine (roles/certificates). uv and node ship their own CA lists otherwise.
  environment:
    SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
    NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt

  vars:
    # Outside the checkout, so it can never be committed. DOTFILES_LOCAL_FILE points a run at another one.
    dotfiles_local_file: >-
      {{ lookup('ansible.builtin.env', 'DOTFILES_LOCAL_FILE')
         | default(lookup('ansible.builtin.env', 'HOME') ~ '/.config/dotfiles/local.yml', true) }}

  pre_tasks:
    - name: Dotfiles | Assert Ubuntu 26.04
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_version == '26.04'
        fail_msg: This playbook sets up Ubuntu 26.04 only; this is {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}.
        quiet: true
      tags: always

    # ── The layers (specs/adr/0002) ────────────────────────────────────────
    # profiles/base.yml, then profiles/<profile>.yml, then the local file. A later layer overrides scalars and dictionaries key by key and appends to lists.
    - name: Dotfiles | Assert the local file exists
      ansible.builtin.assert:
        that:
          - dotfiles_local_file is file
        fail_msg: "{{ dotfiles_local_file }} does not exist. Run scripts/setup --profile <personal|work> to create it."
        quiet: true
      tags: always

    - name: Dotfiles | Read the local file
      ansible.builtin.include_vars:
        file: "{{ dotfiles_local_file }}"
        name: dotfiles_layer_local
      tags: always

    - name: Dotfiles | Assert the profile exists
      ansible.builtin.assert:
        that:
          - dotfiles_layer_local.dotfiles_profile | default('') in ['personal', 'work']
        fail_msg: "dotfiles_profile in {{ dotfiles_local_file }} is '{{ dotfiles_layer_local.dotfiles_profile | default('') }}'; set it to personal or work."
        quiet: true
      tags: always

    - name: Dotfiles | Read the profiles
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/profiles/{{ dotfiles_layer.file }}.yml"
        name: "{{ dotfiles_layer.name }}"
      loop:
        - { name: dotfiles_layer_base, file: base }
        - { name: dotfiles_layer_profile, file: "{{ dotfiles_layer_local.dotfiles_profile }}" }
      loop_control:
        loop_var: dotfiles_layer
        label: "{{ dotfiles_layer.file }}"
      tags: always

    - name: Dotfiles | Apply the layers
      ansible.builtin.set_fact:
        "{{ dotfiles_layer.key }}": "{{ dotfiles_layer.value }}"
      loop: >-
        {{ dotfiles_layer_base
           | combine(dotfiles_layer_profile, dotfiles_layer_local, recursive=true, list_merge='append_rp')
           | dict2items }}
      loop_control:
        loop_var: dotfiles_layer
        label: "{{ dotfiles_layer.key }}"
      tags: always

    # ── Facts every role reads ────────────────────────────────────────────
    - name: Dotfiles | Detect a container
      ansible.builtin.stat:
        path: /.dockerenv
      register: dotfiles_dockerenv
      tags: always

    - name: Dotfiles | Detect systemd
      ansible.builtin.stat:
        path: "{{ dotfiles_systemd_path }}"
      register: dotfiles_systemd
      loop:
        # Present only when systemd is PID 1.
        - /run/systemd/system
        # The user's own manager, which can be dead while PID 1 is fine: on WSL's first boot user@<uid>.service often fails (microsoft/WSL#8842) until the distro restarts.
        - /run/user/{{ ansible_facts.user_uid }}/systemd/private
      loop_control:
        loop_var: dotfiles_systemd_path
      tags: always

    - name: Dotfiles | Resolve the machine facts
      ansible.builtin.set_fact:
        dotfiles_user: "{{ lookup('ansible.builtin.env', 'USER') }}"
        dotfiles_home: "{{ lookup('ansible.builtin.env', 'HOME') }}"
        dotfiles_hostname: "{{ dotfiles_hostname | default(ansible_facts.hostname, true) }}"
        dotfiles_windows_home: /mnt/c/Users/{{ dotfiles_windows_user | default(lookup('ansible.builtin.env', 'USER'), true) }}
        # A container on a WSL host runs on the same "microsoft" kernel, so the kernel alone is not enough.
        dotfiles_is_wsl: "{{ ansible_facts.kernel is search('(?i)microsoft') and not dotfiles_dockerenv.stat.exists }}"
        dotfiles_has_systemd: "{{ dotfiles_systemd.results[0].stat.exists }}"
        dotfiles_has_user_systemd: "{{ dotfiles_systemd.results[1].stat.exists }}"
        dotfiles_dpkg_architecture: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts.architecture] }}"
      tags: always

    - name: Dotfiles | Show the run
      ansible.builtin.debug:
        msg: >-
          profile={{ dotfiles_profile }} user={{ dotfiles_user }} wsl={{ dotfiles_is_wsl }}
          systemd={{ dotfiles_has_systemd }} windows_home={{ dotfiles_windows_home }}
      tags: always

  # The order matters: the corporate CA before any download, zsh before the login shell is set to it, tools (gh) before ssh and git.
  roles:
    - { role: certificates, tags: certificates }
    - { role: system, tags: system }
    - { role: zsh, tags: zsh }
    - { role: tools, tags: tools }
    - { role: ssh, tags: ssh }
    - { role: git, tags: git }
    # Last: its autostart execs into the herdr binary.
    - { role: herdr, tags: herdr }
