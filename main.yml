---
- name: DotFiles
  hosts: localhost
  connection: local
  gather_facts: true

  pre_tasks:
    - name: DotFiles | Resolve environment facts
      ansible.builtin.import_tasks: pre_tasks/facts.yml
      tags:
        - always

    - name: DotFiles | Validate the requested role selection
      ansible.builtin.import_tasks: pre_tasks/validate.yml
      tags:
        - always

    # Opt-out, not opt-in: the default is to ask. A run that converges the machine without being asked should be something you turned on -- via dotfiles_confirm, `scripts/setup --yes`, or -e -- rather than the default. Skipped under --check, which changes nothing and so has nothing to approve.
    - name: DotFiles | Confirm the run plan
      ansible.builtin.import_tasks: pre_tasks/confirm.yml
      when:
        - dotfiles_confirm | default(true) | bool
        - not ansible_check_mode
      tags:
        - always

  tasks:
    # Which roles run is decided by dotfiles_roles in group_vars, in order. --tags filters that selection for a single run; it does not replace it.
    #
    # There is deliberately no rescue: here. The previous version caught every failure from every role, printed a debug message, and then reported "Playbook ran without any issue" from a post_task -- so the play was structurally incapable of reporting failure. PLAY RECAP and the profile_tasks callback report the truth.
    - name: "DotFiles | Role: {{ dotfiles_role }}"
      ansible.builtin.include_role:
        name: "{{ dotfiles_role }}"
        apply:
          tags:
            - "{{ dotfiles_role }}"
      loop: "{{ dotfiles_roles }}"
      loop_control:
        loop_var: dotfiles_role
        label: "{{ dotfiles_role }}"
      tags:
        - always
