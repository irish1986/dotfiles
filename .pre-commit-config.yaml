---
# pre-commit install --allow-missing-config
# pre-commit autoupdate
# pre-commit run --all-files --color auto
exclude: |
  (?x)^(
    \.pre-commit-config\.yaml$
  )
fail_fast: true
default_stages:
  - pre-commit
default_install_hook_types:
  - commit-msg
  - pre-commit
repos:
  - repo: meta
    hooks:
      - id: identity
        name: "meta | pre-commit hooks"
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.13.8
    hooks:
      - id: commitizen
        name: "commitizen | validate commit messages"
        stages:
          - commit-msg
  - repo: https://github.com/gitguardian/ggshield
    rev: v1.48.0
    hooks:
      - id: ggshield
        name: "security | scan for secrets"
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        name: "git | block large files"
        args: [--maxkb=2048]
      - id: check-json
        name: "general | check JSON files"
      - id: check-toml
        name: "general | check TOML files"
      - id: check-xml
        name: "general | check XML files"
      - id: check-yaml
        name: "general | check YAML files"
      - id: end-of-file-fixer
        name: "general | fix end of file"
      - id: check-executables-have-shebangs
        name: "general | executables need a shebang"
      - id: check-shebang-scripts-are-executable
        name: "general | shebang scripts must be executable"
      - id: forbid-submodules
        name: "git | forbid submodules"
      - id: mixed-line-ending
        name: "general | fix line ending"
        args:
          - --fix=auto
      - id: pretty-format-json
        name: "general | prettify JSON files"
        args:
          - --autofix
          - --no-ensure-ascii
      - id: trailing-whitespace
        name: "general | remove trailing whitespace"
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        name: "sh | lint: run shellcheck"
        args:
          - --severity=style
          - --external-sources
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-2
    hooks:
      - id: shfmt
        name: "sh | format: run shfmt"
        args:
          - -i
          - "2"
          - -ci
          - -sr
          - -bn
          - -w
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.47.0
    hooks:
      - id: markdownlint
        name: "md | lint: run markdownlint-cli"
        args:
          - --config
          - .config/.markdown-lint.yml
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: "yaml | lint: run yamllint"
        args:
          - -c
          - .config/.yaml-lint.yml
  - repo: https://github.com/ansible-community/ansible-lint
    rev: v26.1.1
    hooks:
      # No --fix: it rewrites YAML in place mid-commit, which is opaque, and its
      # transformer crashes resolving relative include_tasks paths (it looks for
      # roles/<r>/tasks/configure.yml at the repo root). Run it deliberately
      # instead: ansible-lint -c .config/.ansible-lint.yml --fix
      # No files: either -- exclude_paths in the config is the single source of
      # scope, rather than two overlapping filters.
      - id: ansible-lint
        name: "ansible | lint: run ansible-lint"
        args:
          - -c
          - .config/.ansible-lint.yml
