---
# localhost is declared explicitly rather than left implicit. Ansible gives the
# *implicit* localhost an ansible_python_interpreter equal to the controller's
# own interpreter, at a precedence that group_vars and ansible.cfg cannot beat.
# With ansible installed by uv that path is user-writable, so `become: true`
# tasks would have root execute an interpreter the login user can modify.
all:
  children:
    workstation:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
