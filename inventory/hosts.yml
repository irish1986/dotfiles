---
# localhost is declared explicitly rather than left implicit. Ansible gives the *implicit* localhost an ansible_python_interpreter equal to the controller's own interpreter, at a precedence that group_vars and ansible.cfg cannot beat. With ansible installed by uv that path is user-writable, so `become: true` tasks would have root execute an interpreter the login user can modify.
all:
  children:
    workstation:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
          # Ubuntu 25.10+ makes sudo-rs the default sudo. It wraps the prompt ansible passes with -p ("[sudo: <prompt>] Password:"), and ansible only recognises a line that starts with its prompt, so every become task with a password times out. Classic sudo is still installed alongside as sudo.ws; use it where it exists. 24.04 has no sudo.ws and keeps plain sudo.
          ansible_become_exe: "{{ lookup('ansible.builtin.first_found', ['/usr/bin/sudo.ws', '/usr/bin/sudo']) }}"
