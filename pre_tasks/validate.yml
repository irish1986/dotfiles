---
# Fails fast on a typo in dotfiles_roles rather than part-way through a run.

- name: Validate | Assert dotfiles_roles is a non-empty list
  ansible.builtin.assert:
    that:
      - dotfiles_roles is defined
      - dotfiles_roles is sequence
      - dotfiles_roles is not string
      - dotfiles_roles | length > 0
    fail_msg: >-
      dotfiles_roles must be a non-empty list. Define it in
      inventory/group_vars/all.yml -- see docs/examples/group_vars-all.yml.
    quiet: true

- name: Validate | Assert every selected role exists
  ansible.builtin.assert:
    that:
      - (playbook_dir ~ '/roles/' ~ dotfiles_role ~ '/tasks/main.yml') is file
    fail_msg: >-
      dotfiles_roles contains '{{ dotfiles_role }}', which is not a role in
      {{ playbook_dir }}/roles.
    quiet: true
  loop: "{{ dotfiles_roles }}"
  loop_control:
    loop_var: dotfiles_role
    label: "{{ dotfiles_role }}"

- name: Validate | Assert no role is listed twice
  ansible.builtin.assert:
    that:
      - dotfiles_roles | length == dotfiles_roles | unique | length
    fail_msg: >-
      dotfiles_roles contains duplicates:
      {{ dotfiles_roles | difference(dotfiles_roles | unique) | unique | join(', ') }}
    quiet: true
